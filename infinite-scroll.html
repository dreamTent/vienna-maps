  // Do not updateOverlayBlur() here — rewriting filter/z-index every pointer move made layers jump.
}

/**
 * Centre the ortho underlay on the viewport.
 * Globe metric mode: one local-patch homography from the north-up ground plane → virt view
 * (same conditioning trick as the oblique layers). Classic: pan + optional Jacobian morph.
 */
function syncOrthoUnderlayTransform() {
  const area = document.getElementById('viewerArea');
  const orthoUnderlay = document.getElementById('orthoUnderlay');
  if (!area || !orthoUnderlay) return;
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;

  if (globeModeEnabled && orthoUnderlay._orthoGlobeMetric) {
    updateVirtualGlobeCamera();
    const virt = virtualGlobeImg || currentImage;
    const s = orthoUnderlay._orthoMetricScale;
    const minLeft = orthoUnderlay._orthoMinLeft;
    const minTop = orthoUnderlay._orthoMinTop;
    if (!virt?.pToImage || !(s > 0) || !Number.isFinite(minLeft) || !Number.isFinite(minTop)) {
      const ox = orthoUnderlay._orthoMarkerX;
      const oy = orthoUnderlay._orthoMarkerY;
      if (typeof ox === 'number' && typeof oy === 'number') {
        orthoUnderlay.style.transformOrigin = '0 0';
        orthoUnderlay.style.transform = `translate(${viewW / 2 - ox}px, ${viewH / 2 - oy}px)`;
      }
      return;
    }

    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    const originX = orthoUnderlay._orthoOriginX;
    const originY = orthoUnderlay._orthoOriginY;
    if (!Number.isFinite(originX) || !Number.isFinite(originY)) {
      const ox = orthoUnderlay._orthoMarkerX;
      const oy = orthoUnderlay._orthoMarkerY;
      orthoUnderlay.style.transformOrigin = '0 0';
      orthoUnderlay.style.transform = `translate(${viewW / 2 - ox}px, ${viewH / 2 - oy}px)`;
      return;
    }
    const baseFit = Math.min(viewW / virt.width, viewH / virt.height);
    const vScale = baseFit * viewerZoom;
    const Hvp = homographyOrthoMetricToGlobeViewport(
      virt, Z, s, originX, originY, minLeft, minTop, vScale, viewW, viewH,
    );
    orthoUnderlay.style.transformOrigin = '0 0';
    if (Hvp) {
      orthoUnderlay.style.transform = homography3x3ToMatrix3dString(Hvp);
    } else {
      const ox = orthoUnderlay._orthoMarkerX;
      const oy = orthoUnderlay._orthoMarkerY;
      orthoUnderlay.style.transform = `translate(${viewW / 2 - ox}px, ${viewH / 2 - oy}px)`;
    }
    return;
  }

  const ox = orthoUnderlay._orthoMarkerX;
  const oy = orthoUnderlay._orthoMarkerY;
  if (typeof ox !== 'number' || typeof oy !== 'number' || !Number.isFinite(ox) || !Number.isFinite(oy)) return;
  const tx = viewW / 2 - ox;
  const ty = viewH / 2 - oy;
  orthoUnderlay.style.transformOrigin = '0 0';
  if (globeModeEnabled) {
    orthoUnderlay.style.transform = `translate(${tx}px, ${ty}px)`;
    return;
  }
  const A_main = computeImageGroundJacobian(currentImage, currentRotDeg);
  const M = morphMatrixForSourceJacobian(A_main);
  orthoUnderlay.style.transform = wrapTransformWithMorphMatrix(`translate(${tx}px, ${ty}px)`, viewW, viewH, M);
}

/** Position the viewer so the marker is centred (absolute translate — same for overlay on/off). */
function scrollToMarker() {
  if (!zoomToMarker || markerDX < 0 || markerDY < 0) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  updateGroundScaleCompensation();
  syncOverlayLayersToMarker();
  area.scrollLeft = 0;
  area.scrollTop = 0;
}

// ═══════════════════════════════════════════════════════════════
//  DOWNLOAD
// ═══════════════════════════════════════════════════════════════
async function downloadCurrent() {
  if (!currentImage) return;
  const img = currentImage;
  const maxZoom = img.tileResolution.length - 1;
  const {cols, rows} = tileDims(img.width, img.height, maxZoom, img.tileResolution);
  if (!confirm(`Download ${img.name} z${maxZoom} (${cols*rows} tiles → ${img.width}×${img.height}px)?`)) return;

  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  const tasks = [];
  for (let y=0; y<rows; y++) for (let x=0; x<cols; x++) tasks.push([x,y]);

  let failed = 0;
  const BATCH = 20;
  const loadTile = (x,y) => new Promise(res => {
    const el = new Image(); //el.crossOrigin='anonymous';
    el.onload = () => { ctx.drawImage(el, x*tileSize, (rows-1-y)*tileSize, tileSize, tileSize); res(); };
    el.onerror = () => { failed++; res(); };
    el.src = `${img.remoteBaseUrl}/${img.name}/${maxZoom}/${x}/${y}.jpg`;
  });

  for (let i=0; i<tasks.length; i+=BATCH) {
    await Promise.all(tasks.slice(i,i+BATCH).map(([x,y])=>loadTile(x,y)));
    document.getElementById('viewerSub').textContent = `Downloading… ${Math.min(i+BATCH,tasks.length)}/${tasks.length}`;
  }

  try {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.92);
    a.download = `${img.name}_z${maxZoom}.jpg`;
    a.click();
  } catch(e) {
    alert(e);
    console.log(e);
    const w = window.open('','_blank');
    const urls = tasks.map(([x,y]) => `${img.remoteBaseUrl}/${img.name}/${maxZoom}/${x}/${y}.jpg`).join('\n');
    w.document.write(`<pre style="font:12px monospace;background:#0d1117;color:#c9d1d9;padding:16px">${urls}</pre>`);
  }
}

let autoSwitchTimer = null;
/** Last time performAutoSwitch ran when “Switch while moving” is on (throttle, not debounce). */
let lastThrottledAutoSwitch = 0;

/** Move search point by (dxM, dyM) metres (East=+x, North=+y) in MGI ground plane. */
function moveMarker(dxM, dyM) {
  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
  const [newLon, newLat] = wgs84ToMgi.inverse([mx + dxM, my + dyM]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
  schedulePositionSearch();
}

let lockedImages = false;
function toggleLockImages() {
  lockedImages = !lockedImages;
  const btn = document.getElementById('lockImagesBtn');
  btn.textContent = lockedImages ? '🔒 Locked' : '🔓 Lock image';
  btn.classList.toggle('active', lockedImages);
}

function toggleOverlay() {
  overlayEnabled = !overlayEnabled;
  if (!overlayEnabled) overlayStitchedOnlyMain = false;
  const btn = document.getElementById('overlayBtn');
  btn.style.opacity = overlayEnabled ? '' : '.5';
  document.getElementById('overlayLayersSel').disabled  = !overlayEnabled;
  document.getElementById('overlayBlurInput').disabled  = !overlayEnabled;
  document.getElementById('overlayBlurFixedInput').disabled = !overlayEnabled;
  document.getElementById('overlayBlurUnit').style.opacity = overlayEnabled ? '' : '.4';
  const obw = document.getElementById('overlayBlurBaseWrap');
  if (obw) obw.style.opacity = overlayEnabled ? '' : '.4';
  const st = document.getElementById('overlayStretchToMainCb');
  if (st) st.disabled = !overlayEnabled;
  const nsel = document.getElementById('overlayNeighborPreloadSel');
  if (nsel) {
    nsel.disabled = !overlayEnabled;
    nsel.style.opacity = overlayEnabled ? '' : '.4';
    if (overlayEnabled) overlayNeighborCount = Number(nsel.value) || 0;
    else overlayNeighborCount = 0;
  }
  const area = document.getElementById('viewerArea');
  if (area) area.style.overflow = 'hidden';

  // Same render path either way — only stacking / neighbors / blur differ.
  if (area) removeNeighborPreviewLayers(area);
  trimOverlayHistory();
  if (overlayEnabled) scheduleRebuildOverlayNeighborLayers(true);
  if (currentImage) {
    syncOverlayLayersToMarker();
    applyOverlayStitchedLayerVisibility();
    updateOverlayBlur();
    syncOrthoDimMainClass();
  }
}

function onOverlayLayersChange() {
  overlayMaxLayers = Number(document.getElementById('overlayLayersSel').value);
  trimOverlayHistory();
}

function onOverlayBlurChange() {
  overlayBlurFixed = Math.max(0, Number(document.getElementById('overlayBlurFixedInput')?.value) || 0);
  overlayBlurStep = Math.max(0, Number(document.getElementById('overlayBlurInput').value) || 0);
  if (document.getElementById('orbitFab')) {
    try {
      localStorage.setItem('infOverlayBlurFixed', String(overlayBlurFixed));
      localStorage.setItem('infOverlayBlurStep', String(overlayBlurStep));
    } catch (_) {}
  }
  updateOverlayBlur();
}

/** Hide stitched/auxiliary overlay layers (neighbor previews + history behind main) when overlayStitchedOnlyMain is on. */
function applyOverlayStitchedLayerVisibility() {
  if (!overlayEnabled) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const kids = Array.from(area.children);
  let lastHistIdx = -1;
  for (let i = kids.length - 1; i >= 0; i--) {
    if (kids[i]._overlayHistory) {
      lastHistIdx = i;
      break;
    }
  }
  kids.forEach((el, i) => {
    if (el.id === 'orthoUnderlay') return;
    const isMain = el._overlayHistory && i === lastHistIdx;
    const hide =
      overlayStitchedOnlyMain &&
      !isMain &&
      (el._overlayNeighborPreview || (el._overlayHistory && i !== lastHistIdx));
    el.style.visibility = hide ? 'hidden' : '';
  });
}

/** Apply blur to all overlay layers: top layer is sharp; each layer behind gets
 *  overlayBlurFixed + stepsBack * overlayBlurStep (px).
 *  Explicit z-index keeps paint order correct when transform + filter both create stacking contexts
 *  (otherwise blurred layers can paint above the sharp top layer, especially with stacked transforms). */
function updateOverlayBlur() {
  if (!overlayEnabled) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  // Only count image layers (skip ortho) so blur steps stay stable.
  const imageLayers = Array.from(area.children).filter(el => el._overlayImage);
  const n = imageLayers.length;
  imageLayers.forEach((layer, i) => {
    layer.style.zIndex = String(i + 1);
    const stepsBack = n - 1 - i;   // 0 for current top layer
    const blurPx = (stepsBack > 0 ? overlayBlurFixed : 0) + stepsBack * overlayBlurStep;
    layer.style.filter = blurPx > 0 ? `blur(${blurPx}px)` : '';
  });
  applyOverlayStitchedLayerVisibility();
}

function setRotateMode(mode) {
  rotateMode = mode;
  autoRotate = mode === 'marker';
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
  else updateRotateModeButtons(0);
}

/** Sync both rotate-mode buttons (active state + angle label). */

  const markerBtn = document.getElementById('autoRotateBtn');
  const horizonBtn = document.getElementById('horizonStableBtn');
  const d = Number.isFinite(deg) ? deg : currentRotDeg;
  if (markerBtn) {

      ? `↻ ${d >= 0 ? '+' : ''}${d.toFixed(1)}°`
      : '↻ Rotate to marker';
  }
  if (horizonBtn) {
    const on = rotateMode === 'horizon';
    horizonBtn.style.opacity = on ? '' : '.5';
    horizonBtn.textContent = (on && Math.abs(d) >= 0.05)
      ? `⇄ ${d >= 0 ? '+' : ''}${d.toFixed(1)}°`
      : '⇄ Horizon stable';
  }
}

function updateAutoRotateLabel(deg) {
  updateRotateModeButtons(deg);
}

const AUTO_SWITCH_MS = 120;

/** Find best same-direction image and switch if closer than current. */
function performAutoSwitch() {
  if (!currentImage) return;
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
  const dir = currentImage.viewDirection;
  let best = null, bestDist = Infinity;
  for (const img of allImages) {
    if (img.viewDirection !== dir) continue;
    const [cx, cy] = img.lookAtMgi;
    const dist = Math.hypot(qx - cx, qy - cy);
    if (dist < bestDist) { bestDist = dist; best = img; }
  }
  if (best && best.name !== currentImage.name) {
    switchToImageBg(best, qx, qy);
  }
}

/**
 * When “Switch while moving” is on: throttle (runs during drag/held keys, at most every 120 ms).
 * When off: debounce (waits 120 ms after last event — only when you pause / release).
 */
function scheduleAutoSwitch() {
  if (lockedImages) return;
  const whileMoving = document.getElementById('autoSwitchWhileMovingCb')?.checked !== false;

  if (!whileMoving) {
    if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
    autoSwitchTimer = setTimeout(() => {
      autoSwitchTimer = null;
      performAutoSwitch();
    }, AUTO_SWITCH_MS);
    return;
  }

  const now = Date.now();
  if (now - lastThrottledAutoSwitch >= AUTO_SWITCH_MS) {
    lastThrottledAutoSwitch = now;
    performAutoSwitch();
    return;
  }
  if (autoSwitchTimer) return;
  autoSwitchTimer = setTimeout(() => {
    autoSwitchTimer = null;
    lastThrottledAutoSwitch = Date.now();
    performAutoSwitch();
  }, AUTO_SWITCH_MS - (now - lastThrottledAutoSwitch));
}

/** Name of image currently decoding for a background switch (dedupe repeated auto-switch). */
let pendingSwitchName = null;

/** Auto-switch to a better image for the same view direction; honours Wait full tiles / fast probe. */
function switchToImageBg(img, qx, qy) {
  if (!img) return;
  if (currentImage && img.name === currentImage.name) return;
  // Already waiting for this target — don't restart decode / cancel ourselves.
  if (pendingSwitchName === img.name) return;

  imageSwitchGen++;
  const gen = imageSwitchGen;
  pendingSwitchName = img.name;
  img = {
    ...img,
    distM:       Math.round(Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1])),
    distCenter:  Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1]),
    coversPoint: img.footprintMgi ? pointInPolygon2D(qx, qy, img.footprintMgi) : true,
  };
  const z = getTileZoomIndex(img);

  const commit = () => {
    if (gen !== imageSwitchGen) return;
    if (currentImage && currentImage.name !== img.name) {
      captureDisplayJacobianForTransition();
    }
    noteOutgoingMainBeforeSwitch(img);
    currentImage = img;
    currentZoom = z;
    openViewer(img, z);
    highlightInList(img.name);
    if (gen === imageSwitchGen) pendingSwitchName = null;
  };

  // Always warm main + reprojected-neighbor tiles before mounting so the joint
  // crossfade in renderTiles can start as soon as DOM imgs are ready.
  if (document.getElementById('waitFullTilesSwitchCb')?.checked) {
    waitForMainAndNeighborTiles(img, z).then(commit);
    return;
  }

  let done = false;
  const once = () => {
    if (done) return;
    done = true;
    // Still prefetch neighbors in the background; renderTiles waits on DOM ready.
    if (overlayNeighborsActive()) {
      waitForMainAndNeighborTiles(img, z).catch(() => {});
    }
    commit();
  };
  const probe = new Image();
  probe.onload  = once;
  probe.onerror = once;
  setTimeout(once, 800);
  probe.src = `${img.remoteBaseUrl}/${img.name}/0/0/0.jpg`;
}

function highlightInList(name) {
  const list = document.getElementById('resultsList');
  if (!list._items) return;
  list.querySelectorAll('.result-item').forEach((el, i) => {
    el.classList.toggle('active', list._items[i]?.name === name);
  });
}

/** delta: -1 = previous (, key), +1 = next (. key) — wraps */
function stepResultList(delta) {
  const list  = document.getElementById('resultsList');
  const items = list?._items;
  if (!items || items.length === 0) return;
  const curIdx = currentImage ? items.findIndex(it => it.name === currentImage.name) : -1;
  const newIdx = ((curIdx + delta) % items.length + items.length) % items.length;
  const elems  = list.querySelectorAll('.result-item');
  if (elems[newIdx]) {
    selectImage(newIdx, elems[newIdx]);
    elems[newIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function stopListPlay() {
  if (listPlayTimer != null) {
    clearInterval(listPlayTimer);
    listPlayTimer = null;
  }
  listPlayActive = false;
  const btn = document.getElementById('listPlayBtn');
  if (btn) btn.textContent = '▶';
}

function startListPlay() {
  stopListPlay();
  stopAutoTour();
  const sec = Number(document.getElementById('listPlayIntervalSec')?.value);
  const ms  = Math.max(50, Math.round((Number.isFinite(sec) && sec > 0 ? sec : 1) * 1000));
  listPlayTimer = setInterval(() => stepResultList(1), ms);
  listPlayActive = true;
  const btn = document.getElementById('listPlayBtn');
  if (btn) btn.textContent = '⏸';
}

function toggleListPlay() {
  if (listPlayActive) stopListPlay();
  else startListPlay();
}

function restartListPlayIfActive() {
  if (listPlayActive) startListPlay();
}

// ═══════════════════════════════════════════════════════════════
//  RANDOM AUTO-TOUR  (curved glide between nearby look-at points)
// ═══════════════════════════════════════════════════════════════
let autoTourActive = false;
let autoTourRaf = null;
let autoTourLastTs = null;
/** Tour origin in MGI metres [x,y] — waypoints stay inside radius of this. */
let autoTourHome = null;
/** Catmull–Rom control points in MGI; travel is along segment autoTourSeg → +1. */
let autoTourWaypoints = [];
let autoTourSeg = 1;
let autoTourT = 0;
let autoTourSegLen = 1;

function syncAutoTourButtons() {
  const on = autoTourActive;
  const btn = document.getElementById('autoTourBtn');
  if (btn) {
    btn.textContent = on ? '⏸ Tour' : '✈ Tour';
    btn.style.opacity = on ? '' : '.5';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  const fab = document.getElementById('autoTourFabBtn');
  if (fab) {
    fab.textContent = on ? '⏸' : '✈';
    fab.setAttribute('aria-pressed', on ? 'true' : 'false');
    fab.title = on ? 'Stop random tour' : 'Start random tour';
  }
}

function stopAutoTour() {
  autoTourActive = false;
  if (autoTourRaf != null) {
    cancelAnimationFrame(autoTourRaf);
    autoTourRaf = null;
  }
  autoTourLastTs = null;
  syncAutoTourButtons();
}

/** Absolute marker position in MGI ground metres. */
function setMarkerMgi(mx, my) {
  const [newLon, newLat] = wgs84ToMgi.inverse([mx, my]);
  searchLat = newLat;
  searchLon = newLon;
  const coords = document.getElementById('coordsInput');
  if (coords) coords.value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
  schedulePositionSearch();
}

function catmullRom2(p0, p1, p2, p3, t) {
  const t2 = t * t;
  const t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
  ];
}

function estimateCRSegLen(p0, p1, p2, p3) {
  let len = 0;
  let prev = p1;
  for (let i = 1; i <= 12; i++) {
    const q = catmullRom2(p0, p1, p2, p3, i / 12);
    len += Math.hypot(q[0] - prev[0], q[1] - prev[1]);
    prev = q;
  }
  return Math.max(len, 1);
}

function clampToTourDisk(x, y) {
  if (!autoTourHome) return [x, y];
  const radius = Math.max(50, Number(document.getElementById('autoTourRadiusM')?.value) || 2000);
  const dx = x - autoTourHome[0];
  const dy = y - autoTourHome[1];
  const d = Math.hypot(dx, dy);
  if (d <= radius || d < 1e-6) return [x, y];
  const s = radius / d;
  return [autoTourHome[0] + dx * s, autoTourHome[1] + dy * s];
}

/**
 * Pick a nearby destination: prefer another camera look-at inside the tour disk
 * and within hop distance; otherwise a random point in that annulus.
 */
function pickTourWaypoint(fromX, fromY, preferAwayFrom) {
  const hopMax = Math.max(30, Number(document.getElementById('autoTourHopM')?.value) || 400);
  const hopMin = Math.min(hopMax * 0.4, Math.max(40, hopMax * 0.25));
  const radius = Math.max(50, Number(document.getElementById('autoTourRadiusM')?.value) || 2000);

  const near = [];
  const pool = allImages || [];
  for (let i = 0; i < pool.length; i++) {
    const la = pool[i].lookAtMgi;
    if (!la) continue;
    const cx = la[0];
    const cy = la[1];
    if (autoTourHome && Math.hypot(cx - autoTourHome[0], cy - autoTourHome[1]) > radius) continue;
    const d = Math.hypot(cx - fromX, cy - fromY);
    if (d < hopMin || d > hopMax) continue;
    near.push([cx, cy, d]);
  }

  let candidates = near;
  if (preferAwayFrom && near.length > 2) {
    const bx = fromX - preferAwayFrom[0];
    const by = fromY - preferAwayFrom[1];
    const bl = Math.hypot(bx, by);
    if (bl > 1e-3) {
      const forward = near.filter(([cx, cy, d]) => {
        const vx = cx - fromX;
        const vy = cy - fromY;
        return (vx * bx + vy * by) / (d * bl) < 0.85;
      });
      if (forward.length) candidates = forward;
    }
  }

  if (candidates.length) {
    const pick = candidates[(Math.random() * candidates.length) | 0];
    return [pick[0], pick[1]];
  }

  for (let tries = 0; tries < 48; tries++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = hopMin + Math.random() * (hopMax - hopMin);
    let x = fromX + Math.cos(ang) * dist;
    let y = fromY + Math.sin(ang) * dist;
    [x, y] = clampToTourDisk(x, y);
    const d = Math.hypot(x - fromX, y - fromY);
    if (d >= hopMin * 0.45 && d <= hopMax * 1.05) return [x, y];
  }

  if (autoTourHome) {
    const ang = Math.random() * Math.PI * 2;
    const r = Math.min(hopMax, radius * 0.9);
    return clampToTourDisk(
      autoTourHome[0] + Math.cos(ang) * r,
      autoTourHome[1] + Math.sin(ang) * r,
    );
  }
  const ang = Math.random() * Math.PI * 2;
  return [fromX + Math.cos(ang) * hopMin, fromY + Math.sin(ang) * hopMin];
}

function ensureTourWaypoints() {
  while (autoTourWaypoints.length < autoTourSeg + 3) {
    const n = autoTourWaypoints.length;
    const last = autoTourWaypoints[n - 1];
    const prev = n >= 2 ? autoTourWaypoints[n - 2] : null;
    autoTourWaypoints.push(pickTourWaypoint(last[0], last[1], prev));
  }
}

function autoTourLoop(ts) {
  if (!autoTourActive) {
    autoTourRaf = null;
    return;
  }
  if (autoTourLastTs == null) autoTourLastTs = ts;
  const dt = Math.min((ts - autoTourLastTs) / 1000, 0.1);
  autoTourLastTs = ts;

  const speed = Math.max(1, Number(document.getElementById('autoTourSpeed')?.value) || 35);
  let remain = speed * dt;

  ensureTourWaypoints();

  while (remain > 1e-6) {
    ensureTourWaypoints();
    const p0 = autoTourWaypoints[autoTourSeg - 1];
    const p1 = autoTourWaypoints[autoTourSeg];
    const p2 = autoTourWaypoints[autoTourSeg + 1];
    const p3 = autoTourWaypoints[autoTourSeg + 2];
    if (!p0 || !p1 || !p2 || !p3) break;

    if (!(autoTourSegLen > 1e-3)) {
      autoTourSegLen = estimateCRSegLen(p0, p1, p2, p3);
    }

    const dT = remain / autoTourSegLen;
    if (autoTourT + dT >= 1) {
      remain -= (1 - autoTourT) * autoTourSegLen;
      autoTourSeg++;
      autoTourT = 0;
      autoTourSegLen = 0;
      if (autoTourSeg > 10) {
        const drop = autoTourSeg - 2;
        autoTourWaypoints.splice(0, drop);
        autoTourSeg -= drop;
      }
      continue;
    }

    autoTourT += dT;
    remain = 0;
  }

  ensureTourWaypoints();
  {
    const p0 = autoTourWaypoints[autoTourSeg - 1];
    const p1 = autoTourWaypoints[autoTourSeg];
    const p2 = autoTourWaypoints[autoTourSeg + 1];
    const p3 = autoTourWaypoints[autoTourSeg + 2];
    if (p0 && p1 && p2 && p3) {
      if (!(autoTourSegLen > 1e-3)) autoTourSegLen = estimateCRSegLen(p0, p1, p2, p3);
      const pos = catmullRom2(p0, p1, p2, p3, autoTourT);
      setMarkerMgi(pos[0], pos[1]);
    }
  }

  autoTourRaf = requestAnimationFrame(autoTourLoop);
}

function startAutoTour() {
  if (!allImages || !allImages.length) return;
  stopListPlay();
  stopAutoTour();

  if (!zoomToMarker) toggleZoomToMarker();

  autoTourHome = wgs84ToMgi.forward([searchLon, searchLat]);
  const cur = [autoTourHome[0], autoTourHome[1]];
  const next = pickTourWaypoint(cur[0], cur[1], null);
  autoTourWaypoints = [cur, cur, next, pickTourWaypoint(next[0], next[1], cur)];
  autoTourSeg = 1;
  autoTourT = 0;
  autoTourSegLen = estimateCRSegLen(
    autoTourWaypoints[0], autoTourWaypoints[1], autoTourWaypoints[2], autoTourWaypoints[3],
  );
  autoTourActive = true;
  autoTourLastTs = null;
  syncAutoTourButtons();
  autoTourRaf = requestAnimationFrame(autoTourLoop);
}

function toggleAutoTour() {
  if (autoTourActive) stopAutoTour();
  else startAutoTour();
}

// ── Continuous keyboard movement: fires every animation frame while keys held ──
const ARROW_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const keysHeld   = new Set();
let   shiftHeld  = false;
let   keyRafId   = null, lastKeyTs = null;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Shift') { shiftHeld = true; return; }

  // Visual zoom: + and # (German QWERTZ), also = − numpad (when an image is open)
  if (currentImage) {
    const k = e.key;
    const zoomIn =
      k === '+' || k === '=' || e.code === 'NumpadAdd';
    const zoomOut =
      k === '#' || k === '-' || e.code === 'NumpadSubtract';
    if (zoomIn || zoomOut) {
      e.preventDefault();
      changeViewZoom(zoomIn ? 1 : -1);
      return;
    }
    // Overlay: Shift+S — hide neighbor previews + stacked history; show only the main (top) image layer
    if (overlayEnabled && e.shiftKey && (k === 'S' || k === 's')) {
      e.preventDefault();
      overlayStitchedOnlyMain = !overlayStitchedOnlyMain;
      applyOverlayStitchedLayerVisibility();
      return;
    }
    // Ortho aerial underlay: Shift+O — toggle visibility (when ortho data is active)
    if (e.shiftKey && (k === 'O' || k === 'o')) {
      const va = document.getElementById('viewerArea');
      if (va?.classList.contains('has-ortho')) {
        e.preventDefault();
        toggleOrthoBackground();
        return;
      }
    }
  }

  // , / . — step through the result list (wraps around)
  if (e.key === ',' || e.key === '.') {
    e.preventDefault();
    stepResultList(e.key === '.' ? 1 : -1);
    return;
  }

  if (!ARROW_KEYS.includes(e.key) || !currentImage) return;
  e.preventDefault();
  if (autoTourActive) stopAutoTour();
  keysHeld.add(e.key);
  if (!keyRafId) keyRafId = requestAnimationFrame(keyMoveLoop);
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; return; }
  keysHeld.delete(e.key);
  if (keysHeld.size === 0) lastKeyTs = null;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (ARROW_KEYS.includes(e.key) && document.getElementById('autoSwitchWhileMovingCb')?.checked === false) {
    scheduleAutoSwitch();
  }
});

function keyMoveLoop(ts) {
  if (keysHeld.size === 0 || !currentImage) { keyRafId = null; lastKeyTs = null; return; }
  if (lastKeyTs === null) lastKeyTs = ts;
  const dt   = Math.min((ts - lastKeyTs) / 1000, 0.1); // seconds, capped at 100 ms
  lastKeyTs  = ts;
  const step = (shiftHeld ? 300 : 50) * dt; // metres this frame
  // View-relative: current image heading is camera view direction on the ground (° from north).
  const h = currentImage.heading * Math.PI / 180;
  const sin = Math.sin, cos = Math.cos;
  let dxM = 0, dyM = 0;
  if (keysHeld.has('ArrowUp')) {
    dxM += step * sin(h);
    dyM += step * cos(h);
  }
  if (keysHeld.has('ArrowDown')) {
    dxM -= step * sin(h);
    dyM -= step * cos(h);
  }
  if (keysHeld.has('ArrowLeft')) {
    const hl = h - Math.PI / 2;
    dxM += step * sin(hl);
    dyM += step * cos(hl);
  }
  if (keysHeld.has('ArrowRight')) {
    const hr = h + Math.PI / 2;
    dxM += step * sin(hr);
    dyM += step * cos(hr);
  }
  moveMarker(dxM, dyM);
  keyRafId = requestAnimationFrame(keyMoveLoop);
}

// ── Mouse / touch drag: moves the marker by inverting the camera Jacobian ──
let   isDragging    = false;
let   dragStartCX   = 0, dragStartCY = 0;
let   dragLastCX    = 0, dragLastCY = 0;
let   dragStartMX   = 0, dragStartMY = 0;
let   dragInvJ      = null, dragScale = 1;

const viewerAreaEl = document.getElementById('viewerArea');

if (typeof ResizeObserver !== 'undefined' && viewerAreaEl) {
  let viewerResizeRaf = 0;
  new ResizeObserver(() => {
    if (!currentImage || !tileZoomAuto) return;
    cancelAnimationFrame(viewerResizeRaf);
    viewerResizeRaf = requestAnimationFrame(() => {
      const z = getTileZoomIndex(currentImage);
      renderTiles(currentImage, z);
      if (tileCacheEnabled) preloadToCache(currentImage, z);
    });
  }).observe(viewerAreaEl);
}

function beginDrag(clientX, clientY) {
  if (!currentImage) return false;
  if (autoTourActive) stopAutoTour();
  const hVal = document.getElementById('heightNum').value;
  const Z    = hVal === '' ? 0 : Number(hVal);
  if (globeModeEnabled) updateVirtualGlobeCamera();
  const dragImg = getDisplayCameraImg() || currentImage;
  const invJ = computeInvJacobian(dragImg, searchLat, searchLon, Z);
  if (!invJ) return false;
  isDragging  = true;
  dragStartCX = clientX;
  dragStartCY = clientY;
  dragLastCX  = clientX;
  dragLastCY  = clientY;
  [dragStartMX, dragStartMY] = wgs84ToMgi.forward([searchLon, searchLat]);
  dragInvJ    = invJ;
  // Globe warp is a full homography — drag scale is display fit only (no affine morph).
  dragScale   = currentDispScale * (!globeModeEnabled && groundScaleLockEnabled ? mat2AvgScale(morphMatrix) : 1);
  return true;
}

function applyDrag(clientX, clientY) {
  if (!isDragging) return;

  // Globe: incremental steps with a fresh virtual-camera Jacobian each frame
  // so along-view motion tracks the moving semi-globe pose.
  if (globeModeEnabled) {
    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    updateVirtualGlobeCamera();
    const invJ = computeInvJacobian(getDisplayCameraImg() || currentImage, searchLat, searchLon, Z);
    if (!invJ) return;
    const ddxImg = -(clientX - dragLastCX) / (currentDispScale || 1);
    const ddyImg = -(clientY - dragLastCY) / (currentDispScale || 1);
    dragLastCX = clientX;
    dragLastCY = clientY;
    if (Math.abs(ddxImg) < 1e-9 && Math.abs(ddyImg) < 1e-9) return;
    const dX = invJ.dXdPx * ddxImg + invJ.dXdPy * ddyImg;
    const dY = invJ.dYdPx * ddxImg + invJ.dYdPy * ddyImg;
    const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
    const [newLon, newLat] = wgs84ToMgi.inverse([mx + dX, my + dY]);
    searchLat = newLat;
    searchLon = newLon;
    document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
    refreshDot();
    if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
    schedulePositionSearch();
    return;
  }

  if (!dragInvJ) return;
  const ddxImg = -(clientX - dragStartCX) / dragScale;
  const ddyImg = -(clientY - dragStartCY) / dragScale;
  const dX = dragInvJ.dXdPx * ddxImg + dragInvJ.dXdPy * ddyImg;
  const dY = dragInvJ.dYdPx * ddxImg + dragInvJ.dYdPy * ddyImg;
  const [newLon, newLat] = wgs84ToMgi.inverse([dragStartMX + dX, dragStartMY + dY]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
  schedulePositionSearch();
}

function endDrag() {
  isDragging = false;
  dragInvJ   = null;
  viewerAreaEl.style.cursor = 'grab';
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked === false) scheduleAutoSwitch();
}

viewerAreaEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (beginDrag(e.clientX, e.clientY)) {
    viewerAreaEl.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
document.addEventListener('mousemove', e => { if (isDragging) applyDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup',   ()  => { if (isDragging) endDrag(); });

// ── Pinch-to-zoom state ──
let isPinching     = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let pinchLastRatio = 1;
/** Overlay mode: { el, transform, transformOrigin }[] captured at pinch start so all stack layers zoom together. */
let pinchOverlaySnapshots = null;
/** Ortho underlay snapshot — keeps the live perspective homography, then wraps a viewport scale. */
let pinchOrthoSnapshot = null;
/**
 * While remounting tiles after a zoom change, keep previous layers on a compensating
 * viewport scale (fromZoom → viewerZoom) so they do not flash at the wrong warp.
 */
let zoomRescaleHold = null;

function pinchDist(t) { return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

/** Snapshot live transforms at `fromZoom` before viewerZoom changes. */
function beginZoomRescaleHold(fromZoom) {
  if (zoomRescaleHold || !(fromZoom > 0)) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  syncOverlayLayersToMarker();
  const snaps = [];
  for (const el of Array.from(area.children)) {
    if (!el._overlayImage && el.id !== 'orthoUnderlay') continue;
    snaps.push({
      el,
      transform: el.style.transform || '',
      transformOrigin: el.style.transformOrigin || '0 0',
    });
  }
  if (!snaps.length) return;
  zoomRescaleHold = { fromZoom, snaps };
}

function applyZoomRescaleHold() {
  if (!zoomRescaleHold || !viewerAreaEl) return;
  const ratio = viewerZoom / zoomRescaleHold.fromZoom;
  if (!(ratio > 0) || !Number.isFinite(ratio)) return;
  const cx = (viewerAreaEl.clientWidth || 800) / 2;
  const cy = (viewerAreaEl.clientHeight || 600) / 2;
  const pre = Math.abs(ratio - 1) < 1e-6
    ? ''
    : `translate(${cx}px, ${cy}px) scale(${ratio}) translate(${-cx}px, ${-cy}px)`;
  for (const s of zoomRescaleHold.snaps) {
    if (!s.el.isConnected) continue;
    if (s.el._overlayPendingReveal || s.el._neighborPendingReveal) continue;
    s.el.style.transformOrigin = '0 0';
    s.el.style.transform = pre && s.transform ? `${pre} ${s.transform}` : (s.transform || pre);
  }
}

function clearZoomRescaleHold() {
  zoomRescaleHold = null;
}

/** Top tile stack layer (single mode, or fallback when overlay stack has nothing to snapshot). */
function getPinchLayerEl() {
  return document.getElementById('rotPadDiv');
}

function capturePinchOverlaySnapshots() {
  pinchOverlaySnapshots = null;
  if (!viewerAreaEl) return;
  // Freeze live warps first so snapshots include the current perspective matrices.
  syncOverlayLayersToMarker();
  const snaps = [];
  for (const el of Array.from(viewerAreaEl.children)) {
    if (!el._overlayImage) continue;
    snaps.push({
      el,
      transform: el.style.transform || '',
      transformOrigin: el.style.transformOrigin || '',
    });
  }
  pinchOverlaySnapshots = snaps.length ? snaps : null;
}

/**
 * Pinch preview for every oblique overlay layer (main, history, neighbor previews) plus the same
 * viewport-centred scale so reprojected secondaries stay aligned with the top image.
 * transform-origin must be 0 0 here: the main layer’s snapshot origin is often empty (→ 50% 50%),
 * which would wrap our explicit translate/scale chain and make the top image drift during pinch.
 */
function applyPinchOverlayStackPreview(pinchRatio) {
  if (!pinchOverlaySnapshots || !viewerAreaEl) return;
  const cx = (viewerAreaEl.clientWidth || 800) / 2;
  const cy = (viewerAreaEl.clientHeight || 600) / 2;
  const pre = `translate(${cx}px, ${cy}px) scale(${pinchRatio}) translate(${-cx}px, ${-cy}px)`;
  for (const s of pinchOverlaySnapshots) {
    if (!s.el.isConnected) continue;
    s.el.style.transformOrigin = '0 0';
    s.el.style.transform = s.transform ? `${pre} ${s.transform}` : pre;
  }
}

function restorePinchOverlaySnapshots() {
  if (!pinchOverlaySnapshots) return;
  for (const s of pinchOverlaySnapshots) {
    if (!s.el.isConnected) continue;
    s.el.style.transform = s.transform;
    s.el.style.transformOrigin = s.transformOrigin;
  }
  pinchOverlaySnapshots = null;
}

/**
 * Capture ortho’s current perspective warp (matrix3d), then preview pinch by wrapping the
 * same viewport-centred scale used for oblique layers — not a flat translate+scale.
 */
function capturePinchOrthoSnapshot() {
  pinchOrthoSnapshot = null;
  const ortho = document.getElementById('orthoUnderlay');
  if (!ortho) return;
  syncOrthoUnderlayTransform();
  pinchOrthoSnapshot = {
    el: ortho,
    transform: ortho.style.transform || '',
    transformOrigin: ortho.style.transformOrigin || '0 0',
  };
}

function applyPinchOrthoPreview(pinchRatio) {
  if (!pinchOrthoSnapshot?.el?.isConnected || !viewerAreaEl) return;
  const cx = (viewerAreaEl.clientWidth || 800) / 2;
  const cy = (viewerAreaEl.clientHeight || 600) / 2;
  const pre = `translate(${cx}px, ${cy}px) scale(${pinchRatio}) translate(${-cx}px, ${-cy}px)`;
  const s = pinchOrthoSnapshot;
  s.el.style.transformOrigin = '0 0';
  s.el.style.transform = s.transform ? `${pre} ${s.transform}` : pre;
}

function restorePinchOrthoSnapshot() {
  if (!pinchOrthoSnapshot) return;
  const s = pinchOrthoSnapshot;
  if (s.el.isConnected) {
    s.el.style.transform = s.transform;
    s.el.style.transformOrigin = s.transformOrigin;
  }
  pinchOrthoSnapshot = null;
}

function setViewerZoomTo(z) {
  const target = Math.max(VZOOM_STEPS[0], Math.min(VZOOM_STEPS[VZOOM_STEPS.length-1], z));
  if (!(target > 0)) return;
  if (!zoomRescaleHold && target !== viewerZoom) {
    beginZoomRescaleHold(viewerZoom);
  }
  viewerZoom = target;
  relockGroundScaleAfterUserZoom();
  resetOrthoGlobeLayoutCache();
  virtualGlobeImg = null;
  globePoseLastTs = 0;
  applyZoomRescaleHold();
  const v = viewerZoom;
  const lbl = v >= 1
    ? (Number.isInteger(v) ? v+'×' : v.toFixed(2).replace(/\.?0+$/,'')+'×')
    : v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
  document.getElementById('vzoomLabel').textContent = lbl;
  const orbitVz = document.getElementById('orbitVzoomLabel');
  if (orbitVz) orbitVz.textContent = lbl;
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
  else clearZoomRescaleHold();
}

viewerAreaEl.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isPinching = false;
    const started = beginDrag(e.touches[0].clientX, e.touches[0].clientY);
    if (started) e.preventDefault();
    else if (document.body.classList.contains('infinite-scroll') && currentImage) e.preventDefault();
  } else if (e.touches.length === 2) {
    isPinching     = true;
    isDragging     = false;
    pinchStartDist = Math.max(pinchDist(e.touches), 1e-6);
    pinchStartZoom = viewerZoom;
    pinchLastRatio = 1;
    capturePinchOverlaySnapshots();
    capturePinchOrthoSnapshot();
    if (!pinchOverlaySnapshots || !pinchOverlaySnapshots.length) {
      const el = getPinchLayerEl();
      if (el) {
        const pan = getPinchPanParts();
        if (pan) {
          // Pin-centre: origin at marker in pad space (viewPad is 0; sc includes ortho offset).
          el.style.transformOrigin = `${pan.vx}px ${pan.vy}px`;
        } else {
          const o = getSingleModePinchOrigin();
          el.style.transformOrigin = `${o.ox}px ${o.oy}px`;
        }
      }
    }
    e.preventDefault();
  }
}, { passive: false });

viewerAreaEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && !isPinching) {
    applyDrag(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2 && isPinching) {
    pinchLastRatio = pinchDist(e.touches) / pinchStartDist;
    if (pinchOverlaySnapshots) {
      applyPinchOverlayStackPreview(pinchLastRatio);
    } else {
      const el = getPinchLayerEl();
      if (!el) return;
      const pan = getPinchPanParts();
      if (pan) {
        el.style.transform = `translate(${pan.tx}px, ${pan.ty}px) scale(${pinchLastRatio})`;
      } else {
        el.style.transform = `scale(${pinchLastRatio})`;
      }
    }
    applyPinchOrthoPreview(pinchLastRatio);
  }
}, { passive: false });

function commitPinchPreview() {
  if (!isPinching) return;
  const targetZoom = pinchStartZoom * pinchLastRatio;
  // Keep the pinch look continuous: hand base transforms to the zoom hold instead of
  // restoring old-zoom warps (that flash) before remounting at the new scale.
  const snaps = [];
  if (pinchOverlaySnapshots) snaps.push(...pinchOverlaySnapshots);
  if (pinchOrthoSnapshot) snaps.push(pinchOrthoSnapshot);
  if (snaps.length) {
    zoomRescaleHold = { fromZoom: pinchStartZoom, snaps };
  }
  pinchOverlaySnapshots = null;
  pinchOrthoSnapshot = null;
  isPinching = false;
  setViewerZoomTo(targetZoom);
}

viewerAreaEl.addEventListener('touchend', e => {
  if (isPinching && e.touches.length < 2) {
    commitPinchPreview();
  }
  if (e.touches.length === 0) endDrag();
});

viewerAreaEl.addEventListener('touchcancel', e => {
  if (isPinching) commitPinchPreview();
  if (e.touches.length === 0) endDrag();
});

// ═══════════════════════════════════════════════════════════════
//  INFINITE SCROLL (fullscreen map — no search UI)
// ═══════════════════════════════════════════════════════════════

let infiniteScrollModeInitialized = false;

/** Highlight the N/E/S/W button that matches the current image’s view direction (1–4). */
function updateOrbitDirectionHighlight() {
  const fab = document.getElementById('orbitFab');
  if (!fab) return;
  fab.querySelectorAll('.orbit-btn[data-dir]').forEach((btn) => {
    btn.classList.remove('orbit-btn--active');
    btn.removeAttribute('aria-pressed');
  });
  const vd = currentImage && currentImage.viewDirection;
  if (vd == null || vd < 1 || vd > 4) return;
  const active = fab.querySelector(`.orbit-btn[data-dir="${vd}"]`);
  if (active) {
    active.classList.add('orbit-btn--active');
    active.setAttribute('aria-pressed', 'true');
  }
}

function orbitToDirection(dir) {
  if (![1, 2, 3, 4].includes(dir) || !searchResults.length) return;
  let best = null;
  for (const img of searchResults) {
    if (img.viewDirection !== dir) continue;
    if (!best || img.distCenter < best.distCenter) best = img;
  }
  if (!best) return;
  applySort();
  const list = document.getElementById('resultsList');
  const items = list._items || [];
  let idx = items.findIndex(i => i.name === best.name);
  if (idx < 0) {
    imageSwitchGen++;
    const gen = imageSwitchGen;
    if (currentImage && currentImage.name !== best.name) {
      captureDisplayJacobianForTransition();
    }
    noteOutgoingMainBeforeSwitch(best);
    currentImage = best;
    const z = getTileZoomIndex(best);
    if (document.getElementById('waitFullTilesSwitchCb')?.checked) {
      waitForMainAndNeighborTiles(best, z).then(() => {
        if (gen !== imageSwitchGen) return;
        openViewer(best, z);
      });
    } else {
      openViewer(best, z);
    }
    return;
  }
  selectImage(idx, document.createElement('div'));
}

/** Show/hide header, search list, and viewer toolbar. Preference in localStorage. */
function setChromeUiVisible(visible) {
  document.body.classList.toggle('chrome-hidden', !visible);
  const fab = document.getElementById('chromeToggleFabBtn');
  const hdr = document.getElementById('chromeToggleHeaderBtn');
  if (fab) {
    fab.setAttribute('aria-pressed', visible ? 'true' : 'false');
    fab.title = visible ? 'Hide search list and toolbars' : 'Show search list and toolbars';
  }
  if (hdr) {
    hdr.textContent = visible ? 'Hide UI' : 'Show UI';
    hdr.title = fab ? fab.title : '';
  }
  try { localStorage.setItem('infChromeVisible', visible ? '1' : '0'); } catch (_) {}
}

function toggleChromeUi() {
  setChromeUiVisible(document.body.classList.contains('chrome-hidden'));
}

function initInfiniteScrollMode() {
  if (infiniteScrollModeInitialized) return;
  infiniteScrollModeInitialized = true;
  document.body.classList.add('infinite-scroll');

  let chromeVisible = true;
  try {
    const stored = localStorage.getItem('infChromeVisible');
    if (stored === '0') chromeVisible = false;
    if (stored === '1') chromeVisible = true;
  } catch (_) {}
  setChromeUiVisible(chromeVisible);

  const coords = document.getElementById('coordsInput');
  if (coords) coords.value = '48.2297801, 16.4137043';
  const rad = document.getElementById('radiusInput');
  if (rad) rad.value = '280';
  const autoSearch = document.getElementById('autoSearchOnMoveCb');
  if (autoSearch) autoSearch.checked = false;

  const wft = document.getElementById('waitFullTilesSwitchCb');
  if (wft) wft.checked = true;
  const rep = document.getElementById('overlayStretchToMainCb');
  if (rep) rep.checked = true;
  const nsel = document.getElementById('overlayNeighborPreloadSel');
  if (nsel) nsel.value = '64';

  globeModeEnabled = true;
  const globeBtn = document.getElementById('globeModeBtn');
  if (globeBtn) {
    globeBtn.style.opacity = '';
    globeBtn.setAttribute('aria-pressed', 'true');
  }

  try {
    const bf = localStorage.getItem('infOverlayBlurFixed');
    const bs = localStorage.getItem('infOverlayBlurStep');
    const fIn = document.getElementById('overlayBlurFixedInput');
    const sIn = document.getElementById('overlayBlurInput');
    if (fIn && bf !== null) fIn.value = bf;
    if (sIn && bs !== null) sIn.value = bs;
  } catch (_) {}
  overlayBlurFixed = Math.max(0, Number(document.getElementById('overlayBlurFixedInput')?.value) || 0);
  overlayBlurStep = Math.max(0, Number(document.getElementById('overlayBlurInput')?.value) || 0);

  markerVisible = false;
  const mb = document.getElementById('markerToggleBtn');
  if (mb) {
    mb.textContent = '○ Marker';
    mb.style.opacity = '.5';
  }

  doSearch({ silent: true });
  applySort();
  const list = document.getElementById('resultsList');
  const items = list._items;
  if (!items || !items.length) {
    const area = document.getElementById('viewerArea');
    if (area) {
      area.innerHTML = '<div class="empty-viewer">No images in search radius for this point.</div>';
    }
    return;
  }

  imageSwitchGen++;
  const gen = imageSwitchGen;
  transitionOutgoingMain = null;
  currentImage = items[0];
  const maxZ = currentImage.tileResolution.length - 1;
  currentZoom = Math.min(currentZoom, maxZ);
  const img = currentImage;
  const z = getTileZoomIndex(img);

  const finishOverlayInit = () => {
    if (!overlayEnabled) toggleOverlay();
    const ovl = document.getElementById('overlayBtn');
    if (ovl) ovl.style.opacity = '';
    const vz = document.getElementById('vzoomLabel');
    const orbitVz = document.getElementById('orbitVzoomLabel');
    if (vz && orbitVz) orbitVz.textContent = vz.textContent;
  };

  if (document.getElementById('waitFullTilesSwitchCb')?.checked) {
    waitForMainAndNeighborTiles(img, z).then(() => {
      if (gen !== imageSwitchGen) return;
      openViewer(img, z);
      finishOverlayInit();
    });
    return;
  }
  openViewer(img, z);
  finishOverlayInit();
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════

// Mouse-wheel zooms in/out, keeping the marker centred.
document.getElementById('viewerArea').addEventListener('wheel', e => {
  if (!currentImage) return;
  e.preventDefault();
  changeViewZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

loadIndex();
</script>
<!-- Hidden container that keeps tile <img> elements alive so their decoded bitmaps
     remain in the browser's image cache between image switches. -->
<div id="tileCache" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;visibility:hidden;"></div>

<div class="orbit-fab" id="orbitFab" aria-label="Orbit and zoom">
  <div class="orbit-dpad" role="group" aria-label="View direction">
    <button type="button" class="orbit-btn orbit-n" data-dir="1" onclick="orbitToDirection(1)" title="Nearest North-facing view">N</button>
    <button type="button" class="orbit-btn orbit-w" data-dir="4" onclick="orbitToDirection(4)" title="Nearest West-facing view">W</button>
    <span class="orbit-hub" title="Centre" aria-hidden="true"></span>
    <button type="button" class="orbit-btn orbit-e" data-dir="2" onclick="orbitToDirection(2)" title="Nearest East-facing view">E</button>
    <button type="button" class="orbit-btn orbit-s" data-dir="3" onclick="orbitToDirection(3)" title="Nearest South-facing view">S</button>
  </div>
  <div class="orbit-zoom">
    <button type="button" class="orbit-tool" onclick="changeViewZoom(-1)">−</button>
    <span class="orbit-vzoom" id="orbitVzoomLabel">1×</span>
    <button type="button" class="orbit-tool" onclick="changeViewZoom(+1)">+</button>
    <button type="button" class="orbit-tool" id="orthoToggleFabBtn" onclick="toggleOrthoBackground()"
            title="Show/hide nadir orthophoto underlay (Shift+O)">▣</button>
    <button type="button" class="orbit-tool" id="autoTourFabBtn" onclick="toggleAutoTour()"
            aria-pressed="false" title="Start random tour">✈</button>
    <button type="button" class="orbit-tool chrome-toggle" id="chromeToggleFabBtn" onclick="toggleChromeUi()"
            aria-pressed="false" title="Hide search list and toolbars">☰</button>
  </div>
</div>
</body>
</html>
