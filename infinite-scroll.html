      z${zi} <small style="opacity:.6">${cols * rows}t</small>
    </span>`;
    }).join('');
  pills.onclick = e => {
    const pill = e.target.closest('.zoom-pill');
    if (!pill) return;
    if (pill.dataset.z === 'auto') {
      tileZoomAuto = true;
      const zEff = getTileZoomIndex(img);
      renderTiles(img, zEff);
      preloadToCache(img, zEff);
      updateCacheSizeDropdownLabels();
      return;
    }
    const zVal = Number(pill.dataset.z);
    tileZoomAuto = false;
    currentZoom = zVal;
    renderTiles(img, zVal);
    preloadToCache(img, zVal);
    updateCacheSizeDropdownLabels();
  };

  renderTiles(img, zoom);
  preloadToCache(img, zoom);
  updateOrbitDirectionHighlight();
}

function tileDims(width, height, zoom, tileResolution) {
  const res = tileResolution[zoom];
  return { cols: Math.ceil(width/(tileSize*res)), rows: Math.ceil(height/(tileSize*res)) };
}

function edgeTrimDisplayPx(scale) {
  // Conservative rounding avoids 1px border bleed at fractional zoom scales.
  return Math.max(0, Math.ceil(IMAGE_EDGE_TRIM_SOURCE_PX * scale));
}

/** Device pixels per source image pixel (full frame fit × visual zoom × devicePixelRatio). */
function screenPxPerImagePx(img) {
  const area = document.getElementById('viewerArea');
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  return baseScale * viewerZoom * (window.devicePixelRatio || 1);
}

/**
 * Auto tile zoom: coarsest pyramid level z where decoded tile pixels are not upsampled past
 * ~1 device pixel per source pixel. Tiles are tileSize×tileSize JPEGs; level z covers
 * tileSize × tileResolution[z] source pixels per tile (see tileDims).
 */
function computeAutoTileZoom(img) {
  const scale = screenPxPerImagePx(img);
  const tr = img.tileResolution;
  const maxZ = tr.length - 1;
  const eps = 1e-9;
  for (let zi = 0; zi <= maxZ; zi++) {
    if (tr[zi] * scale <= 1 + eps) return zi;
  }
  return maxZ;
}

function getTileZoomIndex(img) {
  if (!img) return 0;
  const maxZ = img.tileResolution.length - 1;
  if (tileZoomAuto) return computeAutoTileZoom(img);
  return Math.max(0, Math.min(maxZ, currentZoom));
}

/** Sync zoom pill classes: auto pill, manual active z, or auto-loaded border on effective z. */
function updateZoomPillClasses() {
  const pills = document.getElementById('zoomPills');
  if (!pills || !currentImage) return;
  const zEff = getTileZoomIndex(currentImage);
  pills.querySelectorAll('.zoom-pill').forEach(p => {
    const dz = p.dataset.z;
    if (dz === 'auto') {
      p.classList.toggle('active', tileZoomAuto);
      return;
    }
    const zi = Number(dz);
    p.classList.toggle('active', !tileZoomAuto && zi === currentZoom);
    p.classList.toggle('auto-loaded', tileZoomAuto && zi === zEff);
  });
}

/** Pre-decode all JPEG tiles for an image at zoom (same URLs as the viewer). Used before swapping views. */
function waitForAllTilesDecoded(img, zoom) {
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  if (cols * rows === 0) return Promise.resolve();
  const promises = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      promises.push(new Promise(resolve => {
        const el = new Image();
        let settled = false;
        const done = () => {
          if (settled) return;
          settled = true;
          resolve();
        };
        const finish = () => {
          if (typeof el.decode === 'function') {
            el.decode().then(done).catch(done);
          } else {
            done();
          }
        };
        el.onload = finish;
        el.onerror = done;
        el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
        if (el.complete) finish();
      }));
    }
  }
  return Promise.all(promises);
}

/** Wait until viewer <img> nodes have pixels (works for newly mounted layers; uses HTTP cache after waitForAllTilesDecoded). */
function whenImagesReady(imgs) {
  if (!imgs || !imgs.length) return Promise.resolve();
  return Promise.all(Array.from(imgs).map(im => {
    if (im.complete && im.naturalWidth > 0) {
      return typeof im.decode === 'function' ? im.decode().catch(() => {}) : Promise.resolve();
    }
    return new Promise(resolve => {
      const done = () => resolve();
      im.addEventListener('load', () => {
        if (typeof im.decode === 'function') im.decode().then(done).catch(done);
        else done();
      }, { once: true });
      im.addEventListener('error', done, { once: true });
    });
  }));
}

/** Bumps to cancel stale crossfades when another image mounts. */
let imageRevealGen = 0;
const IMAGE_CROSSFADE_MS = 220;
/** Ground-Jacobian morph duration when switching cameras (squeeze/stretch into the new view). */
const IMAGE_MORPH_MS = 360;

/**
 * CSS rotate (deg) that makes the ground-plane horizon horizontal.
 * Horizon = vanishing line of Z=0 = cross product of vanishing points of world X and Y.
 */
function computeHorizonLevelRotDeg(img) {
  const P = img && img.pToImage;
  if (!P) return 0;
  const vE = [P[0][0], P[1][0], P[2][0]];
  const vN = [P[0][1], P[1][1], P[2][1]];
  // Line l = vE × vN  →  a·x + b·y + c = 0
  const a = vE[1] * vN[2] - vE[2] * vN[1];
  const b = vE[2] * vN[0] - vE[0] * vN[2];
  if (!Number.isFinite(a) || !Number.isFinite(b) || (a === 0 && b === 0)) return 0;
  // Angle of the horizon line from +x (image right); y increases downward.
  let deg = -Math.atan2(a, -b) * (180 / Math.PI);
  // Keep in (-180, 180] for stable labels / smallest visual twist.
  deg = ((deg + 180) % 360 + 360) % 360 - 180;
  return deg;
}

/** Active image rotation for the current rotateMode (marker / horizon / off). */
function computeAutoRotDegForImage(img) {
  if (!img || !img.pToImage) return 0;
  if (rotateMode === 'horizon') return computeHorizonLevelRotDeg(img);
  if (rotateMode === 'marker') {
    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (!proj) return 0;
    const fx = Math.hypot(img.pToImage[0][0], img.pToImage[0][1], img.pToImage[0][2]);
    if (fx < 1) return 0;
    return -Math.atan((proj[0] - img.width / 2) / fx) * (180 / Math.PI);
  }
  return 0;
}

/** Neighbor preview layer (no dot overlay, no rotPadDiv id) — same tile layout as the main stack.
 *  Always unrotated: orientation comes from the reproject/globe homography. A CSS rotate
 *  inside the layer fights that warp and looks like jumping while the marker moves. */
function buildNeighborLayerDOM(img, zoom) {
  const area = document.getElementById('viewerArea');
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  const scale = baseScale * viewerZoom;
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];
  const dispTileW = Math.max(1, Math.round(tileSize * res * scale));
  const edgeTrimDisp = edgeTrimDisplayPx(scale);
  const topBlack = Math.ceil((rows * tileSize * res - img.height) * scale);
  const contentW = Math.floor(img.width * scale);
  const contentH = Math.floor(img.height * scale);
  const clipW = Math.max(1, contentW - edgeTrimDisp);
  const clipH = Math.max(1, contentH - edgeTrimDisp);
  const rotDeg = 0;
  let tilesHtml = '';
  for (let y = rows - 1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="eager" decoding="async" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }
  const innerHtml = `
    <div style="position:relative;width:${clipW}px;height:${clipH}px;overflow:hidden;">
      <div style="position:absolute;top:-${topBlack + edgeTrimDisp}px;left:0;">
        <div class="tile-canvas-wrap">${tilesHtml}</div>
      </div>
    </div>`;
  const layer = document.createElement('div');
  layer.style.cssText = 'position:absolute;left:0;top:0;will-change:transform,opacity;';
  layer.innerHTML = innerHtml;
  layer._overlayImage = img;
  layer._overlayRotDeg = rotDeg;
  layer._overlayNeighborPreview = true;
  layer._overlayHistory = false;
  return layer;
}

function removeNeighborPreviewLayers(area) {
  Array.from(area.children).forEach(el => {
    if (el._overlayNeighborPreview) el.remove();
  });
  neighborLayersMainName = null;
  lockedNeighborImages = [];
}

/** Max history layers to keep: full stack when overlay is on, otherwise a single main frame.
 *  ×0 in the UI means “only the current image” (still at least 1). */
function effectiveOverlayHistoryLimit() {
  if (!overlayEnabled) return 1;
  return Math.max(1, overlayMaxLayers | 0);
}

/** Max user-navigated layers; neighbor previews do not count toward this cap. */
function trimOverlayHistory() {
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const max = effectiveOverlayHistoryLimit();
  while (true) {
    const userLayers = Array.from(area.children).filter(el => el._overlayHistory);
    if (userLayers.length <= max) break;
    userLayers[0].remove();
  }
}

/**
 * Candidates for “next” views: same view direction as main first, then nearest ground-centre (MGI).
 * @param {'main'|'marker'} [anchor='marker'] — `main` uses the main image look-at (stable per main);
 *   `marker` uses the live search position (for preload-ahead while panning).
 */
function pickNearestNeighborImages(mainImg, count, anchor) {
  if (!count || !mainImg || !allImages.length) return [];
  const [qx, qy] = (anchor === 'main' && mainImg.lookAtMgi)
    ? mainImg.lookAtMgi
    : wgs84ToMgi.forward([searchLon, searchLat]);
  const dir = mainImg.viewDirection;
  return allImages
    .filter(img => img.name !== mainImg.name)
    .map(img => {
      const [cx, cy] = img.lookAtMgi;
      const dist = Math.hypot(qx - cx, qy - cy);
      const sameDir = img.viewDirection === dir ? 0 : 1;
      return { img, dist, sameDir };
    })
    .sort((a, b) => a.sameDir - b.sameDir || a.dist - b.dist)
    .slice(0, count)
    .map(x => x.img);
}

/** First history layer in paint order — neighbors insert before this (behind all mains). */
function firstHistoryLayer(area) {
  for (const el of area.children) {
    if (el._overlayHistory) return el;
  }
  return null;
}

let neighborRebuildTimer = null;

/**
 * Decode/cache nearest neighbor tiles while moving — does not change visible layers.
 */
function schedulePreloadNeighborTiles() {
  if (!overlayEnabled || !currentImage) return;
  if (!document.getElementById('overlayStretchToMainCb')?.checked) return;
  const n = overlayNeighborCount;
  if (!n) return;

  neighborPreloadGen++;
  const gen = neighborPreloadGen;
  if (neighborPreloadTimer) clearTimeout(neighborPreloadTimer);
  neighborPreloadTimer = setTimeout(() => {
    neighborPreloadTimer = null;
    if (gen !== neighborPreloadGen) return;
    const neighbors = pickNearestNeighborImages(currentImage, n);
    if (!neighbors.length) return;
    const z = 0;
    neighbors.forEach(img => {
      waitForAllTilesDecoded(img, z);
      preloadToCache(img, z);
    });
  }, 80);
}

/** Whether overlay reproject-neighbor stack is active. */
function overlayNeighborsActive() {
  return !!(
    overlayEnabled &&
    overlayNeighborCount > 0 &&
    document.getElementById('overlayStretchToMainCb')?.checked
  );
}

/**
 * Lock neighbor identity to `mainImg` (look-at based). Returns the gen for prepare/reveal.
 * Call only when the main image identity changes (or settings force).
 */
function lockNeighborsForMain(mainImg) {
  neighborLayersMainName = mainImg ? mainImg.name : null;
  lockedNeighborImages = (mainImg && overlayNeighborsActive())
    ? pickNearestNeighborImages(mainImg, overlayNeighborCount, 'main')
    : [];
  overlayNeighborGen++;
  return overlayNeighborGen;
}

/**
 * Decode + mount locked neighbors at opacity 0. Does not fade — caller reveals
 * together with the main image once everything is ready.
 * @returns {Promise<{gen:number, newcomers:Element[], obsolete:Element[], clearAll?:boolean}|null>}
 */
function prepareLockedNeighborLayers(gen) {
  const area = document.getElementById('viewerArea');
  if (!area || !overlayEnabled) return Promise.resolve(null);
  if (gen !== overlayNeighborGen) return Promise.resolve(null);

  if (!overlayNeighborsActive() || !lockedNeighborImages.length) {
    const obsolete = Array.from(area.children).filter(el => el._overlayNeighborPreview);
    return Promise.resolve({ gen, newcomers: [], obsolete, clearAll: true });
  }

  const neighbors = lockedNeighborImages;
  const mainName = neighborLayersMainName;
  const z = 0;
  const fadeMs = IMAGE_CROSSFADE_MS;
  const waitMs = document.getElementById('waitFullTilesSwitchCb')?.checked ? 12000 : 2000;

  return new Promise(resolve => {
    let settled = false;
    const done = (result) => {
      if (settled) return;
      settled = true;
      resolve(result);
    };

    Promise.all(neighbors.map(ni => waitForAllTilesDecoded(ni, z))).then(() => {
      if (gen !== overlayNeighborGen) { done(null); return; }
      if (!overlayEnabled || neighborLayersMainName !== mainName) { done(null); return; }
      const area2 = document.getElementById('viewerArea');
      if (!area2) { done(null); return; }

      const wantNames = new Set(neighbors.map(ni => ni.name));
      const existing = Array.from(area2.children).filter(el => el._overlayNeighborPreview);
      const existingNames = new Set(
        existing.map(el => el._overlayImage && el._overlayImage.name).filter(Boolean)
      );
      if (
        wantNames.size === existingNames.size &&
        [...wantNames].every(name => existingNames.has(name))
      ) {
        neighbors.forEach(ni => preloadToCache(ni, z));
        syncOverlayLayersToMarker();
        done({ gen, newcomers: [], obsolete: [] });
        return;
      }

      const byName = new Map();
      const obsolete = [];
      for (const el of existing) {
        const name = el._overlayImage && el._overlayImage.name;
        if (!name || !wantNames.has(name) || byName.has(name)) {
          obsolete.push(el);
          continue;
        }
        byName.set(name, el);
      }

      const mainImg = currentImage;
      const [qx, qy] = (mainImg && mainImg.lookAtMgi)
        || wgs84ToMgi.forward([searchLon, searchLat]);
      const sorted = [...neighbors].sort((a, b) => {
        const da = Math.hypot(qx - a.lookAtMgi[0], qy - a.lookAtMgi[1]);
        const db = Math.hypot(qx - b.lookAtMgi[0], qy - b.lookAtMgi[1]);
        return db - da;
      });

      const histAnchor = firstHistoryLayer(area2);
      const newcomers = [];
      for (const ni of sorted) {
        let layer = byName.get(ni.name);
        if (!layer) {
          layer = buildNeighborLayerDOM(ni, z);
          layer.style.opacity = '0';
          layer.style.visibility = 'hidden'; // hide until first correct warp (avoids place-jump)
          layer.style.transition = `opacity ${fadeMs}ms ease`;
          layer._neighborPendingReveal = true;
          newcomers.push(layer);
          if (histAnchor) area2.insertBefore(layer, histAnchor);
          else area2.appendChild(layer);
        } else if (histAnchor && layer.nextSibling !== histAnchor) {
          area2.insertBefore(layer, histAnchor);
        }
      }

      syncOverlayLayersToMarker();
      // Safe to composite at opacity 0 now that transforms are set.
      for (const layer of newcomers) {
        layer.style.visibility = '';
      }

      const finishMount = () => {
        if (gen !== overlayNeighborGen) {
          newcomers.forEach(el => { if (el.isConnected) el.remove(); });
          done(null);
          return;
        }
        neighbors.forEach(ni => preloadToCache(ni, z));
        done({ gen, newcomers, obsolete });
      };

      if (!newcomers.length) {
        finishMount();
        return;
      }
      const imgs = [];
      newcomers.forEach(layer => {
        layer.querySelectorAll('.tile-canvas-wrap img').forEach(im => imgs.push(im));
      });
      whenImagesReady(imgs).then(finishMount);
      setTimeout(finishMount, waitMs);
    });
  });
}

/** Crossfade prepared neighbors (call in lockstep with main reveal). */
function beginNeighborCrossfade(prep) {
  if (!prep || prep.gen !== overlayNeighborGen) return;
  const fadeMs = IMAGE_CROSSFADE_MS;
  const { newcomers, obsolete, clearAll } = prep;

  if (clearAll) {
    for (const el of obsolete) {
      el.style.transition = `opacity ${fadeMs}ms ease`;
      el.style.opacity = '0';
      const capt = el;
      setTimeout(() => { if (capt.isConnected) capt.remove(); }, fadeMs + 40);
    }
    syncOrthoDimMainClass();
    return;
  }

  for (const el of obsolete) {
    el.style.transition = `opacity ${fadeMs}ms ease`;
    el.style.opacity = '0';
    const capt = el;
    setTimeout(() => { if (capt.isConnected) capt.remove(); }, fadeMs + 40);
  }

  // Ensure incoming neighbors are warped to the new main before they become visible.
  syncOverlayLayersToMarker();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (prep.gen !== overlayNeighborGen) return;
      for (const layer of newcomers) {
        if (!layer.isConnected) continue;
        layer.style.visibility = '';
        layer.style.opacity = '1';
        // Settings-only rebuild: no outgoing freeze — clear pending immediately.
        if (!transitionOutgoingMain) layer._neighborPendingReveal = false;
      }
    });
  });
  syncOrthoDimMainClass();
}

/**
 * Prefetch tile cache for main + its locked reproject neighbors (no DOM).
 * Used before openViewer so the joint reveal can start sooner.
 */
function waitForMainAndNeighborTiles(mainImg, zoom) {
  const tasks = [waitForAllTilesDecoded(mainImg, zoom)];
  if (overlayNeighborsActive()) {
    const neighbors = pickNearestNeighborImages(mainImg, overlayNeighborCount, 'main');
    neighbors.forEach(ni => tasks.push(waitForAllTilesDecoded(ni, 0)));
  }
  return Promise.all(tasks);
}

/**
 * Swap visible reprojected neighbor layers (settings / force path).
 * Main-image switches use prepare+reveal inside renderTiles instead.
 */
function scheduleRebuildOverlayNeighborLayers(force) {
  if (!currentImage) return;
  if (!force && neighborLayersMainName === currentImage.name) {
    schedulePreloadNeighborTiles();
    return;
  }
  const gen = lockNeighborsForMain(currentImage);
  if (neighborRebuildTimer) clearTimeout(neighborRebuildTimer);
  neighborRebuildTimer = setTimeout(() => {
    neighborRebuildTimer = null;
    if (gen !== overlayNeighborGen) return;
    prepareLockedNeighborLayers(gen).then(prep => {
      if (!prep || gen !== overlayNeighborGen) return;
      beginNeighborCrossfade(prep);
    });
  }, 40);
}

function onOverlayNeighborPreloadChange() {
  const sel = document.getElementById('overlayNeighborPreloadSel');
  overlayNeighborCount = sel ? Math.max(0, Number(sel.value) || 0) : 0;
  if (overlayEnabled) scheduleRebuildOverlayNeighborLayers(true);
}

function onOverlayReprojectChange() {
  if (!overlayEnabled) return;
  syncOverlayLayersToMarker();
  scheduleRebuildOverlayNeighborLayers(true);
  syncOrthoDimMainClass();
}

/**
 * Marker position in rotPadDiv scroll content: rotClip-relative coords plus optional ortho union offset.
 */
function markerScrollContentPx() {
  const o = markerVisualInPadPx();
  if (!o) return null;
  return {
    vx: o.vx + orthoContentOffsetX,
    vy: o.vy + orthoContentOffsetY,
  };
}

function rotateAround(x, y, cx, cy, degRad) {
  const cos = Math.cos(degRad);
  const sin = Math.sin(degRad);
  const dx = x - cx;
  const dy = y - cy;
  return {
    x: cx + dx * cos - dy * sin,
    y: cy + dx * sin + dy * cos,
  };
}

/**
 * Globe ortho: tiles on a north-up metric plane with a *fixed* MGI origin + locked scale.
 * Tile matrices only rebuild when the origin snaps; each frame only the container
 * local-patch warp updates — avoids marker-relative tile reshuffling wiggle.
 */
function computeOrthoLayoutGlobeMetric(virt) {
  if (!orthoTilesData || !orthoTilesData.tiles || !orthoTilesData.tiles.length) return null;
  if (!virt?.pToImage) return null;

  const hVal = document.getElementById('heightNum').value;
  const Z = hVal === '' ? 0 : Number(hVal);
  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
  const area = document.getElementById('viewerArea');
  const viewW = area?.clientWidth || 800;
  const viewH = area?.clientHeight || 600;
  const disp = currentDispScale > 0 ? currentDispScale : 1;

  if (orthoGlobeLockedZoom !== viewerZoom) {
    orthoGlobeLockedScale = null;
    orthoGlobeLockedZoom = viewerZoom;
  }

  const p0 = groundMgiToPixel(virt, mx, my, Z);
  const pE = groundMgiToPixel(virt, mx + 10, my, Z);
  const pN = groundMgiToPixel(virt, mx, my + 10, Z);
  if (!p0 || !pE || !pN) return null;
  const targetS = (
    Math.hypot(pE[0] - p0[0], pE[1] - p0[1]) +
    Math.hypot(pN[0] - p0[0], pN[1] - p0[1])
  ) / 20 * disp;
  if (!(targetS > 1e-6)) return null;

  if (!(orthoGlobeLockedScale > 0) || Math.abs(orthoGlobeLockedScale - targetS) / targetS > 0.12) {
    orthoGlobeLockedScale = targetS;
  }
  const s = orthoGlobeLockedScale;

  // Fixed snapped origin — only moves in ORTHO_ORIGIN_SNAP_M steps when far enough.
  let originX, originY;
  const el = document.getElementById('orthoUnderlay');
  const prevOx = el?._orthoOriginX;
  const prevOy = el?._orthoOriginY;
  if (Number.isFinite(prevOx) && Number.isFinite(prevOy) &&
      Math.hypot(mx - prevOx, my - prevOy) < ORTHO_REBUILD_DIST_M) {
    originX = prevOx;
    originY = prevOy;
  } else {
    originX = Math.round(mx / ORTHO_ORIGIN_SNAP_M) * ORTHO_ORIGIN_SNAP_M;
    originY = Math.round(my / ORTHO_ORIGIN_SNAP_M) * ORTHO_ORIGIN_SNAP_M;
  }

  const marginM = Math.max(viewW, viewH) / (2 * s) * 1.6 + 150;

  function metricFromMgi(X, Y) {
    return { x: (X - originX) * s, y: (originY - Y) * s };
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const nearby = [];
  for (const t of orthoTilesData.tiles) {
    if (t.xmax < originX - marginM || t.xmin > originX + marginM ||
        t.ymax < originY - marginM || t.ymin > originY + marginM) continue;
    nearby.push(t);
    const corners = [
      metricFromMgi(t.xmin, t.ymax),
      metricFromMgi(t.xmax, t.ymax),
      metricFromMgi(t.xmax, t.ymin),
      metricFromMgi(t.xmin, t.ymin),
    ];
    for (const p of corners) {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    }
  }
  if (!nearby.length || !Number.isFinite(minX)) return null;

  const pad = Math.max(viewW, viewH) * 0.35;
  const minLeft = minX - pad;
  const minTop = minY - pad;
  const maxRight = maxX + pad;
  const maxBottom = maxY + pad;
  const unionW = Math.max(1, Math.ceil(maxRight - minLeft));
  const unionH = Math.max(1, Math.ceil(maxBottom - minTop));

  const markerMetX = (mx - originX) * s;
  const markerMetY = (originY - my) * s;
  const orthoMarkerX = markerMetX - minLeft;
  const orthoMarkerY = markerMetY - minTop;

  let orthoTilesHtml = '';
  const orthoTileLayers = [];
  const orthoEdgeTrim = IMAGE_EDGE_TRIM_SOURCE_PX;
  for (const t of nearby) {
    const pw = t.previewWidth || 1024;
    const ph = t.previewHeight || 1024;
    const p0m = metricFromMgi(t.xmin, t.ymax);
    const p1m = metricFromMgi(t.xmax, t.ymax);
    const p2m = metricFromMgi(t.xmax, t.ymin);
    const p3m = metricFromMgi(t.xmin, t.ymin);
    const q0 = { x: p0m.x - minLeft, y: p0m.y - minTop };
    const q1 = { x: p1m.x - minLeft, y: p1m.y - minTop };
    const q2 = { x: p2m.x - minLeft, y: p2m.y - minTop };
    const q3 = { x: p3m.x - minLeft, y: p3m.y - minTop };
    const H = homographyFrom4Points2D(
      [[0, 0], [pw, 0], [pw, ph], [0, ph]],
      [[q0.x, q0.y], [q1.x, q1.y], [q2.x, q2.y], [q3.x, q3.y]],
    );
    if (!H) continue;
    const mat3d = homography3x3ToMatrix3dString(H);
    orthoTileLayers.push({ previewUrl: t.previewUrl, pw, ph, mat3d });
    orthoTilesHtml += `<img src="${t.previewUrl}" alt="" draggable="false" loading="eager" decoding="async" width="${pw}" height="${ph}"
      style="position:absolute;left:0;top:0;opacity:.88;pointer-events:none;transform-origin:0 0;transform:${mat3d};clip-path:inset(${orthoEdgeTrim}px ${orthoEdgeTrim}px 0 0);"
      onerror="this.style.opacity='.1'"/>`;
  }
  if (!orthoTilesHtml.trim()) return null;

  return {
    orthoTilesHtml,
    orthoTileLayers,
    unionW,
    unionH,
    minLeft,
    minTop,
    obliqueLeft: 0,
    obliqueTop: 0,
    orthoMarkerX,
    orthoMarkerY,
    metricScale: s,
    originX,
    originY,
    globeMetric: true,
    worldW: maxRight - minLeft,
    worldH: maxBottom - minTop,
  };
}

/**
 * Shared MGI layout for ortho preview tiles (*_s0.jpg ~1024px or *_s1 from JSON): full pinhole at fixed Z,
 * marker-relative CSS in unrotated rotClip space, then rotClip auto-rotate; each tile warped with a
 * perspective homography (CSS matrix3d). Affine Jacobian + matrix() was only valid near the marker.
 */
function computeOrthoLayout(img, rotDeg, contentW, contentH) {
  if (!orthoTilesData || !orthoTilesData.tiles || !orthoTilesData.tiles.length) return null;
  if (!img || !img.pToImage) return null;

  if (globeModeEnabled) {
    return computeOrthoLayoutGlobeMetric(img);
  }

  const hVal = document.getElementById('heightNum').value;
  const Z = hVal === '' ? 0 : Number(hVal);

  const proj = projectToPixel(img, searchLat, searchLon, Z);
  if (!proj) return null;
  const markerDXLoc = proj[0] * currentDispScale;
  const markerDYLoc = proj[1] * currentDispScale;

  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);

  /** MGI → CSS px in unrotated rotClip space, exact pinhole at Z (marker = origin). */
  function unionUnrotFromMgi(X, Y) {
    const pp = groundMgiToPixel(img, X, Y, Z);
    if (!pp) return null;
    return {
      x: (pp[0] - proj[0]) * currentDispScale,
      y: (pp[1] - proj[1]) * currentDispScale,
    };
  }

  const rotRad = (rotDeg * Math.PI) / 180;
  const rcx = contentW / 2;
  const rcy = contentH / 2;

  /** rotClip top-left (0,0) in union — native (0,0) → marker-relative (−marker). */
  const p0Unrot = { x: -markerDXLoc, y: -markerDYLoc };
  const rotCx = p0Unrot.x + rcx;
  const rotCy = p0Unrot.y + rcy;

  function unionRotFromMgi(X, Y) {
    const u = unionUnrotFromMgi(X, Y);
    if (!u) return null;
    if (rotRad === 0) return u;
    return rotateAround(u.x, u.y, rotCx, rotCy, rotRad);
  }

  function rotClipCornerUnion(cw, ch) {
    const local = rotateAround(cw, ch, rcx, rcy, rotRad);
    return { x: p0Unrot.x + local.x, y: p0Unrot.y + local.y };
  }

  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  const rcCorners = [[0, 0], [contentW, 0], [contentW, contentH], [0, contentH]];
  for (let i = 0; i < rcCorners.length; i++) {
    const p = rotClipCornerUnion(rcCorners[i][0], rcCorners[i][1]);
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x);
    maxY = Math.max(maxY, p.y);
  }

  const corners = [
    ['xmin', 'ymax'],
    ['xmax', 'ymax'],
    ['xmax', 'ymin'],
    ['xmin', 'ymin'],
  ];
  for (const t of orthoTilesData.tiles) {
    for (const [xk, yk] of corners) {
      const p = unionRotFromMgi(t[xk], t[yk]);
      if (!p) continue;
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    }
  }

  const rotExtraRad = Math.abs(rotRad);
  const rotExtraW = Math.round((contentW * (1 - Math.cos(rotExtraRad)) + contentH * Math.sin(rotExtraRad)) / 2);
  const rotExtraH = Math.round((contentH * (1 - Math.cos(rotExtraRad)) + contentW * Math.sin(rotExtraRad)) / 2);

  const minLeft = Math.min(0, minX - rotExtraW);
  const minTop = Math.min(0, minY - rotExtraH);
  const maxRight = maxX + rotExtraW;
  const maxBottom = maxY + rotExtraH;

  const unionW = Math.max(1, Math.round(maxRight - minLeft));
  const unionH = Math.max(1, Math.round(maxBottom - minTop));

  const obliqueLeft = p0Unrot.x;
  const obliqueTop = p0Unrot.y;

  const mPt = unionRotFromMgi(mx, my);
  if (!mPt) return null;
  const orthoMarkerX = mPt.x - minLeft;
  const orthoMarkerY = mPt.y - minTop;

  let orthoTilesHtml = '';
  const orthoTileLayers = [];
  const orthoEdgeTrim = IMAGE_EDGE_TRIM_SOURCE_PX;
  for (const t of orthoTilesData.tiles) {
    const pw = t.previewWidth || 1024;
    const ph = t.previewHeight || 1024;
    const p0 = unionRotFromMgi(t.xmin, t.ymax);
    const p1 = unionRotFromMgi(t.xmax, t.ymax);
    const p2 = unionRotFromMgi(t.xmax, t.ymin);
    const p3 = unionRotFromMgi(t.xmin, t.ymin);
    if (!p0 || !p1 || !p2 || !p3) continue;
    const q0 = { x: p0.x - minLeft, y: p0.y - minTop };
    const q1 = { x: p1.x - minLeft, y: p1.y - minTop };
    const q2 = { x: p2.x - minLeft, y: p2.y - minTop };
    const q3 = { x: p3.x - minLeft, y: p3.y - minTop };
    const H = homographyFrom4Points2D(
      [[0, 0], [pw, 0], [pw, ph], [0, ph]],
      [[q0.x, q0.y], [q1.x, q1.y], [q2.x, q2.y], [q3.x, q3.y]],
    );
    if (!H) continue;
    const mat3d = homography3x3ToMatrix3dString(H);
    orthoTileLayers.push({ previewUrl: t.previewUrl, pw, ph, mat3d });
    orthoTilesHtml += `<img src="${t.previewUrl}" alt="" draggable="false" loading="eager" decoding="async" width="${pw}" height="${ph}"
      style="position:absolute;left:0;top:0;opacity:.88;pointer-events:none;transform-origin:0 0;transform:${mat3d};clip-path:inset(${orthoEdgeTrim}px ${orthoEdgeTrim}px 0 0);"
      onerror="this.style.opacity='.1'"/>`;
  }

  if (!orthoTilesHtml.trim()) return null;

  return {
    orthoTilesHtml,
    orthoTileLayers,
    unionW,
    unionH,
    minLeft,
    minTop,
    obliqueLeft,
    obliqueTop,
    orthoMarkerX,
    orthoMarkerY,
    globeMetric: false,
    worldW: maxRight - minLeft,
    worldH: maxBottom - minTop,
  };
}

/** Update existing ortho <img> transforms without replacing innerHTML (avoids decode blink). */
function applyOrthoTileSpecsToContainer(container, layout) {
  if (!container || !layout.orthoTileLayers) return;
  const specs = layout.orthoTileLayers;
  const imgs = container.querySelectorAll(':scope > img');
  if (imgs.length !== specs.length || specs.length === 0) {
    container.innerHTML = layout.orthoTilesHtml;
    return;
  }
  for (let i = 0; i < specs.length; i++) {
    const imgEl = imgs[i];
    const spec = specs[i];
    const want = spec.previewUrl;
    const have = imgEl.getAttribute('src') || '';
    const tail = want.split('/').pop();
    if (have !== want && !(tail && have.endsWith(tail))) {
      container.innerHTML = layout.orthoTilesHtml;
      return;
    }
    imgEl.width = spec.pw;
    imgEl.height = spec.ph;
    imgEl.style.cssText =
      'position:absolute;left:0;top:0;opacity:.88;pointer-events:none;transform-origin:0 0;'
      + `transform:${spec.mat3d};`;
  }
}

function applyOrthoLayoutToUnderlay(el, layout) {
  if (!el || !layout) return;
  el._orthoMarkerX = layout.orthoMarkerX;
  el._orthoMarkerY = layout.orthoMarkerY;
  el._orthoGlobeMetric = !!layout.globeMetric;
  el._orthoMetricScale = layout.metricScale || null;
  el._orthoMinLeft = layout.minLeft;
  el._orthoMinTop = layout.minTop;
  el._orthoOriginX = layout.originX;
  el._orthoOriginY = layout.originY;
  applyOrthoTileSpecsToContainer(el, layout);
  el.style.cssText =
    `position:absolute;left:0;top:0;width:${layout.unionW}px;height:${layout.unionH}px;`
    + 'z-index:0;pointer-events:none;will-change:transform;filter:saturate(0.88) brightness(0.92);';
}

/**
 * Recompute ortho geometry after marker / auto-rotate moves without a full renderTiles (overlay mode).
 * Globe metric: skip tile rebuild while inside the origin cell — only marker coords change.
 */
function refreshOrthoUnderlayLive() {
  if (!currentImage) return;
  if (zoomRescaleHold) {
    applyZoomRescaleHold();
    return;
  }
  const el = document.getElementById('orthoUnderlay');
  if (!el) return;
  if (globeModeEnabled) updateVirtualGlobeCamera();

  if (globeModeEnabled && el._orthoGlobeMetric &&
      Number.isFinite(el._orthoOriginX) && Number.isFinite(el._orthoOriginY) &&
      el._orthoMetricScale > 0) {
    const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
    const dist = Math.hypot(mx - el._orthoOriginX, my - el._orthoOriginY);
    if (dist < ORTHO_REBUILD_DIST_M && orthoGlobeLockedZoom === viewerZoom) {
      const s = el._orthoMetricScale;
      el._orthoMarkerX = (mx - el._orthoOriginX) * s - el._orthoMinLeft;
      el._orthoMarkerY = (el._orthoOriginY - my) * s - el._orthoMinTop;
      if (!zoomToMarker) syncOrthoUnderlayTransform();
      return;
    }
  }

  const cam = getDisplayCameraImg() || currentImage;
  const layout = computeOrthoLayout(cam, globeModeEnabled ? 0 : currentRotDeg, currentContentW, currentContentH);
  if (!layout) return;
  applyOrthoLayoutToUnderlay(el, layout);
  if (!zoomToMarker) syncOrthoUnderlayTransform();
}

/** Single-image mode: same live ortho update as overlay (marker drag without renderTiles). */
function refreshOrthoSingleModeLive() {
  if (overlayEnabled || !currentImage) return;
  const base = document.getElementById('orthoBaseLayer');
  const wrap = document.getElementById('orthoUnionWrap');
  const slot = document.getElementById('orthoObliqueSlot');
  if (!base || !wrap || !slot) return;
  const layout = computeOrthoLayout(currentImage, currentRotDeg, currentContentW, currentContentH);
  if (!layout) return;
  applyOrthoTileSpecsToContainer(base, layout);
  wrap.style.width = `${layout.unionW}px`;
  wrap.style.height = `${layout.unionH}px`;
  slot.style.left = `${layout.obliqueLeft - layout.minLeft}px`;
  slot.style.top = `${layout.obliqueTop - layout.minTop}px`;
  orthoContentOffsetX = layout.obliqueLeft - layout.minLeft;
  orthoContentOffsetY = layout.obliqueTop - layout.minTop;
}

/**
 * Overlay mode (infinite-scroll default): ortho lives in #orthoUnderlay behind stack; transform matches top layer.
 */
function updateOrthoUnderlayForOverlay(img, rotDeg, contentW, contentH) {
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const layout = computeOrthoLayout(img, rotDeg, contentW, contentH);
  let el = document.getElementById('orthoUnderlay');
  if (!layout) {
    if (el) el.remove();
    area.classList.remove('has-ortho');
    area.classList.remove('ortho-bg-hidden');
    orthoBackgroundVisible = true;
    syncOrthoDimMainClass();
    return;
  }
  area.classList.add('has-ortho');
  if (!el) {
    el = document.createElement('div');
    el.id = 'orthoUnderlay';
    el.setAttribute('aria-hidden', 'true');
    area.insertBefore(el, area.firstChild);
  }
  applyOrthoLayoutToUnderlay(el, layout);
  syncOrthoDimMainClass();
  syncOrthoBackgroundVisibilityClass();
}

function removeOrthoUnderlay() {
  const el = document.getElementById('orthoUnderlay');
  const area = document.getElementById('viewerArea');
  if (el) el.remove();
  if (area) {
    area.classList.remove('has-ortho');
    area.classList.remove('has-ortho-dim-main');
    area.classList.remove('ortho-bg-hidden');
  }
  orthoBackgroundVisible = true;
}

/** Apply .ortho-bg-hidden from orthoBackgroundVisible (call after has-ortho is set). */
function syncOrthoBackgroundVisibilityClass() {
  const area = document.getElementById('viewerArea');
  if (!area || !area.classList.contains('has-ortho')) {
    area?.classList.remove('ortho-bg-hidden');
    syncOrthoToggleButtons();
    return;
  }
  area.classList.toggle('ortho-bg-hidden', !orthoBackgroundVisible);
  syncOrthoToggleButtons();
}

/** Keep header + FAB ortho buttons in sync with visibility / availability. */
function syncOrthoToggleButtons() {
  const area = document.getElementById('viewerArea');
  const hasOrtho = !!(area && area.classList.contains('has-ortho'));
  const hdr = document.getElementById('orthoToggleBtn');
  const fab = document.getElementById('orthoToggleFabBtn');
  const labelOn = '▣ Ortho';
  const labelOff = '▢ Ortho';
  if (hdr) {
    hdr.disabled = !hasOrtho;
    hdr.textContent = orthoBackgroundVisible ? labelOn : labelOff;
    hdr.style.opacity = !hasOrtho ? '.35' : (orthoBackgroundVisible ? '' : '.5');
    hdr.title = hasOrtho
      ? (orthoBackgroundVisible ? 'Hide nadir orthophoto underlay (Shift+O)' : 'Show nadir orthophoto underlay (Shift+O)')
      : 'No orthophoto underlay for this view';
  }
  if (fab) {
    fab.disabled = !hasOrtho;
    fab.style.opacity = !hasOrtho ? '.35' : (orthoBackgroundVisible ? '' : '.5');
    fab.setAttribute('aria-pressed', orthoBackgroundVisible && hasOrtho ? 'true' : 'false');
    fab.title = hdr ? hdr.title : '';
  }
}

/** Hotkey: Shift+O when viewer has ortho (single or overlay mode). */
function toggleOrthoBackground() {
  const area = document.getElementById('viewerArea');
  if (!area || !area.classList.contains('has-ortho')) return;
  orthoBackgroundVisible = !orthoBackgroundVisible;
  syncOrthoBackgroundVisibilityClass();
}

/** When ortho is on: dim main tiles only if no reprojected neighbor stack sits under them (avoids “double” transparent main). */
function syncOrthoDimMainClass() {
  const area = document.getElementById('viewerArea');
  if (!area) return;
  if (!area.classList.contains('has-ortho')) {
    area.classList.remove('has-ortho-dim-main');
    return;
  }
  if (!overlayEnabled) {
    area.classList.add('has-ortho-dim-main');
    return;
  }
  const reproject = document.getElementById('overlayStretchToMainCb')?.checked;
  const dim = !reproject || overlayNeighborCount === 0;
  area.classList.toggle('has-ortho-dim-main', dim);
}

/**
 * When ortho data exists, wrap the oblique stack and nadir preview tiles in a shared MGI-aligned canvas.
 */
function wrapInnerHtmlWithOrthoIfNeeded(innerHtml, img, rotDeg, contentW, contentH) {
  orthoContentOffsetX = 0;
  orthoContentOffsetY = 0;
  const layout = computeOrthoLayout(img, rotDeg, contentW, contentH);
  const area = document.getElementById('viewerArea');
  if (!layout) {
    if (area) {
      area.classList.remove('has-ortho');
      area.classList.remove('has-ortho-dim-main');
      area.classList.remove('ortho-bg-hidden');
      orthoBackgroundVisible = true;
    }
    return innerHtml;
  }
  if (area) area.classList.add('has-ortho');

  orthoContentOffsetX = layout.obliqueLeft - layout.minLeft;
  orthoContentOffsetY = layout.obliqueTop - layout.minTop;

  return `
    <div id="orthoUnionWrap" style="position:relative;width:${layout.unionW}px;height:${layout.unionH}px;flex-shrink:0;">
      <div id="orthoBaseLayer" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible;filter:saturate(0.88) brightness(0.92);">${layout.orthoTilesHtml}</div>
      <div id="orthoObliqueSlot" style="position:absolute;left:${layout.obliqueLeft - layout.minLeft}px;top:${layout.obliqueTop - layout.minTop}px;z-index:1;">${innerHtml}</div>
    </div>`;
}

function renderTiles(img, zoom) {
  orthoContentOffsetX = orthoContentOffsetY = 0;
  const area = document.getElementById('viewerArea');
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];

  // Base scale fits image to viewer; viewerZoom multiplies on top of that.
  const viewW = area.clientWidth  || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  const scale     = baseScale * viewerZoom;
  const dispTileW = Math.max(1, Math.round(tileSize * res * scale));
  const edgeTrimDisp = edgeTrimDisplayPx(scale);
  currentDispScale = scale;
  currentEdgeTrimDisp = edgeTrimDisp;

  const topBlack = Math.ceil((rows * tileSize * res - img.height) * scale);
  const contentW = Math.floor(img.width  * scale);
  const contentH = Math.floor(img.height * scale);
  const clipW = Math.max(1, contentW - edgeTrimDisp);
  const clipH = Math.max(1, contentH - edgeTrimDisp);

  // Image rotation: marker-centring or horizon-level (mutually exclusive modes).
  // Globe mode bakes orientation into the virtual camera — keep native layers unrotated.
  const rotDeg = globeModeEnabled ? 0 : computeAutoRotDegForImage(img);
  currentRotDeg   = rotDeg;
  currentContentW = contentW;
  currentContentH = contentH;
  updateRotateModeButtons(rotDeg);

  // Absolute marker-centring: CSS translate on each layer (same path with or without overlay stacking).
  viewPadX = 0;
  viewPadY = 0;
  area.style.overflow = 'hidden';

  let tilesHtml = '';
  for (let y = rows - 1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="eager" decoding="async" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }

  const rotStyle = rotDeg !== 0
    ? `transform:rotate(${rotDeg}deg);transform-origin:50% 50%;`
    : '';

  // IDs rotPadDiv / rotClipDiv / dotOverlay always belong to the CURRENT (topmost) layer.
  const innerHtml = `
    <div id="rotClipDiv" style="position:relative;width:${clipW}px;height:${clipH}px;overflow:hidden;${rotStyle}">
      <div style="position:absolute;top:-${topBlack + edgeTrimDisp}px;left:0;">
        <div class="tile-canvas-wrap">${tilesHtml}</div>
      </div>
      <svg id="dotOverlay" style="position:absolute;top:0;left:0;width:${clipW}px;height:${clipH}px;overflow:visible;pointer-events:none;"></svg>
    </div>`;

  // During a pending main crossfade or zoom rescale hold, keep the visible ortho
  // on its captured transform (rebuilding here flashed the wrong scale).
  if (!transitionOutgoingMain && !zoomRescaleHold) {
    if (globeModeEnabled) updateVirtualGlobeCamera(img);
    const orthoCam = getDisplayCameraImg() || img;
    updateOrthoUnderlayForOverlay(orthoCam, globeModeEnabled ? 0 : rotDeg, contentW, contentH);
  } else if (globeModeEnabled) {
    updateVirtualGlobeCamera(transitionOutgoingMain || img);
  }

  const morphFrom = pendingDisplayJFrom;
  pendingDisplayJFrom = null;

  let prevMainName = null;
  for (let i = area.children.length - 1; i >= 0; i--) {
    const el = area.children[i];
    if (el._overlayHistory && el._overlayImage) {
      prevMainName = el._overlayImage.name;
      break;
    }
  }
  const mainChanged = !prevMainName || prevMainName !== img.name;
  // Same main, new viewerZoom / tile layout — old layers have tiles baked at the previous scale.
  const zoomRescale = !!prevMainName && !mainChanged;

  if (!zoomRescale) {
    // Zoom hold only applies to same-main rescale waits.
    clearZoomRescaleHold();
  }

  if (zoomRescale) {
    // Drop wrong-scale neighbor DOMs now; remount after lock (below). Keep old main
    // visible (under zoomRescaleHold) until the new one is ready.
    Array.from(area.children).forEach(el => {
      if (el._overlayNeighborPreview) el.remove();
    });
    neighborLayersMainName = null;
    lockedNeighborImages = [];
    applyZoomRescaleHold();
  }

  const hadPrev = Array.from(area.children).some(el => el._overlayHistory);

  const oldPad  = area.querySelector('#rotPadDiv');
  const oldClip = area.querySelector('#rotClipDiv');
  const oldSvg  = area.querySelector('#dotOverlay');
  if (oldPad)  oldPad.removeAttribute('id');
  if (oldClip) oldClip.removeAttribute('id');
  if (oldSvg)  oldSvg.remove();

  const layer = document.createElement('div');
  layer.id = 'rotPadDiv';
  layer.style.cssText = 'position:absolute;left:0;top:0;will-change:transform,opacity;';
  layer.innerHTML = innerHtml;
  layer._overlayImage = img;
  layer._overlayRotDeg = rotDeg;
  layer._overlayHistory = true;
  layer._overlayNeighborPreview = false;

  // Hold new main (and later neighbors) invisible until main + reprojected set are ready.
  // Zoom rescale also remounts neighbors at the new baked scale.
  const jointNeighborReveal = overlayEnabled && (mainChanged || zoomRescale);
  if (hadPrev || jointNeighborReveal) {
    layer.style.opacity = '0';
    layer.style.visibility = 'hidden';
    layer.style.transition = zoomRescale ? '' : `opacity ${IMAGE_CROSSFADE_MS}ms ease`;
    layer._overlayPendingReveal = true;
  }
  area.appendChild(layer);

  // Arm Jacobian morph before the first sync so the new view starts matching the old foreshortening.
  if (hadPrev && morphFrom && !globeModeEnabled && !zoomRescale) {
    armDisplayJacobianTransition(morphFrom);
  }

  // Lock + decode/mount new reprojected neighbors now; fade them with the main.
  let neighborPrepPromise = Promise.resolve(null);
  if (jointNeighborReveal) {
    const nGen = lockNeighborsForMain(img);
    neighborPrepPromise = prepareLockedNeighborLayers(nGen);
  }

  const afterMount = () => {
    // Place incoming layers with the new camera; outgoing stack keeps transitionOutgoingMain.
    syncOverlayLayersToMarker();
    if (layer._overlayPendingReveal) layer.style.visibility = '';
    refreshDot();
    updateCacheSizeDropdownLabels();
    updateZoomPillClasses();
    if (overlayEnabled) applyOverlayStitchedLayerVisibility();
    syncOrthoDimMainClass();
    syncOrthoBackgroundVisibilityClass();
  };
  afterMount();

  const revealGen = ++imageRevealGen;
  let revealed = false;
  let neighborPrep = null;
  const reveal = () => {
    if (revealed || revealGen !== imageRevealGen) return;
    revealed = true;
    const finishTransition = () => {
      if (revealGen !== imageRevealGen) return;
      // Crossfade done — drop outgoing freeze and settle everyone on the new main.
      transitionOutgoingMain = null;
      clearZoomRescaleHold();
      layer._overlayPendingReveal = false;
      const area2 = document.getElementById('viewerArea');
      if (area2) {
        Array.from(area2.children).forEach(el => {
          if (el._neighborPendingReveal) el._neighborPendingReveal = false;
        });
      }
      if (globeModeEnabled) updateVirtualGlobeCamera(currentImage);
      const orthoCam = getDisplayCameraImg() || currentImage;
      if (orthoCam) {
        updateOrthoUnderlayForOverlay(
          orthoCam,
          globeModeEnabled ? 0 : currentRotDeg,
          currentContentW,
          currentContentH
        );
      }
      trimOverlayHistory();
      syncOverlayLayersToMarker();
      updateOverlayBlur();
      applyOverlayStitchedLayerVisibility();
      syncOrthoDimMainClass();
    };
    const runFade = () => {
      if (revealGen !== imageRevealGen) return;

      if (zoomRescale) {
        // Hard-swap: remove previous same-main history (wrong baked scale → “echo”),
        // show new main + remounted neighbors at the new zoom immediately.
        Array.from(area.children).forEach(el => {
          if (el._overlayHistory && el !== layer) el.remove();
        });
        layer.style.visibility = '';
        layer.style.opacity = '1';
        layer._overlayPendingReveal = false;
        if (neighborPrep) {
          for (const el of (neighborPrep.obsolete || [])) {
            if (el.isConnected) el.remove();
          }
          for (const n of (neighborPrep.newcomers || [])) {
            if (!n.isConnected) continue;
            n.style.transition = '';
            n.style.visibility = '';
            n.style.opacity = '1';
            n._neighborPendingReveal = false;
          }
          // If prepare returned empty newcomers (already mounted), ensure opacity.
          Array.from(area.children).forEach(el => {
            if (el._overlayNeighborPreview) {
              el.style.visibility = '';
              el.style.opacity = '1';
              el._neighborPendingReveal = false;
            }
          });
        }
        finishTransition();
        return;
      }

      // Keep transitionOutgoingMain through the fade so the old stack does not snap.
      syncOverlayLayersToMarker();
      layer.style.visibility = '';
      layer.style.opacity = '1';
      if (jointNeighborReveal) beginNeighborCrossfade(neighborPrep);
      setTimeout(finishTransition, IMAGE_CROSSFADE_MS + 40);
    };
    if (hadPrev || jointNeighborReveal) {
      // Double rAF so opacity:0 is committed before fading in.
      requestAnimationFrame(() => {
        requestAnimationFrame(runFade);
      });
    } else {
      transitionOutgoingMain = null;
      trimOverlayHistory();
      syncOverlayLayersToMarker();
    }
  };

  const waitMs = document.getElementById('waitFullTilesSwitchCb')?.checked ? 12000 : 2000;
  const mainReady = whenImagesReady(layer.querySelectorAll('.tile-canvas-wrap img'));
  // Only reveal once main tiles AND new reprojected layers are loaded (or timeout).
  Promise.all([mainReady, neighborPrepPromise]).then(([, prep]) => {
    if (revealGen !== imageRevealGen) return;
    neighborPrep = prep;
    reveal();
  });
  setTimeout(() => {
    if (revealed || revealGen !== imageRevealGen) return;
    // Timeout: use whatever neighbor prep has finished; otherwise skip neighbor fade this frame.
    neighborPrepPromise.then(prep => {
      if (revealed || revealGen !== imageRevealGen) return;
      neighborPrep = prep;
      reveal();
    });
  }, waitMs);
}

// ═══════════════════════════════════════════════════════════════
//  DOT OVERLAY  – called whenever height changes or image changes
// ═══════════════════════════════════════════════════════════════
/** Called when the ground-elevation (Z) slider/input changes.
 *  Refreshes the dot projection AND re-evaluates the inFrame filter so the
 *  "Hide ⚠ outside" checkbox reflects the new elevation immediately. */
function onHeightChange() {
  refreshDot();
  if (searchResults.length) applySort();
}

function refreshDot() {
  const svgEl = document.getElementById('dotOverlay');
  if (!svgEl || !currentImage) return;

  // Z=0 is the valid ground datum for this dataset — do not fall back to 170.
  const hVal = document.getElementById('heightNum').value;
  const groundHeight = hVal === '' ? 0 : Number(hVal);
  const result = projectToPixel(currentImage, searchLat, searchLon, groundHeight);

  svgEl.style.display = markerVisible ? '' : 'none';
  svgEl.innerHTML = '';

  // Always compute display position — needed by scrollToMarker even when hidden.
  if (!result) { markerDX = markerDY = -1; return; }
  const [px, py] = result;

  const scale = currentDispScale;
  const dx = px * scale;
  const dy = py * scale - currentEdgeTrimDisp;
  markerDX = dx;
  markerDY = dy;

  // Draw the marker only when visible.
  if (markerVisible) {
    const W = Math.max(1, Math.floor(currentImage.width  * scale) - currentEdgeTrimDisp);
    const H = Math.max(1, Math.floor(currentImage.height * scale) - currentEdgeTrimDisp);

    const stroke = currentImage.coversPoint ? '#ff3333' : '#ffaa00';
    const warn = currentImage.coversPoint ? '' : `
      <rect x="0" y="0" width="${W}" height="22" fill="#000" fill-opacity=".55"/>
      <text x="6" y="15" fill="#ffaa00" font-size="11" font-family="sans-serif">
        Point outside ground footprint — marker is extrapolated, not reliable
      </text>`;

    const inFrame = dx >= 0 && dx <= W && dy >= 0 && dy <= H;
    if (inFrame) {
      svgEl.innerHTML = warn + `
        <line x1="${dx-24}" y1="${dy}" x2="${dx+24}" y2="${dy}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <line x1="${dx}" y1="${dy-24}" x2="${dx}" y2="${dy+24}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="14" fill="none" stroke="${stroke}" stroke-width="2" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="3" fill="${stroke}" opacity=".95"/>`;
    } else {
      const cx = W/2, cy = H/2;
      const angle = Math.atan2(dy - cy, dx - cx);
      const ex = cx + Math.cos(angle) * Math.min(cx, cy) * 0.85;
      const ey = cy + Math.sin(angle) * Math.min(cx, cy) * 0.85;
      svgEl.innerHTML = warn + `
        <circle cx="${ex}" cy="${ey}" r="8" fill="none" stroke="${stroke}" stroke-width="2" opacity=".7"/>
        <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
        <text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="middle" fill="${stroke}" font-size="11">→</text>`;
    }
  }

  // Live rotation update while moving: only “rotate to marker” depends on the marker.
  if (!globeModeEnabled && rotateMode === 'marker' && currentImage.pToImage && result) {
    const fx = Math.hypot(
      currentImage.pToImage[0][0],
      currentImage.pToImage[0][1],
      currentImage.pToImage[0][2]
    );
    const newRot = (fx >= 1)
      ? -Math.atan((px - currentImage.width / 2) / fx) * (180 / Math.PI)
      : 0;
    if (Math.abs(newRot - currentRotDeg) > 0.15) {
      currentRotDeg = newRot;
      updateRotateModeButtons(newRot);
      const clipDiv = document.getElementById('rotClipDiv');
      if (clipDiv) clipDiv.style.transform = `rotate(${newRot}deg)`;
      // Absolute layers use CSS translate for centring — do not rewrite scroll padding.
      const padDiv = document.getElementById('rotPadDiv');
      if (padDiv && !padDiv._overlayImage && !pinMarkerCenter) {
        const area2  = document.getElementById('viewerArea');
        const vW2    = area2.clientWidth  || 800;
        const vH2    = area2.clientHeight || 600;
        const rRad   = Math.abs(newRot) * Math.PI / 180;
        const exW    = Math.round((currentContentW * (1 - Math.cos(rRad)) + currentContentH * Math.sin(rRad)) / 2);
        const exH    = Math.round((currentContentH * (1 - Math.cos(rRad)) + currentContentW * Math.sin(rRad)) / 2);
        viewPadX = Math.max(0, Math.floor((vW2 - currentContentW) / 2)) + exW;
        viewPadY = Math.max(0, Math.floor((vH2 - currentContentH) / 2)) + exH;
        padDiv.style.padding = `${viewPadY}px ${viewPadX}px`;
      }
    }
  }

  // Keep ortho aligned with the marker / auto-rotate before layer translate (avoids lag and innerHTML blink).
  if (markerDX >= 0 && markerDY >= 0) {
    if (document.getElementById('orthoUnderlay')) refreshOrthoUnderlayLive();
    else if (document.getElementById('orthoUnionWrap')) refreshOrthoSingleModeLive();
  }

  // Scroll to marker if that option is on (independent of marker visibility).
  scrollToMarker();
}

// ═══════════════════════════════════════════════════════════════
//  VISUAL ZOOM  (viewerZoom multiplier, persists across images)
// ═══════════════════════════════════════════════════════════════
function changeViewZoom(dir) {
  // Find the closest step index, then step in the requested direction.
  let idx = 0, best = Infinity;
  VZOOM_STEPS.forEach((v, i) => { const d = Math.abs(v - viewerZoom); if (d < best) { best = d; idx = i; } });
  idx = Math.max(0, Math.min(VZOOM_STEPS.length - 1, idx + dir));
  const target = VZOOM_STEPS[idx];
  if (target === viewerZoom) return;
  beginZoomRescaleHold(viewerZoom);
  viewerZoom = target;
  relockGroundScaleAfterUserZoom();
  resetOrthoGlobeLayoutCache();
  virtualGlobeImg = null;
  globePoseLastTs = 0;
  applyZoomRescaleHold();

  const lbl = viewerZoom >= 1
    ? (Number.isInteger(viewerZoom) ? viewerZoom + '×' : viewerZoom.toFixed(2).replace(/\.?0+$/,'') + '×')
    : viewerZoom.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + '×';
  document.getElementById('vzoomLabel').textContent = lbl;
  const orbitVz = document.getElementById('orbitVzoomLabel');
  if (orbitVz) orbitVz.textContent = lbl;

  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
  else clearZoomRescaleHold();
}

let markerVisible  = true;
let zoomToMarker   = true;

function toggleMarker() {
  markerVisible = !markerVisible;
  const btn = document.getElementById('markerToggleBtn');
  btn.textContent  = markerVisible ? '● Marker' : '○ Marker';
  btn.style.opacity = markerVisible ? '' : '.5';
  refreshDot();   // redraw (will show/hide SVG and respect zoomToMarker)
}

function toggleZoomToMarker() {
  zoomToMarker = !zoomToMarker;
  const btn = document.getElementById('zoomMarkerBtn');
  btn.textContent  = zoomToMarker ? '⊕ Zoom to' : '⊖ Zoom to';
  btn.style.opacity = zoomToMarker ? '' : '.5';
  if (zoomToMarker) scrollToMarker();  // snap immediately if just enabled
}

function togglePinCenter() {
  pinMarkerCenter = !pinMarkerCenter;
  const btn = document.getElementById('pinCenterBtn');
  btn.style.opacity = pinMarkerCenter ? '' : '.5';
  const area = document.getElementById('viewerArea');
  if (area) area.style.overflow = 'hidden';
  if (!pinMarkerCenter) {
    // Clear the translate so the image returns to normal centred padding.
    const padDiv = document.getElementById('rotPadDiv');
    if (padDiv && !padDiv._overlayImage) padDiv.style.transform = '';
  }
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
}

// ═══════════════════════════════════════════════════════════════
//  TILE MEMORY CACHE
//  Keeps decoded tile bitmaps alive by holding HTMLImageElement
//  references in a hidden container.  LRU evicts oldest entries
//  when the limit is reached.  Each entry = one (image × zoom).
// ═══════════════════════════════════════════════════════════════
let tileCacheEnabled = false;
let tileCacheMax     = 5;
const tileCacheMap   = new Map();   // "${name}/${zoom}" → { els: HTMLImageElement[], seq: number }
let   tileCacheSeq   = 0;

function tileCacheEvict() {
  while (tileCacheMap.size >= tileCacheMax) {
    let lruKey = null, lruSeq = Infinity;
    for (const [k, v] of tileCacheMap) {
      if (v.seq < lruSeq) { lruSeq = v.seq; lruKey = k; }
    }
    if (!lruKey) break;
    tileCacheMap.get(lruKey).els.forEach(el => el.remove());
    tileCacheMap.delete(lruKey);
  }
}

function preloadToCache(img, zoom) {
  if (!tileCacheEnabled) return;
  const key = `${img.setId}/${img.name}/${zoom}`;
  if (tileCacheMap.has(key)) {
    tileCacheMap.get(key).seq = ++tileCacheSeq;   // bump LRU timestamp
    updateCacheInfo();
    return;
  }
  tileCacheEvict();
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const container = document.getElementById('tileCache');
  const els = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      const el = new Image();
      el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
      container.appendChild(el);
      els.push(el);
    }
  }
  tileCacheMap.set(key, { els, seq: ++tileCacheSeq });
  updateCacheInfo();
}

/**
 * Same as preloadToCache, but waits for each tile to load (or fail) and calls onTile once per tile.
 */
async function preloadToCacheWithTileProgress(img, zoom, onTile) {
  if (!tileCacheEnabled) return;
  const key = `${img.setId}/${img.name}/${zoom}`;
  if (tileCacheMap.has(key)) {
    tileCacheMap.get(key).seq = ++tileCacheSeq;
    updateCacheInfo();
    return;
  }
  tileCacheEvict();
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  const container = document.getElementById('tileCache');
  const els = [];
  const promises = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      promises.push(
        new Promise(resolve => {
          const el = new Image();
          const done = () => {
            onTile?.();
            resolve();
          };
          el.onload = done;
          el.onerror = done;
          el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
          container.appendChild(el);
          els.push(el);
        })
      );
    }
  }
  tileCacheMap.set(key, { els, seq: ++tileCacheSeq });
  updateCacheInfo();
  await Promise.all(promises);
}

/** Approx. decoded memory per image at tile zoom z (viewer z pills). Values beyond z4 use z4. */
const CACHE_MB_PER_IMAGE_AT_Z = [0.3, 1, 3, 11, 42];

function mbPerCachedImageAtZoom(z) {
  const zi = Math.min(Math.max(0, z), CACHE_MB_PER_IMAGE_AT_Z.length - 1);
  return CACHE_MB_PER_IMAGE_AT_Z[zi];
}

function effectiveCacheEstimateZoom() {
  if (!currentImage) return 4;
  return getTileZoomIndex(currentImage);
}

function formatApproximateMemory(totalMb) {
  if (totalMb >= 1024) {
    const gb = totalMb / 1024;
    return `~${gb >= 10 ? gb.toFixed(1) : gb.toFixed(2)} GB`;
  }
  if (totalMb >= 100) return `~${Math.round(totalMb)} MB`;
  if (totalMb >= 10) return `~${totalMb.toFixed(1)} MB`;
  return `~${totalMb.toFixed(2)} MB`;
}

/** Refresh cache limit dropdown labels from current tile zoom (z pill). */
function updateCacheSizeDropdownLabels() {
  const sel = document.getElementById('cacheSizeSel');
  if (!sel) return;
  const z = effectiveCacheEstimateZoom();
  const mbEach = mbPerCachedImageAtZoom(z);
  for (let i = 0; i < sel.options.length; i++) {
    const opt = sel.options[i];
    const n = Number(opt.value);
    if (!isFinite(n)) continue;
    opt.textContent = `${n} images (${formatApproximateMemory(mbEach * n)})`;
  }
  const zNote = currentImage
    ? (tileZoomAuto
      ? `auto (currently z${z} ≈ ${mbEach} MB per image)`
      : `current tile zoom z${z} (≈ ${mbEach} MB per image)`)
    : 'z4 (≈ 42 MB per image) until an image is open';
  sel.title = `Max number of (image × zoom) pairs kept in memory. Totals use ${zNote}; change the quality pill to update.`;

  const lab = document.getElementById('cacheEnabledLabel');
  if (lab) {
    lab.title = 'Hold decoded tile bitmaps in memory so previously viewed images re-display instantly. '
      + 'Approx. size per image: z0≈0.3 MB, z1≈1 MB, z2≈3 MB, z3≈11 MB, z4≈42 MB. '
      + 'The limit dropdown updates when you change quality (auto or z0–zn).';
  }

  const pb = document.getElementById('preloadListBtn');
  if (pb) {
    if (currentImage) {
      const zz = getTileZoomIndex(currentImage);
      const zzLabel = tileZoomAuto ? `auto (z${zz})` : `z${zz}`;
      pb.title = `Decode tiles for every image in the current list into memory, up to the max above. Order keeps best-ranked matches (LRU). Uses current quality (${zzLabel}).`;
    } else {
      pb.title = 'Decode tiles for every image in the current list into memory, up to the max above. Order keeps best-ranked matches (LRU). When no image is open, zoom follows the first list row per image.';
    }
  }
}

function updateCacheInfo() {
  const el = document.getElementById('cacheInfo');
  if (!el) return;
  el.textContent = tileCacheMap.size
    ? `${tileCacheMap.size} / ${tileCacheMax} in memory`
    : '';
}

function onCacheToggle() {
  tileCacheEnabled = document.getElementById('cacheEnabledCb').checked;
  document.getElementById('cacheSizeSel').disabled = !tileCacheEnabled;
  updateCacheSizeDropdownLabels();
  if (!tileCacheEnabled) {
    // Release all cached elements.
    tileCacheMap.forEach(v => v.els.forEach(el => el.remove()));
    tileCacheMap.clear();
    updateCacheInfo();
  } else if (currentImage) {
    preloadToCache(currentImage, getTileZoomIndex(currentImage));
  }
  updatePreloadControls();
}

function onCacheSizeChange() {
  tileCacheMax = Number(document.getElementById('cacheSizeSel').value);
  tileCacheEvict();
  updateCacheInfo();
}

/**
 * Marker position (px) in rotPadDiv / scroll space, including clip rotation — same math as scroll/pinch.
 */
function markerVisualInPadPx() {
  if (markerDX < 0 || markerDY < 0) return null;
  let vx = markerDX, vy = markerDY;
  if (currentRotDeg !== 0 && currentContentW > 0) {
    const cx = currentContentW / 2, cy = currentContentH / 2;
    const θ  = currentRotDeg * Math.PI / 180;
    const dx = markerDX - cx, dy = markerDY - cy;
    vx = cx + dx * Math.cos(θ) - dy * Math.sin(θ);
    vy = cy + dx * Math.sin(θ) + dy * Math.cos(θ);
  }
  return { vx, vy };
}

/** ⊙ Pin centre: translate that keeps the marker in the viewport middle (for pinch we must keep this with scale). */
function getPinCenterTranslateParts() {
  if (!pinMarkerCenter || !zoomToMarker) return null;
  const o = markerScrollContentPx();
  if (!o) return null;
  const area = document.getElementById('viewerArea');
  if (!area) return null;
  return {
    vx: o.vx,
    vy: o.vy,
    tx: area.clientWidth / 2 - o.vx,
    ty: area.clientHeight / 2 - o.vy,
  };
}

/**
 * ⧉ Overlay uses translate(tx,ty) on each layer (syncOverlayLayersToMarker). Pinch preview must
 * combine that translate with scale — scale-only would drop the translate and jump the image.
 */
function getMarkerCentreTranslateParts() {
  if (!zoomToMarker) return null;
  const o = markerScrollContentPx();
  if (!o) return null;
  const area = document.getElementById('viewerArea');
  if (!area) return null;
  return {
    vx: o.vx,
    vy: o.vy,
    tx: area.clientWidth / 2 - o.vx,
    ty: area.clientHeight / 2 - o.vy,
  };
}

function getPinchPanParts() {
  // Absolute-centred map (overlay and single-mode): pinch around marker translate.
  if (zoomToMarker) return getMarkerCentreTranslateParts();
  return getPinCenterTranslateParts();
}

/**
 * Pinch scale origin in #rotPadDiv border-box coords (legacy scroll single-mode fallback).
 * markerVisualInPadPx is rotClip-local; must add view padding + ortho union offset.
 */
function getSingleModePinchOrigin() {
  const sc = markerScrollContentPx();
  if (sc) {
    return { ox: viewPadX + sc.vx, oy: viewPadY + sc.vy };
  }
  return {
    ox: viewerAreaEl.scrollLeft + viewerAreaEl.clientWidth / 2,
    oy: viewerAreaEl.scrollTop + viewerAreaEl.clientHeight / 2,
  };
}

/**
 * Local ground metres per native image pixel at (lat,lon), from the inverse projection Jacobian.
 */
function localMetresPerImagePx(img, lat, lon, Z) {
  const inv = computeInvJacobian(img, lat, lon, Z);
  if (!inv) return null;
  const sx = Math.hypot(inv.dXdPx, inv.dYdPx);
  const sy = Math.hypot(inv.dXdPy, inv.dYdPy);
  if (!Number.isFinite(sx) || !Number.isFinite(sy)) return null;
  return (sx + sy) / 2;
}

function mat2Inv(M) {
  const [a, b, c, d] = M;
  const det = a * d - b * c;
  if (!Number.isFinite(det) || Math.abs(det) < 1e-18) return null;
  return [d / det, -b / det, -c / det, a / det];
}

function mat2Mul(A, B) {
  return [
    A[0] * B[0] + A[1] * B[2],
    A[0] * B[1] + A[1] * B[3],
    A[2] * B[0] + A[3] * B[2],
    A[2] * B[1] + A[3] * B[3],
  ];
}

function mat2AvgScale(M) {
  return (Math.hypot(M[0], M[2]) + Math.hypot(M[1], M[3])) / 2;
}

function mat2ClampScale(M, lo, hi) {
  const s = mat2AvgScale(M);
  if (!(s > 1e-12)) return [1, 0, 0, 1];
  if (s > hi) {
    const k = hi / s;
    return M.map(v => v * k);
  }
  if (s < lo) {
    const k = lo / s;
    return M.map(v => v * k);
  }
  return M;
}

/**
 * 2×2 Jacobian: ground metres (MGI ΔX east, ΔY north) → screen px (x right, y down)
 * for this camera at the marker, including fit×viewerZoom and CSS image rotation.
 */
function groundToScreenJacobian(img, lat, lon, Z, viewW, viewH, rotDeg) {
  const inv = computeInvJacobian(img, lat, lon, Z);
  if (!inv) return null;
  const Mig = mat2Inv([inv.dXdPx, inv.dXdPy, inv.dYdPx, inv.dYdPy]);
  if (!Mig) return null;
  const baseFit = Math.min(viewW / img.width, viewH / img.height);
  const disp = baseFit * viewerZoom;
  const D = [disp * Mig[0], disp * Mig[1], disp * Mig[2], disp * Mig[3]];
  const th = (rotDeg || 0) * Math.PI / 180;
  const cos = Math.cos(th);
  const sin = Math.sin(th);
  // CSS rotate(θ) with y-down: x' = c x − s y, y' = s x + c y
  const R = [cos, -sin, sin, cos];
  return mat2Mul(R, D);
}

/**
 * Canonical ground→screen Jacobian: look north, depression CANONICAL_VIEW_DEPRESS_DEG.
 * MGI +X east, +Y north; screen +x right, +y down. Farther north → up on screen (−y).
 */
function canonicalNorthObliqueJacobian(pxPerMeter) {
  const s = pxPerMeter;
  const foreshorten = Math.sin((CANONICAL_VIEW_DEPRESS_DEG * Math.PI) / 180);
  return [
    s, 0,
    0, -s * foreshorten,
  ];
}

function mat2Lerp(A, B, t) {
  const u = Math.max(0, Math.min(1, t));
  const s = u * u * (3 - 2 * u);
  return [
    A[0] + (B[0] - A[0]) * s,
    A[1] + (B[1] - A[1]) * s,
    A[2] + (B[2] - A[2]) * s,
    A[3] + (B[3] - A[3]) * s,
  ];
}

function mat2DiffNorm(A, B) {
  return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2], A[3] - B[3]);
}

function computeImageGroundJacobian(img, rotDeg) {
  if (!img) return null;
  const area = document.getElementById('viewerArea');
  if (!area) return null;
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const hVal = document.getElementById('heightNum').value;
  const Z = hVal === '' ? 0 : Number(hVal);
  return groundToScreenJacobian(img, searchLat, searchLon, Z, viewW, viewH, rotDeg || 0);
}

/** End-state display Jacobian: N·45° lock or the current camera’s natural mapping. */
function computeTargetDisplayJacobian() {
  const A_cur = computeImageGroundJacobian(currentImage, currentRotDeg);
  if (!A_cur) return null;
  if (groundScaleLockEnabled) {
    if (!(groundScaleLockPxPerMeter > 0)) {
      groundScaleLockPxPerMeter = mat2AvgScale(A_cur);
    }
    return canonicalNorthObliqueJacobian(groundScaleLockPxPerMeter);
  }
  return A_cur;
}

/** Snapshot what the viewport currently shows, before swapping cameras. */
function captureDisplayJacobianForTransition() {
  if (displayGroundJacobian) {
    pendingDisplayJFrom = displayGroundJacobian.slice();
    return;
  }
  if (!currentImage) {
    pendingDisplayJFrom = null;
    return;
  }
  const A = computeImageGroundJacobian(currentImage, currentRotDeg);
  pendingDisplayJFrom = A ? A.slice() : null;
}

function stopDisplayJacobianTransition() {
  if (displayJacobianTransition && displayJacobianTransition.raf != null) {
    cancelAnimationFrame(displayJacobianTransition.raf);
  }
  displayJacobianTransition = null;
}

/**
 * Arm a from→to ground-Jacobian morph (applied to every layer via syncOverlayLayersToMarker).
 * Call after currentRotDeg is updated for the new image.
 */
function armDisplayJacobianTransition(fromJ) {
  const toJ = computeTargetDisplayJacobian();
  if (!fromJ || !toJ) {
    pendingDisplayJFrom = null;
    return;
  }
  if (mat2DiffNorm(fromJ, toJ) < 1e-3) {
    displayGroundJacobian = toJ.slice();
    pendingDisplayJFrom = null;
    return;
  }
  stopDisplayJacobianTransition();
  displayGroundJacobian = fromJ.slice();
  const state = {
    from: fromJ.slice(),
    to: toJ.slice(),
    t0: performance.now(),
    dur: IMAGE_MORPH_MS,
    raf: null,
  };
  displayJacobianTransition = state;
  pendingDisplayJFrom = null;

  const tick = () => {
    if (displayJacobianTransition !== state) return;
    updateGroundScaleCompensation();
    syncOverlayLayersToMarker();
    const u = (performance.now() - state.t0) / state.dur;
    if (u < 1) {
      state.raf = requestAnimationFrame(tick);
    } else {
      displayJacobianTransition = null;
      displayGroundJacobian = state.to.slice();
      updateGroundScaleCompensation();
      syncOverlayLayersToMarker();
    }
  };
  state.raf = requestAnimationFrame(tick);
}

/** Screen←screen morph that maps a layer’s natural Jacobian onto displayGroundJacobian. */
function morphMatrixForSourceJacobian(A_src) {
  if (!displayGroundJacobian || !A_src) return [1, 0, 0, 1];
  const inv = mat2Inv(A_src);
  if (!inv) return [1, 0, 0, 1];
  return mat2ClampScale(mat2Mul(displayGroundJacobian, inv), 0.12, 10);
}

function wrapTransformWithMorphMatrix(innerTransform, viewW, viewH, M) {
  const [a, b, c, d] = M || [1, 0, 0, 1];
  const almostId =
    Math.abs(a - 1) < 1e-5 && Math.abs(b) < 1e-5 &&
    Math.abs(c) < 1e-5 && Math.abs(d - 1) < 1e-5;
  if (almostId) return innerTransform || '';
  // Our row-major [a b; c d]: x'=a x + b y, y'=c x + d y
  // CSS matrix(a, b, c, d, e, f): x'=a x + c y, y'=b x + d y  → pass matrix(a, c, b, d, …)
  const pre =
    `translate(${viewW / 2}px, ${viewH / 2}px) matrix(${a}, ${c}, ${b}, ${d}, 0, 0) ` +
    `translate(${-viewW / 2}px, ${-viewH / 2}px)`;
  return innerTransform ? `${pre} ${innerTransform}` : pre;
}

/** After intentional user zoom, recapture scale so the warp doesn’t cancel the zoom. */
function relockGroundScaleAfterUserZoom() {
  stopDisplayJacobianTransition();
  if (groundScaleLockEnabled) groundScaleLockPxPerMeter = null;
  displayGroundJacobian = null;
  morphMatrix = [1, 0, 0, 1];
}

/**
 * Refresh displayGroundJacobian / morphMatrix for the main image.
 * During a switch, displayJ lerps from the previous camera toward the new target.
 * Globe mode owns perspective continuity — skip affine morph there.
 */
function updateGroundScaleCompensation() {
  morphMatrix = [1, 0, 0, 1];
  if (globeModeEnabled) {
    displayGroundJacobian = null;
    return;
  }
  const A_cur = computeImageGroundJacobian(currentImage, currentRotDeg);
  if (!A_cur) {
    displayGroundJacobian = null;
    return;
  }

  const A_tgt = computeTargetDisplayJacobian() || A_cur;

  if (displayJacobianTransition) {
    const u = (performance.now() - displayJacobianTransition.t0) / displayJacobianTransition.dur;
    if (u >= 1) {
      displayGroundJacobian = displayJacobianTransition.to.slice();
      displayJacobianTransition = null;
    } else {
      displayGroundJacobian = mat2Lerp(displayJacobianTransition.from, displayJacobianTransition.to, u);
    }
  } else {
    displayGroundJacobian = A_tgt.slice();
  }

  morphMatrix = morphMatrixForSourceJacobian(A_cur);
}

/** Prepend viewport-centred morph for the main-image Jacobian. */
function wrapTransformWithGroundScale(innerTransform, viewW, viewH) {
  return wrapTransformWithMorphMatrix(innerTransform, viewW, viewH, morphMatrix);
}

function toggleGroundScaleLock() {
  groundScaleLockEnabled = !groundScaleLockEnabled;
  groundScaleLockPxPerMeter = null;
  stopDisplayJacobianTransition();
  displayGroundJacobian = null;
  morphMatrix = [1, 0, 0, 1];
  const btn = document.getElementById('groundScaleLockBtn');
  if (btn) {
    btn.style.opacity = groundScaleLockEnabled ? '' : '.5';
    btn.setAttribute('aria-pressed', groundScaleLockEnabled ? 'true' : 'false');
  }
  if (currentImage) {
    updateGroundScaleCompensation();
    scrollToMarker();
  }
}

/**
 * Centre each absolute layer so the ground marker sits in the viewport middle.
 *
 * Globe mode: every layer (main, history, neighbors) is plane-homography-warped into a
 * continuous virtual camera blended from nearby images — photo swaps no longer change FOV.
 * Classic mode: optional reproject-to-main + Jacobian morph.
 */
function syncOverlayLayersToMarker() {
  if (!zoomToMarker) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const layers = Array.from(area.children);
  const hVal = document.getElementById('heightNum').value;
  const Z = hVal === '' ? 0 : Number(hVal);

  const incoming = currentImage;
  if (!incoming) return;
  // Outgoing stack stays on the previous main’s camera until the crossfade finishes.
  const outgoing = transitionOutgoingMain || incoming;

  const virtOut = globeModeEnabled ? computeVirtualGlobeCamera(outgoing) : null;
  const virtIn = (globeModeEnabled && transitionOutgoingMain)
    ? computeVirtualGlobeCamera(incoming)
    : virtOut;
  virtualGlobeImg = virtOut;

  const reprojectToMain = overlayEnabled && document.getElementById('overlayStretchToMainCb')?.checked;

  // Find topmost history layer (main) — children may include ortho + neighbors.
  let topHist = null;
  for (let i = layers.length - 1; i >= 0; i--) {
    if (layers[i]._overlayHistory) { topHist = layers[i]; break; }
  }

  const A_out = (!globeModeEnabled)
    ? computeImageGroundJacobian(outgoing, currentRotDeg)
    : null;
  const A_in = (!globeModeEnabled && transitionOutgoingMain)
    ? computeImageGroundJacobian(incoming, currentRotDeg)
    : A_out;

  layers.forEach((layer) => {
    const img = layer._overlayImage;
    if (!img?.pToImage) return;
    // During zoom wait: keep previous baked layers on a compensating scale hold —
    // syncing them with the new viewerZoom made the old tiles look wrong-scale.
    if (zoomRescaleHold && !layer._overlayPendingReveal && !layer._neighborPendingReveal) {
      return;
    }
    const isTop = layer === topHist;
    const pending = !!(layer._overlayPendingReveal || layer._neighborPendingReveal);
    const anchor = pending ? incoming : outgoing;
    const displayCam = globeModeEnabled
      ? ((pending ? virtIn : virtOut) || anchor)
      : anchor;
    if (!displayCam?.pToImage) return;

    const scale = Math.min(viewW / img.width, viewH / img.height) * viewerZoom;
    const A_stack = pending ? A_in : A_out;

    // Neighbors + history behind main: analytical plane H into that layer’s display camera.
    const wantReproject = !isTop && reprojectToMain && img.name !== (globeModeEnabled ? anchor.name : incoming.name);
    const wantGlobe = globeModeEnabled;

    if (wantGlobe || wantReproject) {
      // Classic reproject: always warp into the live main; Jacobian morph (below) carries
      // the stack through the camera switch — same as main/ortho. Freezing on outgoing
      // then clearing transitionOutgoingMain was the globe-off snap regression.
      const reprojectCam = globeModeEnabled ? displayCam : incoming;
      if (!reprojectCam?.pToImage) return;
      const baseFitDisp = Math.min(viewW / reprojectCam.width, viewH / reprojectCam.height);
      const vScale = baseFitDisp * viewerZoom;
      const Hvp = homographyLayerPadToGlobeViewport(img, reprojectCam, Z, scale, vScale, viewW, viewH);
      layer.style.transformOrigin = '0 0';
      let inner = null;
      if (Hvp) {
        layer._lastGlobeH = Hvp;
        inner = homography3x3ToMatrix3dString(Hvp);
      } else if (layer._lastGlobeH) {
        // Keep last good warp — translate fallback made reprojected layers pop.
        inner = homography3x3ToMatrix3dString(layer._lastGlobeH);
      } else {
        const proj = projectToPixel(img, searchLat, searchLon, Z);
        if (!proj) return;
        inner = `translate(${viewW / 2 - proj[0] * scale}px, ${viewH / 2 - proj[1] * scale}px)`;
      }
      // Classic reproject must share the main/ortho Jacobian morph; raw H alone snaps
      // when the display camera identity changes (regression vs pre-crossfade-lock).
      if (!globeModeEnabled && A_in) {
        const M = morphMatrixForSourceJacobian(A_in);
        layer.style.transform = wrapTransformWithMorphMatrix(inner, viewW, viewH, M);
      } else {
        layer.style.transform = inner;
      }
      return;
    }

    // Top / non-reproject classic: pan (+ optional N·45° morph).
    const rotDeg = (img.name === anchor.name) ? currentRotDeg : (layer._overlayRotDeg || 0);
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (!proj) return;
    let vx = proj[0] * scale;
    let vy = proj[1] * scale;
    const cw = img.width * scale;
    const ch = img.height * scale;
    if (rotDeg !== 0 && cw > 0 && ch > 0) {
      const cx = cw / 2, cy = ch / 2;
      const θ = rotDeg * Math.PI / 180;
      const dx0 = vx - cx, dy0 = vy - cy;
      vx = cx + dx0 * Math.cos(θ) - dy0 * Math.sin(θ);
      vy = cy + dx0 * Math.sin(θ) + dy0 * Math.cos(θ);
    }
    const pan = `translate(${viewW / 2 - vx}px, ${viewH / 2 - vy}px)`;
    layer.style.transformOrigin = '0 0';
    if (!globeModeEnabled && A_stack) {
      const A_layer = (img.name === anchor.name) ? A_stack : computeImageGroundJacobian(img, rotDeg);
      const M = morphMatrixForSourceJacobian(A_layer || A_stack);
      layer.style.transform = wrapTransformWithMorphMatrix(pan, viewW, viewH, M);
    } else {
      layer.style.transform = pan;
    }
  });

  if (zoomRescaleHold) {
    applyZoomRescaleHold();
  } else {
    syncOrthoUnderlayTransform();
  }
