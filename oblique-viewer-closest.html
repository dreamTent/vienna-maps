<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vienna Oblique – 4 Directions</title>
  <link rel="icon" href="logos/favicon.ico" type="image/x-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --accent: #388bfd; --accent2: #58a6ff;
      --text: #c9d1d9; --text-dim: #8b949e;
      --success: #3fb950; --warning: #d29922; --error: #f85149;
      --n: #4fc3f7; --e: #81c784; --s: #ff8a65; --w: #ce93d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }

    /* ── top bar ── */
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 6px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
    }
    .topbar h1 { font-size: .88rem; font-weight: 600; flex-shrink: 0; }
    .dev-credit {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .72rem; color: var(--text-dim); white-space: nowrap;
    }
    .dev-credit a {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent2); text-decoration: none; font-weight: 500;
    }
    .dev-credit a:hover { text-decoration: underline; }
    .dev-credit img {
      width: 16px; height: 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65), 0 0 2px rgba(0, 0, 0, 0.4);
    }
    .badge { display: flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--text-dim);
             background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px; }
    .spinner { width: 9px; height: 9px; border: 2px solid var(--border); border-top-color: var(--accent2);
               border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot.ok { background: var(--success); }

    /* ── controls row ── */
    .controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0;
    }
    .coord-input { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
                   color: var(--text); padding: 4px 8px; font-size: .8rem; font-family: monospace;
                   outline: none; width: 230px; }
    .coord-input:focus { border-color: var(--accent); }
    select.coord-input { cursor: pointer; appearance: auto; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 4px 12px;
           font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn:hover:not(:disabled) { opacity: .85; }
    .btn-sm { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
              border-radius: 5px; padding: 3px 9px; font-size: .76rem; cursor: pointer; white-space: nowrap; }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent2); }
    .btn-sm.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .lbl { font-size: .72rem; color: var(--text-dim); white-space: nowrap; }
    .vzoom-label { font-size: .76rem; color: var(--text-dim); min-width: 34px; text-align: center; font-family: monospace; }
    input[type=range] { width: 70px; accent-color: var(--accent); }
    input[type=number] { width: 52px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
                         color: var(--text); padding: 2px 5px; font-size: .76rem; outline: none; }
    input[type=number]:focus { border-color: var(--accent); }

    /* ── progress ── */
    .progress-wrap { height: 3px; background: var(--border); flex-shrink: 0; }
    .progress-fill { height: 100%; background: var(--accent); transition: width .15s; }

    /* ── 2×2 grid ── */
    .grid {
      flex: 1; display: grid; min-height: 0;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px; padding: 6px; background: var(--bg);
    }

    /* ── direction card ── */
    .dir-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden; min-height: 0;
    }
    .card-hdr {
      padding: 5px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
    }
    .dir-badge { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
                 justify-content: center; font-size: .8rem; font-weight: 700; flex-shrink: 0; }
    .card-n .dir-badge { background: #0c2d40; color: var(--n); }
    .card-e .dir-badge { background: #0c2a0e; color: var(--e); }
    .card-s .dir-badge { background: #2a1508; color: var(--s); }
    .card-w .dir-badge { background: #210f33; color: var(--w); }
    .card-x .dir-badge { background: #1a1a1a; color: #aaa; }
    .card-name { font-family: monospace; font-size: .74rem; color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card-dist { font-size: .72rem; color: var(--text-dim); white-space: nowrap; }
    .zoom-pills { display: flex; gap: 3px; }
    .zoom-pill { padding: 1px 7px; border-radius: 10px; font-size: .7rem; background: var(--surface2);
                 border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }
    .zoom-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* In auto mode: which pyramid level is actually loaded */
    .zoom-pill.auto-loaded { border: 2px solid var(--accent2); color: var(--accent2); background: var(--surface2);
                             box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.25); }
    .zoom-pill:hover:not(.active):not(.auto-loaded) { border-color: var(--accent); color: var(--text); }
    .zoom-pill.auto-loaded:hover { border-color: var(--accent2); color: #79c0ff; }

    .card-lock-btn { background: none; border: 1px solid transparent; border-radius: 4px;
                     padding: 1px 5px; font-size: .78rem; cursor: pointer; margin-left: auto;
                     color: var(--text-dim); line-height: 1.4; }
    .card-lock-btn:hover { border-color: var(--border); color: var(--text); }
    .card-lock-btn.active { border-color: var(--accent); color: var(--accent2); background: var(--surface2); }

    /* ── tile viewer inside card ── */
    .card-viewer { flex: 1; overflow: auto; background: #080a0e; min-height: 0;
                   scrollbar-width: none; cursor: grab; }
    .card-viewer::-webkit-scrollbar { display: none; }
    .tile-row { display: flex; }
    .tile-row img { display: block; flex-shrink: 0; background: #111; }

    /* ── empty state ── */
    .empty-card { display: flex; align-items: center; justify-content: center; height: 100%;
                  color: var(--text-dim); font-size: .82rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Vienna Oblique – 4 Directions</h1>

  <span class="dev-credit">
    Developed by
    <a href="https://dreamtent.dev" target="_blank" rel="noopener noreferrer">
      <img src="logos/163280227_64px.png" alt="" width="16" height="16">
      dreamtent.dev
    </a>
  </span>

  <div class="badge" id="badge">
    <div class="spinner" id="spinner"></div>
    <span id="badgeText">Loading…</span>
  </div>

  <div class="controls">
    <label class="lbl" for="imageSetSel">Set</label>
    <select id="imageSetSel" class="coord-input" style="width:auto;min-width:132px"
            title="Local tile index and remote image tiles for this capture year"
            onchange="onImageSetChange()">
      <option value="2023">Wien 2023</option>
      <option value="2020">Wien 2020</option>
    </select>

    <div class="sep"></div>

    <input class="coord-input" id="coordsInput" type="text"
           value="48.2108258, 16.3586364" placeholder="lat, lon">
    <button class="btn" id="searchBtn" onclick="doSearch()" disabled>Find</button>

    <div class="sep"></div>

    <!-- Z height for projection -->
    <span class="lbl">Z:</span>
    <input type="range" id="heightSlider" min="-100" max="400" step="1" value="0"
           oninput="document.getElementById('heightNum').value=this.value; refreshAllDots()">
    <input type="number" id="heightNum" value="0" min="-100" max="400"
           oninput="document.getElementById('heightSlider').value=this.value; refreshAllDots()">
    <span class="lbl">m</span>

    <div class="sep"></div>

    <!-- Marker & zoom-to toggles -->
    <button class="btn-sm active" id="markerBtn"  onclick="toggleMarker()">● Marker</button>
    <button class="btn-sm active" id="zoomToBtn"  onclick="toggleZoomTo()">⊕ Zoom to</button>

    <div class="sep"></div>

    <!-- Visual zoom (shared across all 4 cards) -->
    <button class="btn-sm" onclick="changeVZoom(-1)">−</button>
    <span class="vzoom-label" id="vzoomLabel">1×</span>
    <button class="btn-sm" onclick="changeVZoom(+1)">+</button>

    <div class="sep"></div>

    <span class="lbl" style="white-space:nowrap"
          title="Arrow keys move the marker (Shift = ×10). Best matching image auto-loads per direction.">⌨ ↑↓←→ 5 m</span>

    <div class="sep"></div>

    <!-- Tile quality (shared across all 4 cards) -->
    <span class="lbl">Quality:</span>
    <div class="zoom-pills" id="shared-pills">
      <span class="zoom-pill active" data-z="auto"
            title="Fit pyramid level to each card viewport, visual zoom (×), image size, and display density">auto</span>
      <span class="zoom-pill" data-z="0">z0</span>
      <span class="zoom-pill" data-z="1">z1</span>
      <span class="zoom-pill" data-z="2">z2</span>
      <span class="zoom-pill" data-z="3">z3</span>
      <span class="zoom-pill" data-z="4">z4</span>
    </div>
  </div>
</div>

<div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="grid" id="grid">
  <div class="dir-card card-n" id="card-1"><div class="empty-card">North</div></div>
  <div class="dir-card card-e" id="card-2"><div class="empty-card">East</div></div>
  <div class="dir-card card-s" id="card-3"><div class="empty-card">South</div></div>
  <div class="dir-card card-w" id="card-4"><div class="empty-card">West</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG  (aligned with oblique-viewer.html)
// ═══════════════════════════════════════════════════════
/** Fallback CRS if manifest is missing generalImageInfo.crs (matches 2023 dataset). */
const MGI_PROJ_FALLBACK = '+proj=tmerc +lat_0=0 +lon_0=16.3333333333333 +k=1 +x_0=0 +y_0=-5000000 +ellps=bessel +towgs84=577.326,90.129,463.919,5.137,1.474,5.297,2.4232 +units=m +no_defs';
const MGI_TOWGS84 = '+towgs84=577.326,90.129,463.919,5.137,1.474,5.297,2.4232';

/**
 * Each set: remote pyramid base URL, local `image.json` path, local folder of per-tile JSON indexes.
 */
const IMAGE_SETS = [
  {
    id: '2023',
    label: 'Wien 2023',
    remoteBaseUrl: 'https://cdn.map.dreamtent.dev/data/oblique/vienna/2023/',
    imageJsonPath: 'sources/2023/image.json',
    tilesDir: 'sources/2023/tiles',
  },
  {
    id: '2020',
    label: 'Wien 2020',
    remoteBaseUrl: 'https://cdn.map.dreamtent.dev/data/oblique/vienna/2020',
    imageJsonPath: 'sources/2020/image.json',
    tilesDir: 'sources/2020/tiles',
  },
];

let tileSize = 1024;
let activeRemoteBaseUrl = IMAGE_SETS[0].remoteBaseUrl;
let activeSetId = IMAGE_SETS[0].id;

function normalizeCrs(crs) {
  if (!crs || typeof crs !== 'string') return MGI_PROJ_FALLBACK;
  let s = crs.trim().replace(/\s*\+type=crs\s*/gi, ' ').replace(/\s+/g, ' ').trim();
  if (/ellps=bessel/i.test(s) && !/\+towgs84=/i.test(s)) {
    s = `${s.replace(/\s*\+no_defs\s*$/i, '').trim()} ${MGI_TOWGS84} +no_defs`;
  }
  return s;
}

const DIR_LABEL = { 1:'North', 2:'East', 3:'South', 4:'West', 5:'Nadir' };
const DIR_ARROW = { 1:'↑', 2:'→', 3:'↓', 4:'←', 5:'⊙' };
const DIR_CLASS = { 1:'card-n', 2:'card-e', 3:'card-s', 4:'card-w', 5:'card-x' };

// ═══════════════════════════════════════════════════════
//  PROJECTIONS  (redefined when switching image sets from manifest CRS)
// ═══════════════════════════════════════════════════════
proj4.defs('MGI', MGI_PROJ_FALLBACK);
let wgs84ToMgi = proj4('EPSG:4326', 'MGI');

// ═══════════════════════════════════════════════════════
//  GEOMETRY HELPERS  (identical to oblique-viewer.html)
// ═══════════════════════════════════════════════════════
function orderFootprintCCW(ring) {
  if (!ring || ring.length < 3) return ring;
  const cx = ring.reduce((s,p)=>s+p[0],0)/ring.length;
  const cy = ring.reduce((s,p)=>s+p[1],0)/ring.length;
  const ordered = [...ring].sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let area = 0;
  for (let i=0; i<ordered.length; i++){const j=(i+1)%ordered.length; area+=ordered[i][0]*ordered[j][1]-ordered[j][0]*ordered[i][1];}
  if (area < 0) ordered.reverse();
  return ordered;
}
function pointInPolygon2D(px,py,ring) {
  let inside=false; const n=ring.length;
  for (let i=0,j=n-1; i<n; j=i++) {
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    const denom=yj-yi; if(Math.abs(denom)<1e-15) continue;
    if((yi>py)===(yj>py)) continue;
    const xInt=xi+((py-yi)*(xj-xi))/denom; if(px<xInt) inside=!inside;
  }
  return inside;
}

// ═══════════════════════════════════════════════════════
//  IMAGE INDEX
// ═══════════════════════════════════════════════════════
const allImages = [];

function parseImageTile(data) {
  const rows = data.images;
  if (!rows || rows.length < 2) return;
  const hdr = rows[0];
  const iN   = hdr.indexOf('name');
  const iW   = hdr.indexOf('width');
  const iH   = hdr.indexOf('height');
  const iTR  = hdr.indexOf('tile-resolution');
  const iVD  = hdr.indexOf('view-direction');
  const iVDA = hdr.indexOf('view-direction-angle');
  const iGC  = hdr.indexOf('groundCoordinates');
  const iCtr = hdr.indexOf('centerPointOnGround');
  const iPTI = hdr.indexOf('p-to-image');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const center = r[iCtr];
    if (!center) continue;
    const gc = r[iGC] || null;
    const footprintMgi = gc && gc.length >= 3 ? orderFootprintCCW(gc.map(c=>[c[0],c[1]])) : null;
    const vda = r[iVDA];
    const heading = vda != null
      ? ((90 - vda*180/Math.PI) % 360 + 360) % 360
      : ({1:0,2:90,3:180,4:270}[r[iVD]] ?? 0);
    const groundZ = gc ? gc.reduce((s,c)=>s+(c[2]||0),0)/gc.length : 0;

    // Ground point (Z=0) the image centre pixel looks at — better selection metric.
    const px_c = (r[iW] || 14144) / 2, py_c = (r[iH] || 10560) / 2;
    let lookAtMgi = center.slice(0, 2);
    const Pm = r[iPTI];
    if (Pm) {
      const a1=Pm[0][0]-px_c*Pm[2][0], b1=Pm[0][1]-px_c*Pm[2][1], c1=px_c*Pm[2][3]-Pm[0][3];
      const a2=Pm[1][0]-py_c*Pm[2][0], b2=Pm[1][1]-py_c*Pm[2][1], c2=py_c*Pm[2][3]-Pm[1][3];
      const det = a1*b2 - b1*a2;
      if (Math.abs(det) > 1e-10) lookAtMgi = [(c1*b2-b1*c2)/det, (a1*c2-c1*a2)/det];
    }

    allImages.push({
      name: r[iN],
      width: r[iW] || 14144,
      height: r[iH] || 10560,
      tileResolution: r[iTR] || [16,8,4,2,1],
      viewDirection: r[iVD],
      heading,
      mgiCenter: center.slice(0, 2), // geographic footprint centroid (kept for debug)
      lookAtMgi,                     // ground point at image centre — used for selection
      footprintMgi,
      groundZ,
      pToImage: r[iPTI] || null,
    });
  }
}

// ═══════════════════════════════════════════════════════
//  CAMERA PROJECTION  (py = v/w — no flip, y=0 at top)
// ═══════════════════════════════════════════════════════
function projectToPixel(img, lat, lon, Z) {
  if (!img.pToImage) return null;
  const P = img.pToImage;
  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];
  if (Math.abs(w) < 1e-10) return null;
  return [u/w, v/w];
}

/** Inverse Jacobian of the camera projection at (lat,lon,Z): pixel → MGI metres. */
function computeInvJacobian(img, lat, lon, Z) {
  if (!img || !img.pToImage) return null;
  const P = img.pToImage;
  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];
  if (Math.abs(w) < 1e-10) return null;
  const w2 = w * w;
  const a =  (P[0][0]*w - u*P[2][0]) / w2;
  const b =  (P[0][1]*w - u*P[2][1]) / w2;
  const c =  (P[1][0]*w - v*P[2][0]) / w2;
  const dd = (P[1][1]*w - v*P[2][1]) / w2;
  const det = a*dd - b*c;
  if (Math.abs(det) < 1e-20) return null;
  return { dXdPx: dd/det, dXdPy: -b/det, dYdPx: -c/det, dYdPy: a/det };
}

// ═══════════════════════════════════════════════════════
//  LOAD INDEX
// ═══════════════════════════════════════════════════════
let loadedCount = 0;

function getActiveImageSet() {
  const v = document.getElementById('imageSetSel')?.value;
  return IMAGE_SETS.find(s => s.id === v) || IMAGE_SETS[0];
}

function setBadgeLoading(msg) {
  document.getElementById('badgeText').textContent = msg || 'Loading…';
  document.getElementById('spinner').style.display = '';
  document.querySelectorAll('#badge .dot.ok').forEach(n => n.remove());
}

function setBadgeReady(count) {
  document.getElementById('spinner').style.display = 'none';
  const badge = document.getElementById('badge');
  if (!badge.querySelector('.dot.ok')) {
    badge.insertBefore(Object.assign(document.createElement('div'), { className: 'dot ok' }), badge.firstChild);
  }
  document.getElementById('badgeText').textContent = `${count.toLocaleString()} images`;
}

async function onImageSetChange() {
  setBadgeLoading('Switching set…');
  document.getElementById('progressFill').style.display = '';
  document.getElementById('progressFill').style.width = '0%';
  allImages.length = 0;
  lockedCards.clear();
  for (let d = 1; d <= 4; d++) {
    cardState[d].img = null;
    cardState[d].dx = cardState[d].dy = -1;
  }
  renderAll();
  await loadIndex();
}

async function loadIndex() {
  const setSel = document.getElementById('imageSetSel');
  try {
    if (setSel) setSel.disabled = true;

    const set = getActiveImageSet();
    activeSetId = set.id;
    activeRemoteBaseUrl = set.remoteBaseUrl;

    setBadgeLoading('Loading manifest…');
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('progressFill').style.display = '';
    document.getElementById('progressFill').style.width = '0%';

    let manifest;
    try {
      const manResp = await fetch(set.imageJsonPath);
      if (!manResp.ok) throw new Error(`${set.imageJsonPath}: ${manResp.status}`);
      manifest = await manResp.json();
    } catch (e) {
      console.error(e);
      setBadgeLoading('Manifest failed');
      document.getElementById('badgeText').textContent = `Error: ${set.imageJsonPath}`;
      document.getElementById('searchBtn').disabled = false;
      return;
    }

    const crs = normalizeCrs(manifest.generalImageInfo?.crs);
    proj4.defs('MGI', crs);
    wgs84ToMgi = proj4('EPSG:4326', 'MGI');
    tileSize = Number(manifest.generalImageInfo?.['tile-width']) || Number(manifest.generalImageInfo?.['tile-height']) || 1024;

    const tileFiles = manifest.availableTiles;
    if (!tileFiles || !tileFiles.length) {
      setBadgeLoading('No tiles in manifest');
      document.getElementById('searchBtn').disabled = false;
      return;
    }

    allImages.length = 0;
    loadedCount = 0;
    const total = tileFiles.length;

    await Promise.all(tileFiles.map(async tile => {
      try {
        const resp = await fetch(`${set.tilesDir}/${tile.replace(/\//g, '_')}.json`);
        if (resp.ok) parseImageTile(await resp.json());
      } catch (e) { console.warn('Skipped', tile, e.message); }
      finally {
        loadedCount++;
        document.getElementById('progressFill').style.width = (loadedCount / total * 100) + '%';
      }
    }));

    setBadgeReady(allImages.length);
    document.getElementById('progressFill').style.display = 'none';
    document.getElementById('searchBtn').disabled = false;
    doSearch();
  } finally {
    if (setSel) setSel.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════
//  SEARCH  — nearest image per direction by MGI distance
// ═══════════════════════════════════════════════════════
let searchLat = 0, searchLon = 0;
// Per-direction state: display scale, pad, marker pos
const cardState = {1:{scale:1,padX:0,padY:0,dx:-1,dy:-1,img:null},
                   2:{scale:1,padX:0,padY:0,dx:-1,dy:-1,img:null},
                   3:{scale:1,padX:0,padY:0,dx:-1,dy:-1,img:null},
                   4:{scale:1,padX:0,padY:0,dx:-1,dy:-1,img:null}};
const lockedCards = new Set(); // directions (1–4) whose image should not auto-switch

function doSearch() {
  const raw = document.getElementById('coordsInput').value.trim();
  const parts = raw.split(/[\s,]+/).map(Number);
  if (parts.length < 2 || parts.some(isNaN)) { alert('Enter: lat, lon'); return; }
  [searchLat, searchLon] = parts;
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);

  // Nearest image per direction (1–4) by distance to centerPointOnGround in MGI
  const best = {};
  for (const img of allImages) {
    const [cx,cy] = img.lookAtMgi;
    const dist = Math.hypot(qx-cx, qy-cy);
    const d = img.viewDirection;
    if (d < 1 || d > 4) continue;
    if (!best[d] || dist < best[d].distM) best[d] = {...img, distM: Math.round(dist)};
  }

  // Clamp manual zoom to minimum maxZ across found images
  const minMaxZ = Math.min(...[1,2,3,4].filter(d=>best[d]).map(d=>best[d].tileResolution.length-1));
  if (isFinite(minMaxZ) && !tileZoomAuto) currentZoom = Math.min(currentZoom, minMaxZ);

  for (let d = 1; d <= 4; d++) {
    cardState[d].img = best[d] || null;
    cardState[d].dx = cardState[d].dy = -1;
  }

  renderAll();
}

document.getElementById('coordsInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

// ═══════════════════════════════════════════════════════
//  TILE DIMENSIONS
// ═══════════════════════════════════════════════════════
function tileDims(width, height, zoom, tileResolution) {
  const res = tileResolution[zoom];
  return { cols: Math.ceil(width/(tileSize*res)), rows: Math.ceil(height/(tileSize*res)) };
}

// ═══════════════════════════════════════════════════════
//  RENDER ALL CARDS
// ═══════════════════════════════════════════════════════
function renderAll() {
  for (let d = 1; d <= 4; d++) renderCard(d);
  for (let d = 1; d <= 4; d++) renderTiles(d);
  updateZoomPillClasses();
}

function renderCard(d) {
  const st  = cardState[d];
  const img = st.img;
  const card = document.getElementById(`card-${d}`);

  // Card skeleton (header + viewer + footer)
  const label = DIR_LABEL[d] || `Dir${d}`;
  const arrow = DIR_ARROW[d] || '?';
  const cls   = DIR_CLASS[d] || 'card-x';

  if (!img) {
    card.className = `dir-card ${cls}`;
    card.innerHTML = `
      <div class="card-hdr">
        <div class="dir-badge">${arrow}</div>
        <span style="font-size:.8rem;color:var(--text-dim)">${label} — no image found</span>
      </div>
      <div class="card-viewer"><div class="empty-card">No image</div></div>`;
    return;
  }

  const distStr = img.distM >= 1000 ? (img.distM/1000).toFixed(2)+' km' : img.distM+' m';

  const isLocked = lockedCards.has(d);
  card.className = `dir-card ${cls}`;
  card.innerHTML = `
    <div class="card-hdr">
      <div class="dir-badge">${arrow}</div>
      <span style="font-weight:600;font-size:.82rem">${label}</span>
      <span class="card-name">${img.name}</span>
      <span class="card-dist">${distStr}</span>
      <button class="card-lock-btn${isLocked?' active':''}"
              onclick="toggleCardLock(${d})"
              title="${isLocked?'Locked – click to allow auto-switch':'Click to lock this view'}"
      >${isLocked?'🔒':'🔓'}</button>
    </div>
    <div class="card-viewer" id="viewer-${d}"></div>`;
}

// ═══════════════════════════════════════════════════════
//  TILE RENDERER  (identical logic to oblique-viewer.html)
// ═══════════════════════════════════════════════════════
function renderTiles(d) {
  const st   = cardState[d];
  const img  = st.img;
  const area = document.getElementById(`viewer-${d}`);
  if (!area || !img) return;

  const zoom = Math.min(getSharedTileZoomIndex(), img.tileResolution.length - 1);
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];

  const viewW = area.clientWidth  || 400;
  const viewH = area.clientHeight || 300;
  const baseScale = Math.min(viewW/img.width, viewH/img.height);
  const scale     = baseScale * viewerZoom;
  const dispTileW = Math.max(1, Math.round(tileSize * res * scale));

  const topBlack = Math.round((rows * tileSize * res - img.height) * scale);
  const contentW = Math.round(img.width  * scale);
  const contentH = Math.round(img.height * scale);

  st.scale = scale;
  st.padX  = Math.max(0, Math.floor((viewW - contentW) / 2));
  st.padY  = Math.max(0, Math.floor((viewH - contentH) / 2));

  let tilesHtml = '';
  for (let y = rows-1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${activeRemoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="lazy" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }

  area.innerHTML = `
    <div style="padding:${st.padY}px ${st.padX}px;min-width:max-content;background:#080a0e;">
      <div style="position:relative;width:${contentW}px;height:${contentH}px;overflow:hidden;">
        <div style="position:absolute;top:-${topBlack}px;left:0;">
          <div style="display:inline-block;line-height:0;">${tilesHtml}</div>
        </div>
        <svg id="dot-${d}" style="position:absolute;top:0;left:0;width:${contentW}px;height:${contentH}px;overflow:visible;pointer-events:none;"></svg>
      </div>
    </div>`;

  refreshDot(d);
}

// ═══════════════════════════════════════════════════════
//  DOT OVERLAY
// ═══════════════════════════════════════════════════════
function refreshDot(d) {
  const st    = cardState[d];
  const img   = st.img;
  const svgEl = document.getElementById(`dot-${d}`);
  if (!svgEl || !img) return;

  svgEl.style.display = markerVisible ? '' : 'none';
  svgEl.innerHTML = '';

  const hVal = document.getElementById('heightNum').value;
  const Z    = hVal === '' ? 0 : Number(hVal);
  const result = projectToPixel(img, searchLat, searchLon, Z);

  if (!result) { st.dx = st.dy = -1; return; }
  const [px, py] = result;
  const scale = st.scale;
  const dx = px * scale;
  const dy = py * scale;
  st.dx = dx;
  st.dy = dy;

  // Check footprint coverage
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
  const coversPoint = img.footprintMgi ? pointInPolygon2D(qx, qy, img.footprintMgi) : true;

  if (markerVisible) {
    const W = Math.round(img.width  * scale);
    const H = Math.round(img.height * scale);
    const stroke = coversPoint ? '#ff3333' : '#ffaa00';
    const warn = coversPoint ? '' : `
      <rect x="0" y="0" width="${W}" height="22" fill="#000" fill-opacity=".55"/>
      <text x="6" y="15" fill="#ffaa00" font-size="10" font-family="sans-serif">Outside footprint — extrapolated</text>`;

    const inFrame = dx >= 0 && dx <= W && dy >= 0 && dy <= H;
    if (inFrame) {
      svgEl.innerHTML = warn + `
        <line x1="${dx-20}" y1="${dy}" x2="${dx+20}" y2="${dy}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <line x1="${dx}" y1="${dy-20}" x2="${dx}" y2="${dy+20}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="12" fill="none" stroke="${stroke}" stroke-width="2" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="3" fill="${stroke}" opacity=".95"/>
        <rect x="${dx+15}" y="${dy-9}" width="56" height="13" rx="3" fill="#0d1117" fill-opacity=".75"/>
        <text x="${dx+18}" y="${dy}" fill="${stroke}" font-size="9" font-family="monospace"
              dominant-baseline="middle">${px.toFixed(0)}, ${py.toFixed(0)}</text>`;
    } else {
      const cx=W/2, cy=H/2;
      const angle=Math.atan2(dy-cy,dx-cx);
      const ex=cx+Math.cos(angle)*Math.min(cx,cy)*.85;
      const ey=cy+Math.sin(angle)*Math.min(cx,cy)*.85;
      svgEl.innerHTML = warn + `
        <circle cx="${ex}" cy="${ey}" r="7" fill="none" stroke="${stroke}" stroke-width="2" opacity=".7"/>
        <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
        <text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="middle" fill="${stroke}" font-size="10">→</text>`;
    }
  }

  scrollToMarker(d);
}

function refreshAllDots() {
  for (let d = 1; d <= 4; d++) refreshDot(d);
}

// ═══════════════════════════════════════════════════════
//  TILE QUALITY ZOOM  (shared across all 4 cards)
// ═══════════════════════════════════════════════════════
/** When true, tile zoom follows each card viewport, visual zoom, image size, and DPR. */
let tileZoomAuto = true;
let currentZoom = 1;

/** Device pixels per source image pixel for a given card viewport (fit × visual zoom × DPR). */
function viewPxPerImagePx(img, viewW, viewH) {
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  return baseScale * viewerZoom * (window.devicePixelRatio || 1);
}

/**
 * Auto tile zoom: coarsest pyramid level z where decoded tile pixels are not upsampled past
 * ~1 device pixel per source pixel.
 */
function computeAutoTileZoom(img, viewW, viewH) {
  const scale = viewPxPerImagePx(img, viewW, viewH);
  const tr = img.tileResolution;
  const maxZ = tr.length - 1;
  const eps = 1e-9;
  for (let zi = 0; zi <= maxZ; zi++) {
    if (tr[zi] * scale <= 1 + eps) return zi;
  }
  return maxZ;
}

/** Shared tile zoom across all cards; auto mode uses the finest level any card viewport needs. */
function getSharedTileZoomIndex() {
  if (tileZoomAuto) {
    let z = 0;
    for (let d = 1; d <= 4; d++) {
      const img = cardState[d].img;
      if (!img) continue;
      const area = document.getElementById(`viewer-${d}`);
      const viewW = area?.clientWidth || 400;
      const viewH = area?.clientHeight || 300;
      z = Math.max(z, computeAutoTileZoom(img, viewW, viewH));
    }
    return z;
  }
  const maxZs = [1, 2, 3, 4].filter(d => cardState[d].img)
    .map(d => cardState[d].img.tileResolution.length - 1);
  const cap = maxZs.length ? Math.min(...maxZs) : 4;
  return Math.max(0, Math.min(cap, currentZoom));
}

function updateZoomPillClasses() {
  const zEff = getSharedTileZoomIndex();
  document.querySelectorAll('#shared-pills .zoom-pill').forEach(p => {
    const dz = p.dataset.z;
    if (dz === 'auto') {
      p.classList.toggle('active', tileZoomAuto);
      p.classList.remove('auto-loaded');
      return;
    }
    const zi = Number(dz);
    p.classList.toggle('active', !tileZoomAuto && zi === currentZoom);
    p.classList.toggle('auto-loaded', tileZoomAuto && zi === zEff);
  });
}

document.getElementById('shared-pills').onclick = e => {
  const pill = e.target.closest('.zoom-pill');
  if (!pill) return;
  if (pill.dataset.z === 'auto') {
    tileZoomAuto = true;
  } else {
    tileZoomAuto = false;
    currentZoom = Number(pill.dataset.z);
  }
  renderAll();
};

// ═══════════════════════════════════════════════════════
//  VISUAL ZOOM  (shared, same steps as oblique-viewer.html)
// ═══════════════════════════════════════════════════════
const VZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 6, 8, 12, 16, 20, 24, 30];
let viewerZoom = 1;

function changeVZoom(dir) {
  let idx=0, best=Infinity;
  VZOOM_STEPS.forEach((v,i)=>{const d=Math.abs(v-viewerZoom);if(d<best){best=d;idx=i;}});
  idx = Math.max(0, Math.min(VZOOM_STEPS.length-1, idx+dir));
  viewerZoom = VZOOM_STEPS[idx];
  const lbl = viewerZoom >= 1
    ? (Number.isInteger(viewerZoom) ? viewerZoom+'×' : viewerZoom.toFixed(2).replace(/\.?0+$/,'')+'×')
    : viewerZoom.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
  document.getElementById('vzoomLabel').textContent = lbl;
  renderAll();
}

// Mouse wheel on any card viewer zooms all cards together
document.getElementById('grid').addEventListener('wheel', e => {
  if (!e.target.closest('.card-viewer')) return;
  e.preventDefault();
  changeVZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

// ═══════════════════════════════════════════════════════
//  MARKER / ZOOM-TO TOGGLES
// ═══════════════════════════════════════════════════════
let markerVisible = true;
let zoomToMarker  = true;

function toggleMarker() {
  markerVisible = !markerVisible;
  const btn = document.getElementById('markerBtn');
  btn.textContent  = markerVisible ? '● Marker' : '○ Marker';
  btn.classList.toggle('active', markerVisible);
  refreshAllDots();
}

function toggleZoomTo() {
  zoomToMarker = !zoomToMarker;
  const btn = document.getElementById('zoomToBtn');
  btn.textContent = zoomToMarker ? '⊕ Zoom to' : '⊖ Zoom to';
  btn.classList.toggle('active', zoomToMarker);
  if (zoomToMarker) for (let d=1;d<=4;d++) scrollToMarker(d);
}

function scrollToMarker(d) {
  if (!zoomToMarker) return;
  const st   = cardState[d];
  if (st.dx < 0 || st.dy < 0) return;
  const area = document.getElementById(`viewer-${d}`);
  if (!area) return;
  area.scrollLeft = st.padX + st.dx - area.clientWidth  / 2;
  area.scrollTop  = st.padY + st.dy - area.clientHeight / 2;
}

// ═══════════════════════════════════════════════════════
//  ARROW KEY NAVIGATION
// ═══════════════════════════════════════════════════════
let autoSwitchTimer = null;

/** Move search point by (dxM, dyM) metres (East=+x, North=+y) in MGI. */
function moveMarker(dxM, dyM) {
  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
  const [newLon, newLat] = wgs84ToMgi.inverse([mx + dxM, my + dyM]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshAllDots();
  scheduleAutoSwitch();
}

function toggleCardLock(d) {
  lockedCards.has(d) ? lockedCards.delete(d) : lockedCards.add(d);
  const btn = document.querySelector(`#card-${d} .card-lock-btn`);
  if (btn) {
    const locked = lockedCards.has(d);
    btn.textContent = locked ? '🔒' : '🔓';
    btn.classList.toggle('active', locked);
    btn.title = locked ? 'Locked – click to allow auto-switch' : 'Click to lock this view';
  }
}

/** Debounce: after 120 ms find the best image per direction and switch if needed. */
function scheduleAutoSwitch() {
  if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
  autoSwitchTimer = setTimeout(() => {
    autoSwitchTimer = null;
    const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
    for (let d = 1; d <= 4; d++) {
      if (lockedCards.has(d)) continue;
      let best = null, bestDist = Infinity;
      for (const img of allImages) {
        if (img.viewDirection !== d) continue;
        const [cx, cy] = img.lookAtMgi;
        const dist = Math.hypot(qx - cx, qy - cy);
        if (dist < bestDist) { bestDist = dist; best = img; }
      }
      const cur = cardState[d].img;
      if (best && (!cur || best.name !== cur.name)) {
        switchCardBg(d, best, qx, qy);
      }
    }
  }, 120);
}

/** Preload the lowest-res tile of the candidate; switch once it arrives (max 800 ms). */
function switchCardBg(d, img, qx, qy) {
  img = {
    ...img,
    distM: Math.round(Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1])),
  };
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    cardState[d].img = img;
    cardState[d].dx  = cardState[d].dy = -1;
    renderCard(d);
    renderTiles(d);
    updateZoomPillClasses();
  };
  const probe = new Image();
  probe.onload  = commit;
  probe.onerror = commit;
  setTimeout(commit, 800);
  probe.src = `${activeRemoteBaseUrl}/${img.name}/0/0/0.jpg`;
}

// ── Continuous keyboard movement: fires every animation frame while keys held ──
const ARROW_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const keysHeld   = new Set();
let   shiftHeld  = false;
let   keyRafId   = null, lastKeyTs = null;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Shift') { shiftHeld = true; return; }
  if (!ARROW_KEYS.includes(e.key)) return;
  e.preventDefault();
  keysHeld.add(e.key);
  if (!keyRafId) keyRafId = requestAnimationFrame(keyMoveLoop);
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; return; }
  keysHeld.delete(e.key);
  if (keysHeld.size === 0) lastKeyTs = null;
});

function keyMoveLoop(ts) {
  if (keysHeld.size === 0) { keyRafId = null; lastKeyTs = null; return; }
  if (lastKeyTs === null) lastKeyTs = ts;
  const dt   = Math.min((ts - lastKeyTs) / 1000, 0.1);
  lastKeyTs  = ts;
  const step = (shiftHeld ? 300 : 50) * dt;
  let dxM = 0, dyM = 0;
  if (keysHeld.has('ArrowUp'))    dyM += step;
  if (keysHeld.has('ArrowDown'))  dyM -= step;
  if (keysHeld.has('ArrowLeft'))  dxM -= step;
  if (keysHeld.has('ArrowRight')) dxM += step;
  moveMarker(dxM, dyM);
  keyRafId = requestAnimationFrame(keyMoveLoop);
}

// ── Mouse / touch drag: move the marker by inverting the camera Jacobian ──
let   isDragging  = false;
let   dragCard    = null;
let   dragStartCX = 0, dragStartCY = 0;
let   dragStartMX = 0, dragStartMY = 0;
let   dragInvJ    = null, dragScale = 1;

const gridEl = document.getElementById('grid');

if (typeof ResizeObserver !== 'undefined' && gridEl) {
  let gridResizeRaf = 0;
  new ResizeObserver(() => {
    if (!tileZoomAuto) return;
    cancelAnimationFrame(gridResizeRaf);
    gridResizeRaf = requestAnimationFrame(() => renderAll());
  }).observe(gridEl);
}

function getViewerCard(el) {
  const v = el.closest('[id^="viewer-"]');
  return v ? Number(v.id.split('-')[1]) : null;
}

function beginDrag(clientX, clientY, d) {
  const img = cardState[d].img;
  if (!img) return false;
  const hVal = document.getElementById('heightNum').value;
  const Z    = hVal === '' ? 0 : Number(hVal);
  const invJ = computeInvJacobian(img, searchLat, searchLon, Z);
  if (!invJ) return false;
  isDragging  = true;
  dragCard    = d;
  dragStartCX = clientX;
  dragStartCY = clientY;
  [dragStartMX, dragStartMY] = wgs84ToMgi.forward([searchLon, searchLat]);
  dragInvJ    = invJ;
  dragScale   = cardState[d].scale;
  return true;
}

function applyDrag(clientX, clientY) {
  if (!isDragging || !dragInvJ) return;
  const ddxImg = -(clientX - dragStartCX) / dragScale;
  const ddyImg = -(clientY - dragStartCY) / dragScale;
  const dX = dragInvJ.dXdPx * ddxImg + dragInvJ.dXdPy * ddyImg;
  const dY = dragInvJ.dYdPx * ddxImg + dragInvJ.dYdPy * ddyImg;
  const [newLon, newLat] = wgs84ToMgi.inverse([dragStartMX + dX, dragStartMY + dY]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshAllDots();
  scheduleAutoSwitch();
}

function endDrag() {
  isDragging = false;
  dragInvJ   = null;
  gridEl.style.cursor = '';
}

gridEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const d = getViewerCard(e.target);
  if (d === null) return;
  if (beginDrag(e.clientX, e.clientY, d)) {
    gridEl.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
document.addEventListener('mousemove', e => { if (isDragging) applyDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup',   ()  => { if (isDragging) endDrag(); });

// ── Pinch-to-zoom state ──
let isPinching     = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let pinchLastRatio = 1;

function pinchDist(t) { return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

function setViewerZoomTo(z) {
  viewerZoom = Math.max(VZOOM_STEPS[0], Math.min(VZOOM_STEPS[VZOOM_STEPS.length-1], z));
  const v = viewerZoom;
  const lbl = v >= 1
    ? (Number.isInteger(v) ? v+'×' : v.toFixed(2).replace(/\.?0+$/,'')+'×')
    : v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
  document.getElementById('vzoomLabel').textContent = lbl;
  renderAll();
}

gridEl.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isPinching = false;
    const d = getViewerCard(e.target);
    if (d === null) return;
    if (beginDrag(e.touches[0].clientX, e.touches[0].clientY, d)) e.preventDefault();
  } else if (e.touches.length === 2) {
    isPinching     = true;
    isDragging     = false;
    pinchStartDist = pinchDist(e.touches);
    pinchStartZoom = viewerZoom;
    pinchLastRatio = 1;
    // Anchor the scale to each card's viewport centre (where the marker lives).
    for (let d = 1; d <= 4; d++) {
      const area = document.getElementById(`viewer-${d}`);
      const el   = area?.firstElementChild;
      if (area && el) {
        const ox = area.scrollLeft + area.clientWidth  / 2;
        const oy = area.scrollTop  + area.clientHeight / 2;
        el.style.transformOrigin = `${ox}px ${oy}px`;
      }
    }
    e.preventDefault();
  }
}, { passive: false });

gridEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && !isPinching) {
    applyDrag(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2 && isPinching) {
    pinchLastRatio = pinchDist(e.touches) / pinchStartDist;
    // CSS scale gives smooth real-time feedback; no DOM rebuild until fingers lift.
    for (let d = 1; d <= 4; d++) {
      const el = document.getElementById(`viewer-${d}`)?.firstElementChild;
      if (el) el.style.transform = `scale(${pinchLastRatio})`;
    }
  }
}, { passive: false });

gridEl.addEventListener('touchend', e => {
  if (isPinching && e.touches.length < 2) {
    // Commit: remove preview transforms and do one proper re-render.
    for (let d = 1; d <= 4; d++) {
      const el = document.getElementById(`viewer-${d}`)?.firstElementChild;
      if (el) { el.style.transform = ''; el.style.transformOrigin = ''; }
    }
    setViewerZoomTo(pinchStartZoom * pinchLastRatio);
    isPinching = false;
  }
  if (e.touches.length === 0) endDrag();
});

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
loadIndex();
</script>
</body>
</html>
