<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vienna Oblique Aerial Photography Map and Finder</title>
  <link rel="icon" href="logos/favicon.ico" type="image/x-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --accent: #388bfd; --accent2: #58a6ff;
      --text: #c9d1d9; --text-dim: #8b949e;
      --success: #3fb950; --warning: #d29922; --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: .95rem; font-weight: 600; flex: 1; }
    .home-link {
      display: inline-flex; align-items: center; line-height: 0;
      text-decoration: none; opacity: .9;
    }
    .home-link:hover { opacity: 1; }
    .dev-credit {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .75rem; color: var(--text-dim); white-space: nowrap;
    }
    .dev-credit a {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent2); text-decoration: none; font-weight: 500;
    }
    .dev-credit a:hover { text-decoration: underline; }
    .dev-credit img {
      width: 18px; height: 18px; border-radius: 9px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65), 0 0 2px rgba(0, 0, 0, 0.4);
    }
    .badge { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
    .spinner { width: 9px; height: 9px; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.ok { background: var(--success); }

    .app { display: flex; height: calc(100vh - 43px); overflow: hidden; }

    /* left panel */
    .left-panel { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); }
    .search-box { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; gap: 6px; }
    .field { flex: 1; }
    .field label { display: block; font-size: .72rem; color: var(--text-dim); margin-bottom: 3px; }
    input[type=text], input[type=number] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 9px; font-size: .85rem; font-family: monospace; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end; }
    button:disabled { opacity: .4; cursor: default; }
    button:hover:not(:disabled) { opacity: .85; }
    .btn-sm { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 3px 9px; font-size: .78rem; }

    .results-header { padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; font-size: .78rem; color: var(--text-dim); }
    .results-header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .results-header strong { color: var(--text); }
    .sort-select { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: .75rem; padding: 2px 6px; margin-left: auto; }
    .filter-label { display: flex; align-items: center; gap: 4px; font-size: .73rem; cursor: pointer; white-space: nowrap; }
    .filter-input { width:48px !important; flex:0 0 auto; background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:.73rem; padding:2px 5px; }
    .cache-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 2px; }
    .cache-select { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: .73rem; padding: 2px 5px; }
    .cache-select:disabled { opacity: .4; }
    .results-list { flex: 1; overflow-y: auto; }
    .result-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    .result-item:hover { background: var(--surface2); }
    .result-item.active { background: #1a2740; border-left: 2px solid var(--accent); padding-left: 12px; }
    .result-item.result-outside { opacity: .55; }
    .result-item.result-outside .thumb-wrap { filter: grayscale(.6); }
    .thumb-wrap { width: 64px; height: 64px; flex-shrink: 0; background: #0a0c10; border-radius: 4px; overflow: hidden; }
    .thumb-wrap img { width: 64px; height: 64px; object-fit: cover; display: block; }
    .result-meta { flex: 1; min-width: 0; }
    .result-name { font-family: monospace; font-size: .8rem; font-weight: 600; }
    .result-sub { font-size: .73rem; color: var(--text-dim); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .compass-wrap { flex-shrink: 0; }
    .compass { width: 40px; height: 40px; }

    /* right panel */
    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .viewer-header { padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
    .viewer-title { font-weight: 600; font-size: .9rem; }
    .viewer-sub { font-size: .72rem; color: var(--text-dim); }
    .zoom-pills { display: flex; gap: 4px; }
    .zoom-pill { padding: 2px 8px; border-radius: 10px; font-size: .75rem; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }
    .zoom-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* In auto mode: which pyramid level is actually loaded */
    .zoom-pill.auto-loaded { border: 2px solid var(--accent2); color: var(--accent2); background: var(--surface2); box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.25); }
    .zoom-pill:hover:not(.active):not(.auto-loaded) { border-color: var(--accent); color: var(--text); }
    .zoom-pill.auto-loaded:hover { border-color: var(--accent2); color: #79c0ff; }

    /* height control */
    .height-ctrl { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text-dim); margin-left: auto; }
    .height-ctrl input[type=range] { width: 80px; accent-color: var(--accent); }
    .height-ctrl input[type=number] { width: 58px; padding: 2px 6px; font-size: .75rem; }

    .viewer-area { flex: 1; overflow: auto; background: #080a0e; cursor: grab; position: relative; }
    .tile-canvas-wrap { display: inline-block; line-height: 0; }
    .tile-row { display: flex; }
    .tile-row img { display: block; flex-shrink: 0; background: #111; }

    /* visual zoom controls */
    .vzoom-ctrl { display: flex; align-items: center; gap: 3px; }
    .vzoom-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; width: 22px; height: 22px; font-size: 1rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .vzoom-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .vzoom-label { font-size: .75rem; color: var(--text-dim); min-width: 36px; text-align: center; font-family: monospace; }
    .empty-viewer { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: .9rem; }

    .progress-bar { height: 3px; background: var(--border); }
    .progress-fill { height: 100%; background: var(--accent); transition: width .15s; }

    .tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: .68rem; font-weight: 600; }
    .tag-n { background: #0c2d40; color: #4fc3f7; }
    .tag-e { background: #0c2a0e; color: #81c784; }
    .tag-s { background: #2a1508; color: #ff8a65; }
    .tag-w { background: #210f33; color: #ce93d8; }
    .tag-x { background: #1a1a1a; color: #aaa; }

    .no-results { padding: 30px; text-align: center; color: var(--text-dim); font-size: .85rem; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="header">
  <a href="/" class="home-link" title="Home" aria-label="Home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2" fill="#58a6ff" stroke="none"/>
    </svg>
  </a>
  <h1>Vienna Oblique Image Finder</h1>
  <span class="dev-credit">
    Developed by
    <a href="https://dreamtent.dev" target="_blank" rel="noopener noreferrer">
      <img src="logos/163280227_64px.png" alt="" width="18" height="18">
      dreamtent.dev
    </a>
  </span>
  <div class="badge" id="badge">
    <div class="spinner" id="spinner"></div>
    <span id="badgeText">Loading index…</span>
  </div>
</div>

<div class="app">
  <!-- LEFT: search + list -->
  <div class="left-panel">
    <div class="search-box">
      <div class="search-row">
        <div class="field" style="flex:1;min-width:120px">
          <label>Image set</label>
          <select id="imageSetSel" class="cache-select" style="width:100%"
                  title="Local tile index and remote image tiles for this capture year"
                  onchange="onImageSetChange()">
            <option value="2023">Wien 2023</option>
            <option value="2020">Wien 2020</option>
          </select>
        </div>
        <div class="field" style="flex:2">
          <label>Latitude, Longitude</label>
          <input type="text" id="coordsInput" value="48.2767386234921, 16.44324030796789">
        </div>
        <div class="field" style="flex:0 0 90px">
          <label title="Max distance from query point to the image ground footprint (quad edge)">Radius (m)</label>
          <input type="number" id="radiusInput" value="200" min="10" max="5000" step="10">
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button id="searchBtn" onclick="doSearch()" disabled>Search</button>
        <label style="display:flex;align-items:center;gap:5px;font-size:.75rem;cursor:pointer;color:var(--text-dim)"
               title="Run Search again when coordinates change (typing, arrow keys, drag)">
          <input type="checkbox" id="autoSearchOnMoveCb" checked>
          Auto-search on move
        </label>
        <span style="font-size:.72rem;color:var(--text-dim)" id="indexStatus">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="cache-row">
        <label id="cacheEnabledLabel" style="display:flex;align-items:center;gap:5px;font-size:.75rem;cursor:pointer;color:var(--text-dim)"
               title="">
          <input type="checkbox" id="cacheEnabledCb" onchange="onCacheToggle()">
          Keep images in memory
        </label>
        <select id="cacheSizeSel" class="cache-select" disabled onchange="onCacheSizeChange()"
                title="">
          <option value="3">3 images</option>
          <option value="5" selected>5 images</option>
          <option value="10">10 images</option>
          <option value="20">20 images</option>
          <option value="50">50 images</option>
          <option value="70">70 images</option>
          <option value="100">100 images</option>
          <option value="200">200 images</option>
          <option value="300">300 images</option>
        </select>
        <button type="button" class="btn-sm" id="preloadListBtn" onclick="preloadResultList()" disabled
                title="">
          Preload list
        </button>
        <label class="filter-label" style="margin-left:2px"
               title="After each search or sort, run Preload list automatically">
          <input type="checkbox" id="preloadListAutoCb" disabled onchange="onPreloadListAutoChange()">
          Auto-preload
        </label>
        <span id="cacheInfo" style="font-size:.72rem;color:var(--text-dim)"></span>
        <span id="preloadProgress" style="font-size:.72rem;color:var(--accent2);min-width:12em"></span>
      </div>
    </div>

    <div class="results-header" id="resultsHeader" style="display:none">
      <!-- Row 1: count + sort -->
      <div class="results-header-row">
        <strong id="resultCount">0</strong>&nbsp;images found
        <select class="sort-select" id="sortSelect" onchange="applySort()">
          <option value="dist">Sort: Distance</option>
          <option value="heading">Sort: Heading</option>
          <option value="dir">Sort: Direction</option>
          <option value="margin">Sort: H-angle |↑| centred</option>
          <option value="rotate">Sort: Orbit 360°</option>
        </select>
      </div>
      <!-- Row 2: filters -->
      <div class="results-header-row">
        <label class="filter-label" title="Hide images where the marker (plus the radius below) projects outside the visible frame">
          <input type="checkbox" id="filterOutOfFrame" onchange="applySort()">
          Hide ⚠ outside
        </label>
        <input type="number" id="frameRadiusM" value="0" min="0" max="2000" step="5"
               class="filter-input" style="width:52px"
               title="Radius (m) around the marker that must be fully inside the image"
               oninput="applySort()">
        <span>m</span>
        <span style="display:flex;align-items:center;gap:4px;flex-shrink:0"
              title="Filter by vertical angle ↕ of the marker from image centre. Positive = below centre (near camera). Empty = no limit.">
          <span>↕</span>
          <input type="number" id="vertAngleMin" placeholder="min°" step="1" min="-90" max="90"
                 class="filter-input"
                 title="Min vertical angle (°) — hide images where the marker is above this"
                 oninput="applySort()">
          <span>–</span>
          <input type="number" id="vertAngleMax" placeholder="max°" step="1" min="-90" max="90"
                 class="filter-input"
                 title="Max vertical angle (°) — hide images where the marker is below this"
                 oninput="applySort()">
          <span>°</span>
        </span>
      </div>
    </div>
    <div class="results-list" id="resultsList"></div>
  </div>

  <!-- RIGHT: viewer -->
  <div class="right-panel">
    <div class="viewer-header" id="viewerHeader" style="display:none">
      <div>
        <div class="viewer-title" id="viewerTitle">—</div>
        <div class="viewer-sub" id="viewerSub">—</div>
      </div>
      <div class="zoom-pills" id="zoomPills"></div>
      <!-- visual zoom (independent of tile quality) -->
      <div class="vzoom-ctrl" title="Visual zoom — also scroll to keep marker centred (mouse wheel)">
        <button class="vzoom-btn" onclick="changeViewZoom(-1)">−</button>
        <span class="vzoom-label" id="vzoomLabel">1×</span>
        <button class="vzoom-btn" onclick="changeViewZoom(+1)">+</button>
      </div>
      <!-- height control for dot projection -->
      <div class="height-ctrl" title="Ground elevation (Z) used for coordinate projection onto image">
        <span>Z:</span>
        <input type="range" id="heightSlider" min="-100" max="400" step="1" value="0"
               oninput="document.getElementById('heightNum').value=this.value; onHeightChange()">
        <input type="number" id="heightNum" value="0" min="-100" max="400"
               oninput="document.getElementById('heightSlider').value=this.value; onHeightChange()">
        <span>m</span>
      </div>
      <button class="btn-sm" id="markerToggleBtn"  onclick="toggleMarker()">● Marker</button>
      <button class="btn-sm" id="zoomMarkerBtn"   onclick="toggleZoomToMarker()">⊕ Zoom to</button>
      <button class="btn-sm" id="pinCenterBtn"    onclick="togglePinCenter()" style="opacity:.5"
              title="Keep the marker pinned to the exact viewport centre; image translates, dark space fills the edges">⊙ Pin centre</button>
      <button class="btn-sm" id="overlayBtn"     onclick="toggleOverlay()"  style="opacity:.5"
              title="Stack images when navigating — each new image is layered on top, aligned so the marker stays at the same screen position. Best combined with ⊙ Pin centre.">⧉ Overlay</button>
      <select id="overlayLayersSel" class="sort-select" disabled onchange="onOverlayLayersChange()"
              title="Max layers kept in the overlay stack" style="padding:2px 4px">
        <option value="2">×2</option>
        <option value="3" selected>×3</option>
        <option value="5">×5</option>
        <option value="10">×10</option>
        <option value="20">×20</option>
        <option value="30">×30</option>
      </select>
      <span id="overlayBlurBaseWrap" style="font-size:.68rem;color:var(--text-dim);display:inline-flex;align-items:center;gap:3px;opacity:.4"
            title="Blur applied to every layer behind the current image (in addition to the per-layer amount)">
        <span>base</span>
        <input type="number" id="overlayBlurFixedInput" value="0" min="0" max="40" step="0.5" disabled
               style="width:40px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.73rem;padding:2px 5px;"
               oninput="onOverlayBlurChange()">
        <span>px</span>
      </span>
      <span style="font-size:.68rem;color:var(--text-dim);margin:0 2px">+</span>
      <input type="number" id="overlayBlurInput" value="0" min="0" max="40" step="0.5" disabled
             title="Extra blur (px) multiplied by how many layers back from the current image"
             style="width:46px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.73rem;padding:2px 5px;"
             oninput="onOverlayBlurChange()">
      <span id="overlayBlurUnit" style="font-size:.73rem;color:var(--text-dim);opacity:.4">px/layer</span>
      <label class="filter-label" title="Off: per-camera pan offset only. On: back layers are warped with a perspective homography from the ground plane (fixed Z) into the active image’s view — correct for pinhole cameras on a flat slice; not a full spherical/terrain reprojection.">
        <input type="checkbox" id="overlayStretchToMainCb" disabled onchange="onOverlayReprojectChange()">
        Reproject to main
      </label>
      <select id="overlayNeighborPreloadSel" class="sort-select" disabled onchange="onOverlayNeighborPreloadChange()"
              title="When Reproject is on: pre-decode tiles and show the N nearest candidate images (same view direction first, then distance to marker) behind your stack, warped into the main view"
              style="padding:2px 4px">
        <option value="0" selected>near 0</option>
        <option value="4">near 4</option>
        <option value="8">near 8</option>
        <option value="16">near 16</option>
        <option value="32">near 32</option>
        <option value="64">near 64</option>
        <option value="128">near 128</option>
        <option value="265">near 265</option>
      </select>
      <button class="btn-sm" id="lockImagesBtn"    onclick="toggleLockImages()">🔓 Lock image</button>
      <label class="filter-label" style="margin-left:4px"
             title="Decode every tile for the next view before swapping. Current image stays until the new one is ready.">
        <input type="checkbox" id="waitFullTilesSwitchCb">
        Wait full tiles
      </label>
      <label class="filter-label" title="When off, auto-switch runs after you release keys or finish dragging (not every frame).">
        <input type="checkbox" id="autoSwitchWhileMovingCb" checked>
        Switch while moving
      </label>
      <button class="btn-sm" id="autoRotateBtn"   onclick="toggleAutoRotate()">↻ Rotate to marker</button>
      <button class="btn-sm" onclick="downloadCurrent()">⬇ Download</button>
      <span style="display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--text-dim);white-space:nowrap"
            title="Auto-advance through the sorted list (same as . key)">
        <button type="button" class="btn-sm" id="listPlayBtn" onclick="toggleListPlay()" style="padding:2px 8px">▶</button>
        <input type="number" id="listPlayIntervalSec" value="1" min="0.1" max="120" step="0.1"
               title="Seconds between each step"
               style="width:48px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.72rem;padding:2px 4px"
               oninput="restartListPlayIfActive()">
        <span>s</span>
      </span>
      <span style="font-size:.68rem;color:var(--text-dim);white-space:nowrap"
            title="Arrow keys: move along view (↑↓←→, Shift=×10). + / # visual zoom (DE layout). , / . list.">⌨ ↑↓←→ +# · , .</span>
    </div>
    <div class="viewer-area" id="viewerArea">
      <div class="empty-viewer">← Select an image from the list</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
/** Fallback CRS if manifest is missing generalImageInfo.crs (matches 2023 dataset). */
const MGI_PROJ_FALLBACK = '+proj=tmerc +lat_0=0 +lon_0=16.3333333333333 +k=1 +x_0=0 +y_0=-5000000 +ellps=bessel +towgs84=577.326,90.129,463.919,5.137,1.474,5.297,2.4232 +units=m +no_defs';
/** Standard Austria MGI ↔ WGS84 (ETRS89) 7-parameter shift; required for correct lat/lon ↔ ground metres. */
const MGI_TOWGS84 = '+towgs84=577.326,90.129,463.919,5.137,1.474,5.297,2.4232';

/**
 * Each set: remote pyramid base URL, local `image.json` path, local folder of per-tile JSON indexes.
 * Tile lists and CRS come from the manifest at runtime.
 */
const IMAGE_SETS = [
  {
    id: '2023',
    label: 'Wien 2023',
    remoteBaseUrl: 'https://cdn.map.dreamtent.dev/data/oblique/vienna/2023/',
    imageJsonPath: 'sources/2023/image.json',
    tilesDir: 'sources/2023/tiles',
  },
  {
    id: '2020',
    label: 'Wien 2020',
    remoteBaseUrl: 'https://cdn.map.dreamtent.dev/data/oblique/vienna/2020',
    imageJsonPath: 'sources/2020/image.json',
    tilesDir: 'sources/2020/tiles',
  },
];

let tileSize = 1024;
/** Set during index load; copied onto each image row as remoteBaseUrl / setId. */
let activeRemoteBaseUrl = IMAGE_SETS[0].remoteBaseUrl;
let activeSetId = IMAGE_SETS[0].id;

function normalizeCrs(crs) {
  if (!crs || typeof crs !== 'string') return MGI_PROJ_FALLBACK;
  let s = crs.trim().replace(/\s*\+type=crs\s*/gi, ' ').replace(/\s+/g, ' ').trim();
  // 2020 manifest CRS omits +towgs84; without it, WGS84 (e.g. Google Maps) ↔ MGI is wrong by ~100 m fixed shift.
  // 2023 includes towgs84 — keep behaviour aligned when the string already has it.
  if (/ellps=bessel/i.test(s) && !/\+towgs84=/i.test(s)) {
    s = `${s.replace(/\s*\+no_defs\s*$/i, '').trim()} ${MGI_TOWGS84} +no_defs`;
  }
  return s;
}

const DIR_LABELS = { 1:'North', 2:'East', 3:'South', 4:'West', 5:'Nadir' };
const DIR_TAG    = { 1:'tag-n', 2:'tag-e', 3:'tag-s', 4:'tag-w', 5:'tag-x' };

// ═══════════════════════════════════════════════════════════════
//  PROJECTIONS  (redefined when switching image sets from manifest CRS)
// ═══════════════════════════════════════════════════════════════
proj4.defs('MGI', MGI_PROJ_FALLBACK);
let wgs84ToMgi = proj4('EPSG:4326', 'MGI');

// ═══════════════════════════════════════════════════════════════
//  PLANAR GEOMETRY (MGI ground plane, metres)
//  Footprint corners in JSON may be unordered → bowtie polygon → wrong
//  inside-test and wrong distance. Order by angle from centroid, CCW.
// ═══════════════════════════════════════════════════════════════
function orderFootprintCCW(ring) {
  if (!ring || ring.length < 3) return ring;
  const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length;
  const cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
  const ordered = [...ring].sort(
    (a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx)
  );
  let area = 0;
  for (let i = 0; i < ordered.length; i++) {
    const j = (i + 1) % ordered.length;
    area += ordered[i][0] * ordered[j][1] - ordered[j][0] * ordered[i][1];
  }
  if (area < 0) ordered.reverse();
  return ordered;
}

function footprintCentroid(ring) {
  const sx = ring.reduce((s, p) => s + p[0], 0);
  const sy = ring.reduce((s, p) => s + p[1], 0);
  const n = ring.length;
  return [sx / n, sy / n];
}

/** Robust odd-even test on a simple (non–self-intersecting) ring. */
function pointInPolygon2D(px, py, ring) {
  let inside = false;
  const n = ring.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const denom = yj - yi;
    if (Math.abs(denom) < 1e-15) continue;
    if ((yi > py) === (yj > py)) continue;
    const xInt = xi + ((py - yi) * (xj - xi)) / denom;
    if (px < xInt) inside = !inside;
  }
  return inside;
}

function distPointToSegment2D(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const apx = px - ax, apy = py - ay;
  const abLen2 = abx * abx + aby * aby;
  if (abLen2 < 1e-20) return Math.hypot(px - ax, py - ay);
  let t = (apx * abx + apy * aby) / abLen2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * abx, cy = ay + t * aby;
  return Math.hypot(px - cx, py - cy);
}

/** Shortest distance from (px,py) to polygon boundary; 0 if inside (MGI metres). */
function distancePointToFootprintMeters(px, py, ring) {
  if (!ring || ring.length < 3) return Infinity;
  if (pointInPolygon2D(px, py, ring)) return 0;
  let minD = Infinity;
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const d = distPointToSegment2D(px, py, ring[i][0], ring[i][1], ring[j][0], ring[j][1]);
    if (d < minD) minD = d;
  }
  return minD;
}

// ═══════════════════════════════════════════════════════════════
//  IMAGE INDEX
// ═══════════════════════════════════════════════════════════════
const allImages = [];

function avgHeight(groundCoords) {
  if (!groundCoords) return 0;
  const zs = groundCoords.map(c => c[2] || 0);
  return zs.reduce((a, b) => a + b, 0) / zs.length;
}

function parseImageTile(data) {
  const rows = data.images;
  if (!rows || rows.length < 2) return;
  const hdr = rows[0];
  const iN   = hdr.indexOf('name');
  const iW   = hdr.indexOf('width');
  const iH   = hdr.indexOf('height');
  const iTR  = hdr.indexOf('tile-resolution');
  const iVD  = hdr.indexOf('view-direction');
  const iVDA = hdr.indexOf('view-direction-angle');
  const iGC  = hdr.indexOf('groundCoordinates');
  const iCtr = hdr.indexOf('centerPointOnGround');
  const iPTI = hdr.indexOf('p-to-image');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const center = r[iCtr];
    if (!center) continue;

    const gc = r[iGC] || null;
    /** Ground footprint: ordered CCW so distance / inside tests are valid */
    const footprintMgi =
      gc && gc.length >= 3 ? orderFootprintCCW(gc.map((c) => [c[0], c[1]])) : null;

    // Heading: math angle (CCW from East) → compass bearing (CW from North)
    const vda = r[iVDA];
    const heading = vda != null
      ? ((90 - vda * 180 / Math.PI) % 360 + 360) % 360
      : ({ 1:0, 2:90, 3:180, 4:270 }[r[iVD]] ?? 0);

    // Ground point (Z=0) that the image centre pixel looks at.
    // Solve P·[X,Y,0,1]ᵀ = w·[px_c, py_c, 1]ᵀ for X,Y.
    // This is a better selection metric than the footprint geographic centroid
    // because it places the query point near the middle of the chosen image.
    const px_c = (r[iW] || 14144) / 2, py_c = (r[iH] || 10560) / 2;
    let lookAtMgi = center.slice(0, 2); // fallback to footprint centroid
    const Pm = r[iPTI];
    if (Pm) {
      const a1=Pm[0][0]-px_c*Pm[2][0], b1=Pm[0][1]-px_c*Pm[2][1], c1=px_c*Pm[2][3]-Pm[0][3];
      const a2=Pm[1][0]-py_c*Pm[2][0], b2=Pm[1][1]-py_c*Pm[2][1], c2=py_c*Pm[2][3]-Pm[1][3];
      const det = a1*b2 - b1*a2;
      if (Math.abs(det) > 1e-10) lookAtMgi = [(c1*b2-b1*c2)/det, (a1*c2-c1*a2)/det];
    }

    allImages.push({
      name:          r[iN],
      width:         r[iW]  || 14144,
      height:        r[iH]  || 10560,
      tileResolution:r[iTR] || [16, 8, 4, 2, 1],
      viewDirection: r[iVD],
      heading,
      footprintMgi,
      mgiCenter: center.slice(0, 2), // geographic footprint centroid (kept for debug)
      lookAtMgi,                     // ground point at image centre — used for selection
      groundZ:   avgHeight(gc),
      pToImage:  r[iPTI] || null,
      remoteBaseUrl: activeRemoteBaseUrl,
      setId:         activeSetId,
    });
  }
}

// ═══════════════════════════════════════════════════════════════
//  CAMERA PROJECTION  world (MGI) → image pixel
//  px = u/w,  py = v/w  (y=0 at top, matching our HTML viewer)
// ═══════════════════════════════════════════════════════════════
function projectToPixel(img, lat, lon, groundHeight) {
  if (!img.pToImage) return null;
  const P = img.pToImage;

  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const Z = groundHeight;

  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];

  if (Math.abs(w) < 1e-10) return null;

  const px = u / w;
  // The original OL-based viewer uses (height - v/w) because OL's pixel y-axis
  // points UP. Our HTML viewer has y=0 at the TOP, so v/w is already correct.
  const py = v / w;

  return [px, py];
}

/**
 * Inverse Jacobian of the camera projection at (lat, lon, Z).
 * Returns a 2×2 object { dXdPx, dXdPy, dYdPx, dYdPy } mapping image-pixel
 * displacements (in native image pixels) to MGI metre displacements.
 * Used for drag-to-move and could be used for other inverse-projection needs.
 */
function computeInvJacobian(img, lat, lon, Z) {
  if (!img || !img.pToImage) return null;
  const P = img.pToImage;
  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];
  if (Math.abs(w) < 1e-10) return null;
  const w2 = w * w;
  const a =  (P[0][0]*w - u*P[2][0]) / w2;  // d(px)/dX
  const b =  (P[0][1]*w - u*P[2][1]) / w2;  // d(px)/dY
  const c =  (P[1][0]*w - v*P[2][0]) / w2;  // d(py)/dX
  const d =  (P[1][1]*w - v*P[2][1]) / w2;  // d(py)/dY
  const det = a*d - b*c;
  if (Math.abs(det) < 1e-20) return null;
  return { dXdPx: d/det, dXdPy: -b/det, dYdPx: -c/det, dYdPy: a/det };
}

/**
 * Ray–ground-plane intersection in MGI: image pixel (px,py) at fixed ground Z (metres).
 * Inverts the same pinhole model as projectToPixel (single planar Z slice).
 */
function pixelToGroundMgi(img, px, py, Z) {
  if (!img.pToImage) return null;
  const P = img.pToImage;
  const a11 = P[0][0] - px * P[2][0];
  const a12 = P[0][1] - px * P[2][1];
  const b1 = px * (P[2][2] * Z + P[2][3]) - P[0][2] * Z - P[0][3];
  const a21 = P[1][0] - py * P[2][0];
  const a22 = P[1][1] - py * P[2][1];
  const b2 = py * (P[2][2] * Z + P[2][3]) - P[1][2] * Z - P[1][3];
  const det = a11 * a22 - a12 * a21;
  if (Math.abs(det) < 1e-18) return null;
  const X = (b1 * a22 - b2 * a12) / det;
  const Y = (a11 * b2 - a21 * b1) / det;
  return [X, Y];
}

function groundMgiToPixel(img, X, Y, Z) {
  if (!img.pToImage) return null;
  const P = img.pToImage;
  const u = P[0][0] * X + P[0][1] * Y + P[0][2] * Z + P[0][3];
  const v = P[1][0] * X + P[1][1] * Y + P[1][2] * Z + P[1][3];
  const w = P[2][0] * X + P[2][1] * Y + P[2][2] * Z + P[2][3];
  if (Math.abs(w) < 1e-10) return null;
  return [u / w, v / w];
}

function applyHomography2D(H, x, y) {
  const w = H[2][0] * x + H[2][1] * y + H[2][2];
  if (Math.abs(w) < 1e-14) return null;
  return [
    (H[0][0] * x + H[0][1] * y + H[0][2]) / w,
    (H[1][0] * x + H[1][1] * y + H[1][2]) / w,
  ];
}

/** Solve 8×8 system A x = b (partial pivot). */
function solveLinear8(A, b) {
  const n = 8;
  const M = A.map((row, i) => row.slice().concat(b[i]));
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) {
      if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
    }
    if (Math.abs(M[pivot][col]) < 1e-14) return null;
    if (pivot !== col) [M[col], M[pivot]] = [M[pivot], M[col]];
    const div = M[col][col];
    for (let j = col; j <= n; j++) M[col][j] /= div;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = M[r][col];
      if (f !== 0) for (let j = col; j <= n; j++) M[r][j] -= f * M[col][j];
    }
  }
  return M.map(row => row[n]);
}

/** Homography H with h₂₂=1 mapping src → dst (four point pairs, pixel coords). */
function homographyFrom4Points2D(srcPts, dstPts) {
  const A = [];
  const b = [];
  for (let i = 0; i < 4; i++) {
    const x = srcPts[i][0], y = srcPts[i][1];
    const xp = dstPts[i][0], yp = dstPts[i][1];
    A.push([x, y, 1, 0, 0, 0, -xp * x, -xp * y]);
    b.push(xp);
    A.push([0, 0, 0, x, y, 1, -yp * x, -yp * y]);
    b.push(yp);
  }
  const h8 = solveLinear8(A, b);
  if (!h8) return null;
  return [
    [h8[0], h8[1], h8[2]],
    [h8[3], h8[4], h8[5]],
    [h8[6], h8[7], 1],
  ];
}

/**
 * Two perspective views of the same ground plane (fixed Z) are related by a plane homography.
 * This matches the “ball” / perspective field of view better than uniform scale; it is still
 * a planar slice — very large footprints need terrain + ellipsoid for strict spherical mapping.
 */
function homographyLayerNativeToMainNative(imgLayer, imgMain, Z) {
  const W = imgLayer.width, H = imgLayer.height;
  const corners = [[0, 0], [W, 0], [W, H], [0, H]];
  const src = [];
  const dst = [];
  for (let i = 0; i < 4; i++) {
    const px = corners[i][0], py = corners[i][1];
    const g = pixelToGroundMgi(imgLayer, px, py, Z);
    if (!g) return null;
    const m = groundMgiToPixel(imgMain, g[0], g[1], Z);
    if (!m) return null;
    src.push([px, py]);
    dst.push([m[0], m[1]]);
  }
  return homographyFrom4Points2D(src, dst);
}

function overlayNativeToPadXY(px, py, scale, rotDeg, cw, ch) {
  let vx = px * scale;
  let vy = py * scale;
  if (rotDeg !== 0 && cw > 0 && ch > 0) {
    const cx = cw / 2, cy = ch / 2;
    const θ = rotDeg * Math.PI / 180;
    const dx0 = vx - cx, dy0 = vy - cy;
    vx = cx + dx0 * Math.cos(θ) - dy0 * Math.sin(θ);
    vy = cy + dx0 * Math.sin(θ) + dy0 * Math.cos(θ);
  }
  return [vx, vy];
}

/** Where a main-image native pixel lands in viewerArea coords (same stack as the top layer). */
function mainNativeToViewportPx(pmx, pmy, viewW, viewH) {
  const o = markerVisualInPadPx();
  if (!o) return null;
  let vx = pmx * currentDispScale;
  let vy = pmy * currentDispScale;
  const cw = currentContentW, ch = currentContentH;
  const rotDeg = currentRotDeg;
  if (rotDeg !== 0 && cw > 0 && ch > 0) {
    const cx = cw / 2, cy = ch / 2;
    const θ = rotDeg * Math.PI / 180;
    const dx0 = vx - cx, dy0 = vy - cy;
    vx = cx + dx0 * Math.cos(θ) - dy0 * Math.sin(θ);
    vy = cy + dx0 * Math.sin(θ) + dy0 * Math.cos(θ);
  }
  return { x: vx + viewW / 2 - o.vx, y: vy + viewH / 2 - o.vy };
}

function homography3x3ToMatrix3dString(H) {
  const h = H;
  const m = [
    h[0][0], h[1][0], 0, h[2][0],
    h[0][1], h[1][1], 0, h[2][1],
    0, 0, 1, 0,
    h[0][2], h[1][2], 0, h[2][2],
  ];
  return `matrix3d(${m.join(',')})`;
}
