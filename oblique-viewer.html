<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vienna Oblique Image Finder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --accent: #388bfd; --accent2: #58a6ff;
      --text: #c9d1d9; --text-dim: #8b949e;
      --success: #3fb950; --warning: #d29922; --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: .95rem; font-weight: 600; flex: 1; }
    .badge { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
    .spinner { width: 9px; height: 9px; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.ok { background: var(--success); }

    .app { display: flex; height: calc(100vh - 43px); overflow: hidden; }

    /* left panel */
    .left-panel { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); }
    .search-box { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; gap: 6px; }
    .field { flex: 1; }
    .field label { display: block; font-size: .72rem; color: var(--text-dim); margin-bottom: 3px; }
    input[type=text], input[type=number] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 9px; font-size: .85rem; font-family: monospace; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end; }
    button:disabled { opacity: .4; cursor: default; }
    button:hover:not(:disabled) { opacity: .85; }
    .btn-sm { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 3px 9px; font-size: .78rem; }

    .results-header { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--text-dim); }
    .results-header strong { color: var(--text); }
    .sort-select { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: .75rem; padding: 2px 6px; }
    .filter-label { display: flex; align-items: center; gap: 4px; font-size: .73rem; cursor: pointer; margin-left: auto; white-space: nowrap; }
    .cache-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 2px; }
    .cache-select { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: .73rem; padding: 2px 5px; }
    .cache-select:disabled { opacity: .4; }
    .results-list { flex: 1; overflow-y: auto; }
    .result-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    .result-item:hover { background: var(--surface2); }
    .result-item.active { background: #1a2740; border-left: 2px solid var(--accent); padding-left: 12px; }
    .result-item.result-outside { opacity: .55; }
    .result-item.result-outside .thumb-wrap { filter: grayscale(.6); }
    .thumb-wrap { width: 64px; height: 64px; flex-shrink: 0; background: #0a0c10; border-radius: 4px; overflow: hidden; }
    .thumb-wrap img { width: 64px; height: 64px; object-fit: cover; display: block; }
    .result-meta { flex: 1; min-width: 0; }
    .result-name { font-family: monospace; font-size: .8rem; font-weight: 600; }
    .result-sub { font-size: .73rem; color: var(--text-dim); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .compass-wrap { flex-shrink: 0; }
    .compass { width: 40px; height: 40px; }

    /* right panel */
    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .viewer-header { padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
    .viewer-title { font-weight: 600; font-size: .9rem; }
    .viewer-sub { font-size: .72rem; color: var(--text-dim); }
    .zoom-pills { display: flex; gap: 4px; }
    .zoom-pill { padding: 2px 8px; border-radius: 10px; font-size: .75rem; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }
    .zoom-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .zoom-pill:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* height control */
    .height-ctrl { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text-dim); margin-left: auto; }
    .height-ctrl input[type=range] { width: 80px; accent-color: var(--accent); }
    .height-ctrl input[type=number] { width: 58px; padding: 2px 6px; font-size: .75rem; }

    .viewer-area { flex: 1; overflow: auto; background: #080a0e; cursor: grab; }
    .tile-canvas-wrap { display: inline-block; line-height: 0; }
    .tile-row { display: flex; }
    .tile-row img { display: block; flex-shrink: 0; background: #111; }

    /* visual zoom controls */
    .vzoom-ctrl { display: flex; align-items: center; gap: 3px; }
    .vzoom-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; width: 22px; height: 22px; font-size: 1rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .vzoom-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .vzoom-label { font-size: .75rem; color: var(--text-dim); min-width: 36px; text-align: center; font-family: monospace; }
    .empty-viewer { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: .9rem; }

    .progress-bar { height: 3px; background: var(--border); }
    .progress-fill { height: 100%; background: var(--accent); transition: width .15s; }

    .tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: .68rem; font-weight: 600; }
    .tag-n { background: #0c2d40; color: #4fc3f7; }
    .tag-e { background: #0c2a0e; color: #81c784; }
    .tag-s { background: #2a1508; color: #ff8a65; }
    .tag-w { background: #210f33; color: #ce93d8; }
    .tag-x { background: #1a1a1a; color: #aaa; }

    .no-results { padding: 30px; text-align: center; color: var(--text-dim); font-size: .85rem; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="header">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2" fill="#58a6ff" stroke="none"/>
  </svg>
  <h1>Vienna Oblique Image Finder</h1>
  <div class="badge" id="badge">
    <div class="spinner" id="spinner"></div>
    <span id="badgeText">Loading index…</span>
  </div>
</div>

<div class="app">
  <!-- LEFT: search + list -->
  <div class="left-panel">
    <div class="search-box">
      <div class="search-row">
        <div class="field" style="flex:2">
          <label>Latitude, Longitude</label>
          <input type="text" id="coordsInput" value="48.2767386234921, 16.44324030796789">
        </div>
        <div class="field" style="flex:0 0 90px">
          <label title="Max distance from query point to the image ground footprint (quad edge)">Radius (m)</label>
          <input type="number" id="radiusInput" value="200" min="10" max="5000" step="10">
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="searchBtn" onclick="doSearch()" disabled>Search</button>
        <span style="font-size:.72rem;color:var(--text-dim)" id="indexStatus">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="cache-row">
        <label style="display:flex;align-items:center;gap:5px;font-size:.75rem;cursor:pointer;color:var(--text-dim)"
               title="Hold decoded tile bitmaps in memory so previously viewed images re-display instantly. Each image at z4 ≈ 42 MB.">
          <input type="checkbox" id="cacheEnabledCb" onchange="onCacheToggle()">
          Keep images in memory
        </label>
        <select id="cacheSizeSel" class="cache-select" disabled onchange="onCacheSizeChange()"
                title="Max number of (image × zoom) pairs kept in memory. Memory shown is worst-case (z4).">
          <option value="3">3 images (~126 MB)</option>
          <option value="5" selected>5 images (~210 MB)</option>
          <option value="10">10 images (~420 MB)</option>
          <option value="20">20 images (~840 MB)</option>
          <option value="50">50 images (~2.1 GB)</option>
        </select>
        <span id="cacheInfo" style="font-size:.72rem;color:var(--text-dim)"></span>
      </div>
    </div>

    <div class="results-header" id="resultsHeader" style="display:none">
      <strong id="resultCount">0</strong>&nbsp;images found
      <label class="filter-label" title="Hide images where the marker projects outside the visible frame">
        <input type="checkbox" id="filterOutOfFrame" onchange="applySort()">
        Hide ⚠ outside
      </label>
      <select class="sort-select" id="sortSelect" onchange="applySort()">
        <option value="dist">Sort: Distance</option>
        <option value="heading">Sort: Heading</option>
        <option value="dir">Sort: Direction</option>
        <option value="margin">Sort: H-angle |↑| centred</option>
        <option value="rotate">Sort: Orbit 360°</option>
      </select>
    </div>
    <div class="results-list" id="resultsList"></div>
  </div>

  <!-- RIGHT: viewer -->
  <div class="right-panel">
    <div class="viewer-header" id="viewerHeader" style="display:none">
      <div>
        <div class="viewer-title" id="viewerTitle">—</div>
        <div class="viewer-sub" id="viewerSub">—</div>
      </div>
      <div class="zoom-pills" id="zoomPills"></div>
      <!-- visual zoom (independent of tile quality) -->
      <div class="vzoom-ctrl" title="Visual zoom — also scroll to keep marker centred (mouse wheel)">
        <button class="vzoom-btn" onclick="changeViewZoom(-1)">−</button>
        <span class="vzoom-label" id="vzoomLabel">1×</span>
        <button class="vzoom-btn" onclick="changeViewZoom(+1)">+</button>
      </div>
      <!-- height control for dot projection -->
      <div class="height-ctrl" title="Ground elevation (Z) used for coordinate projection onto image">
        <span>Z:</span>
        <input type="range" id="heightSlider" min="-100" max="400" step="1" value="0"
               oninput="document.getElementById('heightNum').value=this.value; onHeightChange()">
        <input type="number" id="heightNum" value="0" min="-100" max="400"
               oninput="document.getElementById('heightSlider').value=this.value; onHeightChange()">
        <span>m</span>
      </div>
      <button class="btn-sm" id="markerToggleBtn"  onclick="toggleMarker()">● Marker</button>
      <button class="btn-sm" id="zoomMarkerBtn"   onclick="toggleZoomToMarker()">⊕ Zoom to</button>
      <button class="btn-sm" id="pinCenterBtn"    onclick="togglePinCenter()" style="opacity:.5"
              title="Keep the marker pinned to the exact viewport centre; image translates, dark space fills the edges">⊙ Pin centre</button>
      <button class="btn-sm" id="lockImagesBtn"    onclick="toggleLockImages()">🔓 Lock image</button>
      <button class="btn-sm" id="autoRotateBtn"   onclick="toggleAutoRotate()">↻ Rotate to marker</button>
      <button class="btn-sm" onclick="downloadCurrent()">⬇ Download</button>
      <span style="font-size:.68rem;color:var(--text-dim);white-space:nowrap"
            title="Arrow keys move the marker (Shift = ×10). Best matching image auto-loads. , / . step through the list.">⌨ ↑↓←→ · , .</span>
    </div>
    <div class="viewer-area" id="viewerArea">
      <div class="empty-viewer">← Select an image from the list</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const BASE_URL = 'https://www.wien.gv.at/stadtplan3d/datasource-data/Oblique/91bf9860-34d7-4f9a-b841-32be753b09e5';
const MGI_PROJ = '+proj=tmerc +lat_0=0 +lon_0=16.3333333333333 +k=1 +x_0=0 +y_0=-5000000 +ellps=bessel +towgs84=577.326,90.129,463.919,5.137,1.474,5.297,2.4232 +units=m +no_defs';
const TILE_SIZE = 1024;
const TILE_FILES = [
  '12/2233/1418','12/2234/1418','12/2235/1418','12/2232/1418','12/2236/1418',
  '12/2231/1419','12/2232/1419','12/2233/1419','12/2234/1419','12/2235/1419','12/2236/1419',
  '12/2231/1420','12/2232/1420','12/2233/1420','12/2234/1420','12/2235/1420','12/2236/1420','12/2237/1420',
  '12/2231/1421','12/2232/1421','12/2233/1421','12/2234/1421','12/2235/1421','12/2236/1421','12/2237/1421',
  '12/2232/1422','12/2233/1422','12/2234/1422','12/2235/1422','12/2236/1422','12/2237/1422',
  '12/2231/1418','12/2231/1422','12/2235/1417','12/2234/1417','12/2233/1417'
];
const DIR_LABELS = { 1:'North', 2:'East', 3:'South', 4:'West', 5:'Nadir' };
const DIR_TAG    = { 1:'tag-n', 2:'tag-e', 3:'tag-s', 4:'tag-w', 5:'tag-x' };

// ═══════════════════════════════════════════════════════════════
//  PROJECTIONS
// ═══════════════════════════════════════════════════════════════
proj4.defs('MGI', MGI_PROJ);
const wgs84ToMgi  = proj4('EPSG:4326', 'MGI');

// ═══════════════════════════════════════════════════════════════
//  PLANAR GEOMETRY (MGI ground plane, metres)
//  Footprint corners in JSON may be unordered → bowtie polygon → wrong
//  inside-test and wrong distance. Order by angle from centroid, CCW.
// ═══════════════════════════════════════════════════════════════
function orderFootprintCCW(ring) {
  if (!ring || ring.length < 3) return ring;
  const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length;
  const cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
  const ordered = [...ring].sort(
    (a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx)
  );
  let area = 0;
  for (let i = 0; i < ordered.length; i++) {
    const j = (i + 1) % ordered.length;
    area += ordered[i][0] * ordered[j][1] - ordered[j][0] * ordered[i][1];
  }
  if (area < 0) ordered.reverse();
  return ordered;
}

function footprintCentroid(ring) {
  const sx = ring.reduce((s, p) => s + p[0], 0);
  const sy = ring.reduce((s, p) => s + p[1], 0);
  const n = ring.length;
  return [sx / n, sy / n];
}

/** Robust odd-even test on a simple (non–self-intersecting) ring. */
function pointInPolygon2D(px, py, ring) {
  let inside = false;
  const n = ring.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const denom = yj - yi;
    if (Math.abs(denom) < 1e-15) continue;
    if ((yi > py) === (yj > py)) continue;
    const xInt = xi + ((py - yi) * (xj - xi)) / denom;
    if (px < xInt) inside = !inside;
  }
  return inside;
}

function distPointToSegment2D(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const apx = px - ax, apy = py - ay;
  const abLen2 = abx * abx + aby * aby;
  if (abLen2 < 1e-20) return Math.hypot(px - ax, py - ay);
  let t = (apx * abx + apy * aby) / abLen2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * abx, cy = ay + t * aby;
  return Math.hypot(px - cx, py - cy);
}

/** Shortest distance from (px,py) to polygon boundary; 0 if inside (MGI metres). */
function distancePointToFootprintMeters(px, py, ring) {
  if (!ring || ring.length < 3) return Infinity;
  if (pointInPolygon2D(px, py, ring)) return 0;
  let minD = Infinity;
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const d = distPointToSegment2D(px, py, ring[i][0], ring[i][1], ring[j][0], ring[j][1]);
    if (d < minD) minD = d;
  }
  return minD;
}

// ═══════════════════════════════════════════════════════════════
//  IMAGE INDEX
// ═══════════════════════════════════════════════════════════════
const allImages = [];

function avgHeight(groundCoords) {
  if (!groundCoords) return 0;
  const zs = groundCoords.map(c => c[2] || 0);
  return zs.reduce((a, b) => a + b, 0) / zs.length;
}

function parseImageTile(data) {
  const rows = data.images;
  if (!rows || rows.length < 2) return;
  const hdr = rows[0];
  const iN   = hdr.indexOf('name');
  const iW   = hdr.indexOf('width');
  const iH   = hdr.indexOf('height');
  const iTR  = hdr.indexOf('tile-resolution');
  const iVD  = hdr.indexOf('view-direction');
  const iVDA = hdr.indexOf('view-direction-angle');
  const iGC  = hdr.indexOf('groundCoordinates');
  const iCtr = hdr.indexOf('centerPointOnGround');
  const iPTI = hdr.indexOf('p-to-image');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const center = r[iCtr];
    if (!center) continue;

    const gc = r[iGC] || null;
    /** Ground footprint: ordered CCW so distance / inside tests are valid */
    const footprintMgi =
      gc && gc.length >= 3 ? orderFootprintCCW(gc.map((c) => [c[0], c[1]])) : null;

    // Heading: math angle (CCW from East) → compass bearing (CW from North)
    const vda = r[iVDA];
    const heading = vda != null
      ? ((90 - vda * 180 / Math.PI) % 360 + 360) % 360
      : ({ 1:0, 2:90, 3:180, 4:270 }[r[iVD]] ?? 0);

    // Ground point (Z=0) that the image centre pixel looks at.
    // Solve P·[X,Y,0,1]ᵀ = w·[px_c, py_c, 1]ᵀ for X,Y.
    // This is a better selection metric than the footprint geographic centroid
    // because it places the query point near the middle of the chosen image.
    const px_c = (r[iW] || 14144) / 2, py_c = (r[iH] || 10560) / 2;
    let lookAtMgi = center.slice(0, 2); // fallback to footprint centroid
    const Pm = r[iPTI];
    if (Pm) {
      const a1=Pm[0][0]-px_c*Pm[2][0], b1=Pm[0][1]-px_c*Pm[2][1], c1=px_c*Pm[2][3]-Pm[0][3];
      const a2=Pm[1][0]-py_c*Pm[2][0], b2=Pm[1][1]-py_c*Pm[2][1], c2=py_c*Pm[2][3]-Pm[1][3];
      const det = a1*b2 - b1*a2;
      if (Math.abs(det) > 1e-10) lookAtMgi = [(c1*b2-b1*c2)/det, (a1*c2-c1*a2)/det];
    }

    allImages.push({
      name:          r[iN],
      width:         r[iW]  || 14144,
      height:        r[iH]  || 10560,
      tileResolution:r[iTR] || [16, 8, 4, 2, 1],
      viewDirection: r[iVD],
      heading,
      footprintMgi,
      mgiCenter: center.slice(0, 2), // geographic footprint centroid (kept for debug)
      lookAtMgi,                     // ground point at image centre — used for selection
      groundZ:   avgHeight(gc),
      pToImage:  r[iPTI] || null,
    });
  }
}

// ═══════════════════════════════════════════════════════════════
//  CAMERA PROJECTION  world (MGI) → image pixel
//  px = u/w,  py = v/w  (y=0 at top, matching our HTML viewer)
// ═══════════════════════════════════════════════════════════════
function projectToPixel(img, lat, lon, groundHeight) {
  if (!img.pToImage) return null;
  const P = img.pToImage;

  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const Z = groundHeight;

  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];

  if (Math.abs(w) < 1e-10) return null;

  const px = u / w;
  // The original OL-based viewer uses (height - v/w) because OL's pixel y-axis
  // points UP. Our HTML viewer has y=0 at the TOP, so v/w is already correct.
  const py = v / w;

  return [px, py];
}

/**
 * Inverse Jacobian of the camera projection at (lat, lon, Z).
 * Returns a 2×2 object { dXdPx, dXdPy, dYdPx, dYdPy } mapping image-pixel
 * displacements (in native image pixels) to MGI metre displacements.
 * Used for drag-to-move and could be used for other inverse-projection needs.
 */
function computeInvJacobian(img, lat, lon, Z) {
  if (!img || !img.pToImage) return null;
  const P = img.pToImage;
  const [X, Y] = wgs84ToMgi.forward([lon, lat]);
  const u = P[0][0]*X + P[0][1]*Y + P[0][2]*Z + P[0][3];
  const v = P[1][0]*X + P[1][1]*Y + P[1][2]*Z + P[1][3];
  const w = P[2][0]*X + P[2][1]*Y + P[2][2]*Z + P[2][3];
  if (Math.abs(w) < 1e-10) return null;
  const w2 = w * w;
  const a =  (P[0][0]*w - u*P[2][0]) / w2;  // d(px)/dX
  const b =  (P[0][1]*w - u*P[2][1]) / w2;  // d(px)/dY
  const c =  (P[1][0]*w - v*P[2][0]) / w2;  // d(py)/dX
  const d =  (P[1][1]*w - v*P[2][1]) / w2;  // d(py)/dY
  const det = a*d - b*c;
  if (Math.abs(det) < 1e-20) return null;
  return { dXdPx: d/det, dXdPy: -b/det, dYdPx: -c/det, dYdPy: a/det };
}

// ═══════════════════════════════════════════════════════════════
//  LOAD INDEX
// ═══════════════════════════════════════════════════════════════
let loadedCount = 0;
async function loadIndex() {
  const total = TILE_FILES.length;
  await Promise.all(TILE_FILES.map(async tile => {
    try {
      const resp = await fetch(`tiles/${tile.replace(/\//g,'_')}.json`);
      if (resp.ok) parseImageTile(await resp.json());
    } catch(e) { console.warn('Skipped', tile, e.message); }
    finally {
      loadedCount++;
      document.getElementById('progressFill').style.width = (loadedCount/total*100)+'%';
      document.getElementById('indexStatus').textContent = `${loadedCount}/${total}`;
    }
  }));

  document.getElementById('spinner').style.display = 'none';
  const badge = document.getElementById('badge');
  badge.insertBefore(Object.assign(document.createElement('div'), {className:'dot ok'}), badge.firstChild);
  document.getElementById('badgeText').textContent = `${allImages.length.toLocaleString()} images`;
  document.getElementById('indexStatus').textContent = '';
  document.getElementById('progressFill').style.display = 'none';
  document.getElementById('searchBtn').disabled = false;
}

// ═══════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════
let searchLat = 0, searchLon = 0, searchResults = [];

function doSearch() {
  const raw = document.getElementById('coordsInput').value.trim();
  const parts = raw.split(/[\s,]+/).map(Number);
  if (parts.length < 2 || parts.some(isNaN)) { alert('Enter: lat, lon'); return; }
  [searchLat, searchLon] = parts;

  const radiusM = Math.max(1, Number(document.getElementById('radiusInput').value) || 200);
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);

  searchResults = [];
  for (const img of allImages) {
    // Primary metric: distance from query to centerPointOnGround (metres, MGI plane).
    // This ranks images by how central the query point is in the image.
    const [cx, cy] = img.lookAtMgi;
    const distCenter = Math.hypot(qx - cx, qy - cy);
    if (distCenter > radiusM) continue;

    // Keep footprint test only for the visual warning (reliable vs extrapolated dot).
    const coversPoint = img.footprintMgi
      ? pointInPolygon2D(qx, qy, img.footprintMgi)
      : (distCenter < radiusM * 0.5);

    searchResults.push({
      ...img,
      distM: Math.round(distCenter),
      distCenter,
      coversPoint,
    });
  }

  document.getElementById('resultsHeader').style.display = 'flex';
  applySort();   // applySort sets resultCount (supports "X / Y" when filtered)
}

document.getElementById('coordsInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
document.getElementById('radiusInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

/**
 * Signed horizontal angle of the marker from the image centre.
 *   negative = marker is left  of centre
 *   positive = marker is right of centre
 *   0        = perfectly centred horizontally
 *
 * Uses f_x ≈ ‖P[0, 0:3]‖ (camera matrix row norm ≈ focal length in pixels).
 */
function computeHorizAngle(img, lat, lon, Z) {
  if (!img.pToImage) return NaN;
  const res = projectToPixel(img, lat, lon, Z);
  if (!res) return NaN;
  const [px] = res;
  const P  = img.pToImage;
  const fx = Math.hypot(P[0][0], P[0][1], P[0][2]);
  if (fx < 1) return NaN;
  return Math.atan((px - img.width / 2) / fx) * (180 / Math.PI);
}

function applySort() {
  const key = document.getElementById('sortSelect').value;
  const Z   = Number(document.getElementById('heightNum').value) || 0;

  // Pre-compute signed horizontal angle + in-frame flag for every result.
  // One projectToPixel call per image covers both needs.
  const items = searchResults.map(img => {
    const res = projectToPixel(img, searchLat, searchLon, Z);
    const inFrame = res != null
      && res[0] >= 0 && res[0] <= img.width
      && res[1] >= 0 && res[1] <= img.height;
    let horizAngle = NaN;
    if (res && img.pToImage) {
      const fx = Math.hypot(img.pToImage[0][0], img.pToImage[0][1], img.pToImage[0][2]);
      if (fx >= 1) horizAngle = Math.atan((res[0] - img.width / 2) / fx) * (180 / Math.PI);
    }
    // Orbit angle: bearing from the marker to the camera (0-360°).
    // Camera looks at `heading`; marker appears `horizAngle` to the right of centre,
    // so the marker is at bearing (heading + horizAngle) from the camera, and the
    // camera is at bearing (heading + horizAngle + 180°) from the marker.
    const orbitAngle = isFinite(horizAngle)
      ? ((img.heading + horizAngle + 180) % 360 + 360) % 360
      : ((img.heading + 180) % 360);
    return { ...img, horizAngle, inFrame, orbitAngle };
  });

  // Optionally hide images where the marker projects outside the frame.
  const hideOOF  = document.getElementById('filterOutOfFrame')?.checked;
  const visible  = hideOOF ? items.filter(it => it.inFrame) : items;

  visible.sort((a, b) =>
    key === 'heading' ? a.heading - b.heading :
    key === 'dir'     ? (a.viewDirection - b.viewDirection) || (a.distCenter - b.distCenter) :
    key === 'margin'  ? Math.abs(a.horizAngle) - Math.abs(b.horizAngle) :  // most centred first
    key === 'rotate'  ? a.orbitAngle - b.orbitAngle :
    /* dist */          a.distCenter - b.distCenter
  );

  // Update the count badge: "X / Y" when filtered, plain "Y" otherwise.
  const countEl = document.getElementById('resultCount');
  if (countEl) {
    countEl.textContent = (hideOOF && visible.length !== items.length)
      ? `${visible.length} / ${items.length}`
      : items.length;
  }

  renderList(visible);
}

// ═══════════════════════════════════════════════════════════════
//  LIST RENDER
// ═══════════════════════════════════════════════════════════════
function headingArrow(deg) {
  return ['↑','↗','→','↘','↓','↙','←','↖'][Math.round(deg/45)%8];
}

function compassSVG(heading) {
  const r = heading * Math.PI / 180;
  const s = Math.sin(r), c = Math.cos(r);
  const tx = 20+14*s, ty = 20-14*c, bx = 20-8*s, by = 20+8*c;
  const px = -c*3, py = -s*3;
  return `<svg class="compass" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <line x1="20" y1="3"  x2="20" y2="7"  stroke="#8b949e" stroke-width="1.2"/>
    <line x1="20" y1="33" x2="20" y2="37" stroke="#8b949e" stroke-width="1.2"/>
    <line x1="3"  y1="20" x2="7"  y2="20" stroke="#8b949e" stroke-width="1.2"/>
    <line x1="33" y1="20" x2="37" y2="20" stroke="#8b949e" stroke-width="1.2"/>
    <text x="20" y="10" text-anchor="middle" fill="#8b949e" font-size="5" font-family="sans-serif">N</text>
    <polygon points="${tx},${ty} ${20+px},${20+py} ${bx},${by} ${20-px},${20-py}" fill="#388bfd" opacity=".9"/>
    <circle cx="20" cy="20" r="2" fill="#c9d1d9"/>
  </svg>`;
}

function renderList(items) {
  const list = document.getElementById('resultsList');
  list._items = items;
  if (!items.length) { list.innerHTML = '<div class="no-results">No images in this radius.</div>'; return; }

  list.innerHTML = items.map((img, idx) => {
    const distStr = (img.distM >= 1000 ? (img.distM/1000).toFixed(2)+' km' : img.distM+' m') +
      (img.coversPoint ? ' ✓' : '');
    const tag = `<span class="tag ${DIR_TAG[img.viewDirection]||'tag-x'}">${DIR_LABELS[img.viewDirection]||'Dir'+img.viewDirection}</span>`;
    const ha  = img.horizAngle;
    const angleStr = (ha != null && isFinite(ha))
      ? `<span title="Horizontal angle of marker from image centre (−=left, +=right)"
               style="color:${Math.abs(ha)<=10?'var(--success)':Math.abs(ha)<=25?'var(--warning)':'var(--error)'}">
           ${ha>=0?'+':''}${ha.toFixed(1)}°</span>`
      : '';
    const orbitStr = (img.orbitAngle != null && isFinite(img.orbitAngle))
      ? `<span title="Bearing from marker to camera (orbit position, 0°=N clockwise)"
               style="color:var(--text-dim)">⟳ ${img.orbitAngle.toFixed(1)}°</span>`
      : '';
    const outsideStr = img.inFrame === false
      ? `<span style="color:var(--error);font-weight:600;font-size:.72rem"
               title="The marker projects outside this image's frame">⚠ outside image</span>`
      : '';
    return `<div class="result-item${img.inFrame===false?' result-outside':''}" data-idx="${idx}" onclick="selectImage(${idx},this)">
      <div class="thumb-wrap">
        <img src="${BASE_URL}/${img.name}/0/0/0.jpg" loading="lazy" onerror="this.style.opacity='.15'">
      </div>
      <div class="result-meta">
        <div class="result-name">${img.name}</div>
        <div class="result-sub">
          ${tag}
          <span>${headingArrow(img.heading)} ${img.heading.toFixed(1)}°</span>
          <span>${distStr}</span>
          ${angleStr}
          ${orbitStr}
          ${outsideStr}
        </div>
      </div>
      <div class="compass-wrap">${compassSVG(img.heading)}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
//  VIEWER
// ═══════════════════════════════════════════════════════════════
let currentImage = null, currentZoom = 1;
let currentDispScale = 1;  // display pixels per image pixel — SAME at all zoom levels
let currentContentW  = 0, currentContentH = 0; // content div size (after scale, before rotation)
let currentRotDeg    = 0;  // degrees currently applied as CSS rotate() on the clip div
let autoRotate       = false; // when true, rotate so the marker is horizontally centred
let pinMarkerCenter  = false; // when true, translate the image so the marker is at the exact viewport centre

// Visual zoom (multiplier on top of the fit-to-viewer base scale).
// Kept between image switches; independent of tile quality zoom.
const VZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 6, 8, 12, 16, 20, 24, 30];
let viewerZoom = 1;          // current visual zoom multiplier
let viewPadX = 0, viewPadY = 0;  // centering padding so marker-scroll math is correct
let markerDX = -1, markerDY = -1; // last marker display position (px), -1 = no marker

function selectImage(idx, el) {
  document.querySelectorAll('.result-item.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentImage = document.getElementById('resultsList')._items[idx];
  // Clamp tile-quality zoom to the new image's available levels, but keep it otherwise.
  const maxZoom = currentImage.tileResolution.length - 1;
  currentZoom = Math.min(currentZoom, maxZoom);
  openViewer(currentImage, currentZoom);
}

function openViewer(img, zoom) {
  document.getElementById('viewerHeader').style.display = 'flex';
  const distStr = `${img.distM} m to image center` + (img.coversPoint ? ' · inside footprint ✓' : '');
  document.getElementById('viewerTitle').textContent = img.name;
  document.getElementById('viewerSub').textContent =
    `${DIR_LABELS[img.viewDirection]||''} · ${img.heading.toFixed(1)}° · ${distStr} · ${img.width}×${img.height}px`;

  // Only initialise Z on the very first image load; preserve the user's value thereafter.

  // zoom pills
  const maxZoom = img.tileResolution.length - 1;
  const pills = document.getElementById('zoomPills');
  pills.innerHTML = img.tileResolution.map((res, z) => {
    const {cols, rows} = tileDims(img.width, img.height, z, img.tileResolution);
    return `<span class="zoom-pill ${z===zoom?'active':''}" data-z="${z}" title="${cols}×${rows} tiles">
      z${z} <small style="opacity:.6">${cols*rows}t</small>
    </span>`;
  }).join('');
  pills.onclick = e => {
    const pill = e.target.closest('.zoom-pill');
    if (!pill) return;
    const z = Number(pill.dataset.z);
    pills.querySelectorAll('.zoom-pill').forEach(p => p.classList.toggle('active', p===pill));
    currentZoom = z;
    renderTiles(img, z);
    preloadToCache(img, z);
  };

  renderTiles(img, zoom);
  preloadToCache(img, zoom);
}

function tileDims(width, height, zoom, tileResolution) {
  const res = tileResolution[zoom];
  return { cols: Math.ceil(width/(TILE_SIZE*res)), rows: Math.ceil(height/(TILE_SIZE*res)) };
}

function renderTiles(img, zoom) {
  const area = document.getElementById('viewerArea');
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];

  // Base scale fits image to viewer; viewerZoom multiplies on top of that.
  const viewW = area.clientWidth  || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  const scale     = baseScale * viewerZoom;
  const dispTileW = Math.max(1, Math.round(TILE_SIZE * res * scale));
  currentDispScale = scale;

  const topBlack = Math.round((rows * TILE_SIZE * res - img.height) * scale);
  const contentW = Math.round(img.width  * scale);
  const contentH = Math.round(img.height * scale);

  // Compute auto-rotation: rotate so the marker is horizontally centred.
  // rotDeg = -horizAngle  (positive horizAngle → marker right of centre → rotate left).
  let rotDeg = 0;
  if (autoRotate && img.pToImage) {
    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (proj) {
      const fx = Math.hypot(img.pToImage[0][0], img.pToImage[0][1], img.pToImage[0][2]);
      if (fx >= 1) rotDeg = -Math.atan((proj[0] - img.width / 2) / fx) * (180 / Math.PI);
    }
  }
  currentRotDeg   = rotDeg;
  currentContentW = contentW;
  currentContentH = contentH;
  updateAutoRotateLabel(rotDeg);

  // In pin-centre mode padding is irrelevant (translate does all positioning).
  // In normal mode centre the image, with extra room for rotated corners.
  if (pinMarkerCenter) {
    viewPadX = 0;
    viewPadY = 0;
  } else {
    const rotRad    = Math.abs(rotDeg) * Math.PI / 180;
    const rotExtraW = Math.round((contentW * (1 - Math.cos(rotRad)) + contentH * Math.sin(rotRad)) / 2);
    const rotExtraH = Math.round((contentH * (1 - Math.cos(rotRad)) + contentW * Math.sin(rotRad)) / 2);
    viewPadX = Math.max(0, Math.floor((viewW - contentW) / 2)) + rotExtraW;
    viewPadY = Math.max(0, Math.floor((viewH - contentH) / 2)) + rotExtraH;
  }

  let tilesHtml = '';
  for (let y = rows - 1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${BASE_URL}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="lazy" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }

  const rotStyle = rotDeg !== 0
    ? `transform:rotate(${rotDeg}deg);transform-origin:50% 50%;`
    : '';

  // Outer div provides centering padding; inner clip wrapper hides black tile borders.
  // The rotation is applied to the clip wrapper so tiles + SVG rotate together.
  // IDs rotPadDiv / rotClipDiv allow refreshDot() to update the rotation live
  // without rebuilding the whole tile grid.
  area.innerHTML = `
    <div id="rotPadDiv" style="padding:${viewPadY}px ${viewPadX}px;min-width:max-content;background:#080a0e;">
      <div id="rotClipDiv" style="position:relative;width:${contentW}px;height:${contentH}px;overflow:hidden;${rotStyle}">
        <div style="position:absolute;top:-${topBlack}px;left:0;">
          <div class="tile-canvas-wrap">${tilesHtml}</div>
        </div>
        <svg id="dotOverlay" style="position:absolute;top:0;left:0;width:${contentW}px;height:${contentH}px;overflow:visible;pointer-events:none;"></svg>
      </div>
    </div>`;

  refreshDot();
}

// ═══════════════════════════════════════════════════════════════
//  DOT OVERLAY  – called whenever height changes or image changes
// ═══════════════════════════════════════════════════════════════
/** Called when the ground-elevation (Z) slider/input changes.
 *  Refreshes the dot projection AND re-evaluates the inFrame filter so the
 *  "Hide ⚠ outside" checkbox reflects the new elevation immediately. */
function onHeightChange() {
  refreshDot();
  if (searchResults.length) applySort();
}

function refreshDot() {
  const svgEl = document.getElementById('dotOverlay');
  if (!svgEl || !currentImage) return;

  // Z=0 is the valid ground datum for this dataset — do not fall back to 170.
  const hVal = document.getElementById('heightNum').value;
  const groundHeight = hVal === '' ? 0 : Number(hVal);
  const result = projectToPixel(currentImage, searchLat, searchLon, groundHeight);

  svgEl.style.display = markerVisible ? '' : 'none';
  svgEl.innerHTML = '';

  // Always compute display position — needed by scrollToMarker even when hidden.
  if (!result) { markerDX = markerDY = -1; return; }
  const [px, py] = result;

  const scale = currentDispScale;
  const dx = px * scale;
  const dy = py * scale;
  markerDX = dx;
  markerDY = dy;

  // Draw the marker only when visible.
  if (markerVisible) {
    const W = Math.round(currentImage.width  * scale);
    const H = Math.round(currentImage.height * scale);

    const stroke = currentImage.coversPoint ? '#ff3333' : '#ffaa00';
    const warn = currentImage.coversPoint ? '' : `
      <rect x="0" y="0" width="${W}" height="22" fill="#000" fill-opacity=".55"/>
      <text x="6" y="15" fill="#ffaa00" font-size="11" font-family="sans-serif">
        Point outside ground footprint — marker is extrapolated, not reliable
      </text>`;

    const inFrame = dx >= 0 && dx <= W && dy >= 0 && dy <= H;
    if (inFrame) {
      svgEl.innerHTML = warn + `
        <line x1="${dx-24}" y1="${dy}" x2="${dx+24}" y2="${dy}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <line x1="${dx}" y1="${dy-24}" x2="${dx}" y2="${dy+24}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="14" fill="none" stroke="${stroke}" stroke-width="2" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="3" fill="${stroke}" opacity=".95"/>
        <rect x="${dx+18}" y="${dy-11}" width="60" height="14" rx="3" fill="#0d1117" fill-opacity=".75"/>
        <text x="${dx+21}" y="${dy}" fill="${stroke}" font-size="10" font-family="monospace"
              dominant-baseline="middle">${px.toFixed(0)}, ${py.toFixed(0)}</text>`;
    } else {
      const cx = W/2, cy = H/2;
      const angle = Math.atan2(dy - cy, dx - cx);
      const ex = cx + Math.cos(angle) * Math.min(cx, cy) * 0.85;
      const ey = cy + Math.sin(angle) * Math.min(cx, cy) * 0.85;
      svgEl.innerHTML = warn + `
        <circle cx="${ex}" cy="${ey}" r="8" fill="none" stroke="${stroke}" stroke-width="2" opacity=".7"/>
        <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
        <text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="middle" fill="${stroke}" font-size="11">→</text>`;
    }
  }

  // When autoRotate is on, update the CSS rotation live as the marker moves
  // (no tile rebuild — just change the clip div's transform and padding).
  if (autoRotate && currentImage.pToImage && result) {
    const fx = Math.hypot(
      currentImage.pToImage[0][0],
      currentImage.pToImage[0][1],
      currentImage.pToImage[0][2]
    );
    const newRot = (fx >= 1)
      ? -Math.atan((px - currentImage.width / 2) / fx) * (180 / Math.PI)
      : 0;
    if (Math.abs(newRot - currentRotDeg) > 0.15) {
      currentRotDeg = newRot;
      updateAutoRotateLabel(newRot);
      const clipDiv = document.getElementById('rotClipDiv');
      if (clipDiv) clipDiv.style.transform = `rotate(${newRot}deg)`;
      // Re-derive padding so scrollToMarker stays accurate.
      // In pin-centre mode padding is always 0 — the translate handles positioning.
      if (!pinMarkerCenter) {
        const area2  = document.getElementById('viewerArea');
        const vW2    = area2.clientWidth  || 800;
        const vH2    = area2.clientHeight || 600;
        const rRad   = Math.abs(newRot) * Math.PI / 180;
        const exW    = Math.round((currentContentW * (1 - Math.cos(rRad)) + currentContentH * Math.sin(rRad)) / 2);
        const exH    = Math.round((currentContentH * (1 - Math.cos(rRad)) + currentContentW * Math.sin(rRad)) / 2);
        viewPadX = Math.max(0, Math.floor((vW2 - currentContentW) / 2)) + exW;
        viewPadY = Math.max(0, Math.floor((vH2 - currentContentH) / 2)) + exH;
        const padDiv = document.getElementById('rotPadDiv');
        if (padDiv) padDiv.style.padding = `${viewPadY}px ${viewPadX}px`;
      }
    }
  }

  // Scroll to marker if that option is on (independent of marker visibility).
  scrollToMarker();
}

// ═══════════════════════════════════════════════════════════════
//  VISUAL ZOOM  (viewerZoom multiplier, persists across images)
// ═══════════════════════════════════════════════════════════════
function changeViewZoom(dir) {
  // Find the closest step index, then step in the requested direction.
  let idx = 0, best = Infinity;
  VZOOM_STEPS.forEach((v, i) => { const d = Math.abs(v - viewerZoom); if (d < best) { best = d; idx = i; } });
  idx = Math.max(0, Math.min(VZOOM_STEPS.length - 1, idx + dir));
  viewerZoom = VZOOM_STEPS[idx];

  const lbl = viewerZoom >= 1
    ? (Number.isInteger(viewerZoom) ? viewerZoom + '×' : viewerZoom.toFixed(2).replace(/\.?0+$/,'') + '×')
    : viewerZoom.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + '×';
  document.getElementById('vzoomLabel').textContent = lbl;

  if (currentImage) renderTiles(currentImage, currentZoom);
}

let markerVisible  = true;
let zoomToMarker   = true;

function toggleMarker() {
  markerVisible = !markerVisible;
  const btn = document.getElementById('markerToggleBtn');
  btn.textContent  = markerVisible ? '● Marker' : '○ Marker';
  btn.style.opacity = markerVisible ? '' : '.5';
  refreshDot();   // redraw (will show/hide SVG and respect zoomToMarker)
}

function toggleZoomToMarker() {
  zoomToMarker = !zoomToMarker;
  const btn = document.getElementById('zoomMarkerBtn');
  btn.textContent  = zoomToMarker ? '⊕ Zoom to' : '⊖ Zoom to';
  btn.style.opacity = zoomToMarker ? '' : '.5';
  if (zoomToMarker) scrollToMarker();  // snap immediately if just enabled
}

function togglePinCenter() {
  pinMarkerCenter = !pinMarkerCenter;
  const btn = document.getElementById('pinCenterBtn');
  btn.style.opacity = pinMarkerCenter ? '' : '.5';
  const area = document.getElementById('viewerArea');
  if (area) area.style.overflow = pinMarkerCenter ? 'hidden' : '';
  if (!pinMarkerCenter) {
    // Clear the translate so the image returns to normal centred padding.
    const padDiv = document.getElementById('rotPadDiv');
    if (padDiv) padDiv.style.transform = '';
  }
  if (currentImage) renderTiles(currentImage, currentZoom);
}

// ═══════════════════════════════════════════════════════════════
//  TILE MEMORY CACHE
//  Keeps decoded tile bitmaps alive by holding HTMLImageElement
//  references in a hidden container.  LRU evicts oldest entries
//  when the limit is reached.  Each entry = one (image × zoom).
// ═══════════════════════════════════════════════════════════════
let tileCacheEnabled = false;
let tileCacheMax     = 5;
const tileCacheMap   = new Map();   // "${name}/${zoom}" → { els: HTMLImageElement[], seq: number }
let   tileCacheSeq   = 0;

function tileCacheEvict() {
  while (tileCacheMap.size >= tileCacheMax) {
    let lruKey = null, lruSeq = Infinity;
    for (const [k, v] of tileCacheMap) {
      if (v.seq < lruSeq) { lruSeq = v.seq; lruKey = k; }
    }
    if (!lruKey) break;
    tileCacheMap.get(lruKey).els.forEach(el => el.remove());
    tileCacheMap.delete(lruKey);
  }
}

function preloadToCache(img, zoom) {
  if (!tileCacheEnabled) return;
  const key = `${img.name}/${zoom}`;
  if (tileCacheMap.has(key)) {
    tileCacheMap.get(key).seq = ++tileCacheSeq;   // bump LRU timestamp
    updateCacheInfo();
    return;
  }
  tileCacheEvict();
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const container = document.getElementById('tileCache');
  const els = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      const el = new Image();
      el.src = `${BASE_URL}/${img.name}/${zoom}/${x}/${y}.jpg`;
      container.appendChild(el);
      els.push(el);
    }
  }
  tileCacheMap.set(key, { els, seq: ++tileCacheSeq });
  updateCacheInfo();
}

function updateCacheInfo() {
  const el = document.getElementById('cacheInfo');
  if (!el) return;
  el.textContent = tileCacheMap.size
    ? `${tileCacheMap.size} / ${tileCacheMax} in memory`
    : '';
}

function onCacheToggle() {
  tileCacheEnabled = document.getElementById('cacheEnabledCb').checked;
  document.getElementById('cacheSizeSel').disabled = !tileCacheEnabled;
  if (!tileCacheEnabled) {
    // Release all cached elements.
    tileCacheMap.forEach(v => v.els.forEach(el => el.remove()));
    tileCacheMap.clear();
    updateCacheInfo();
  } else if (currentImage) {
    preloadToCache(currentImage, currentZoom);
  }
}

function onCacheSizeChange() {
  tileCacheMax = Number(document.getElementById('cacheSizeSel').value);
  tileCacheEvict();
  updateCacheInfo();
}

/** Position the viewer so the marker is centred (respects zoomToMarker and pinMarkerCenter). */
function scrollToMarker() {
  if (!zoomToMarker || markerDX < 0 || markerDY < 0) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;

  // When a CSS rotation is applied, the marker's visual position in the
  // scrollable coordinate system differs from its position in content space.
  // Rotate (markerDX, markerDY) around the content centre by the same angle.
  let vx = markerDX, vy = markerDY;
  if (currentRotDeg !== 0 && currentContentW > 0) {
    const cx = currentContentW / 2, cy = currentContentH / 2;
    const θ  = currentRotDeg * Math.PI / 180;
    const dx = markerDX - cx, dy = markerDY - cy;
    vx = cx + dx * Math.cos(θ) - dy * Math.sin(θ);
    vy = cy + dx * Math.sin(θ) + dy * Math.cos(θ);
  }

  if (pinMarkerCenter) {
    // Translate the content div so the marker lands at the exact viewport centre.
    // (viewerArea has overflow:hidden in this mode — no scrolling involved.)
    const tx = area.clientWidth  / 2 - vx;
    const ty = area.clientHeight / 2 - vy;
    const padDiv = document.getElementById('rotPadDiv');
    if (padDiv) padDiv.style.transform = `translate(${tx}px, ${ty}px)`;
    area.scrollLeft = 0;
    area.scrollTop  = 0;
  } else {
    area.scrollLeft = viewPadX + vx - area.clientWidth  / 2;
    area.scrollTop  = viewPadY + vy - area.clientHeight / 2;
  }
}

// ═══════════════════════════════════════════════════════════════
//  DOWNLOAD
// ═══════════════════════════════════════════════════════════════
async function downloadCurrent() {
  if (!currentImage) return;
  const img = currentImage;
  const maxZoom = img.tileResolution.length - 1;
  const {cols, rows} = tileDims(img.width, img.height, maxZoom, img.tileResolution);
  if (!confirm(`Download ${img.name} z${maxZoom} (${cols*rows} tiles → ${img.width}×${img.height}px)?`)) return;

  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  const tasks = [];
  for (let y=0; y<rows; y++) for (let x=0; x<cols; x++) tasks.push([x,y]);

  let failed = 0;
  const BATCH = 20;
  const loadTile = (x,y) => new Promise(res => {
    const el = new Image(); //el.crossOrigin='anonymous';
    el.onload = () => { ctx.drawImage(el, x*TILE_SIZE, (rows-1-y)*TILE_SIZE, TILE_SIZE, TILE_SIZE); res(); };
    el.onerror = () => { failed++; res(); };
    el.src = `${BASE_URL}/${img.name}/${maxZoom}/${x}/${y}.jpg`;
  });

  for (let i=0; i<tasks.length; i+=BATCH) {
    await Promise.all(tasks.slice(i,i+BATCH).map(([x,y])=>loadTile(x,y)));
    document.getElementById('viewerSub').textContent = `Downloading… ${Math.min(i+BATCH,tasks.length)}/${tasks.length}`;
  }

  try {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.92);
    a.download = `${img.name}_z${maxZoom}.jpg`;
    a.click();
  } catch(e) {
    alert(e);
    console.log(e);
    const w = window.open('','_blank');
    const urls = tasks.map(([x,y]) => `${BASE_URL}/${img.name}/${maxZoom}/${x}/${y}.jpg`).join('\n');
    w.document.write(`<pre style="font:12px monospace;background:#0d1117;color:#c9d1d9;padding:16px">${urls}</pre>`);
  }
}

// ═══════════════════════════════════════════════════════════════
//  ARROW KEY NAVIGATION  (moves the search point in MGI space)
// ═══════════════════════════════════════════════════════════════
let autoSwitchTimer = null;

/** Move search point by (dxM, dyM) metres (East=+x, North=+y) in MGI. */
function moveMarker(dxM, dyM) {
  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
  const [newLon, newLat] = wgs84ToMgi.inverse([mx + dxM, my + dyM]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  scheduleAutoSwitch();
}

let lockedImages = false;
function toggleLockImages() {
  lockedImages = !lockedImages;
  const btn = document.getElementById('lockImagesBtn');
  btn.textContent = lockedImages ? '🔒 Locked' : '🔓 Lock image';
  btn.classList.toggle('active', lockedImages);
}

function toggleAutoRotate() {
  autoRotate = !autoRotate;
  const btn = document.getElementById('autoRotateBtn');
  btn.style.opacity = autoRotate ? '' : '.5';
  if (currentImage) renderTiles(currentImage, currentZoom);
}

/** Update the rotate button label to show the applied angle. */
function updateAutoRotateLabel(deg) {
  const btn = document.getElementById('autoRotateBtn');
  if (!btn) return;
  if (!autoRotate || deg === 0) {
    btn.textContent = '↻ Rotate to marker';
  } else {
    btn.textContent = `↻ ${deg >= 0 ? '+' : ''}${deg.toFixed(1)}°`;
  }
}

/** Debounce: after 120 ms of no keys, find the best image for the current direction. */
function scheduleAutoSwitch() {
  if (lockedImages) return;
  if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
  autoSwitchTimer = setTimeout(() => {
    autoSwitchTimer = null;
    if (!currentImage) return;
    const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
    const dir = currentImage.viewDirection;
    let best = null, bestDist = Infinity;
    for (const img of allImages) {
      if (img.viewDirection !== dir) continue;
      const [cx, cy] = img.lookAtMgi;
      const dist = Math.hypot(qx - cx, qy - cy);
      if (dist < bestDist) { bestDist = dist; best = img; }
    }
    if (best && best.name !== currentImage.name) {
      switchToImageBg(best, qx, qy);
    }
  }, 120);
}

/** Preload the lowest-res tile of the candidate; switch once it arrives (max 800 ms). */
function switchToImageBg(img, qx, qy) {
  img = {
    ...img,
    distM:       Math.round(Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1])),
    distCenter:  Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1]),
    coversPoint: img.footprintMgi ? pointInPolygon2D(qx, qy, img.footprintMgi) : true,
  };
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    currentImage = img;
    currentZoom  = Math.min(currentZoom, img.tileResolution.length - 1);
    openViewer(img, currentZoom);
    highlightInList(img.name);
  };
  const probe = new Image();
  probe.onload  = commit;
  probe.onerror = commit;   // switch even on error — remaining tiles may still load
  setTimeout(commit, 800);  // fallback: don't wait forever
  probe.src = `${BASE_URL}/${img.name}/0/0/0.jpg`;
}

function highlightInList(name) {
  const list = document.getElementById('resultsList');
  if (!list._items) return;
  list.querySelectorAll('.result-item').forEach((el, i) => {
    el.classList.toggle('active', list._items[i]?.name === name);
  });
}

// ── Continuous keyboard movement: fires every animation frame while keys held ──
const ARROW_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const keysHeld   = new Set();
let   shiftHeld  = false;
let   keyRafId   = null, lastKeyTs = null;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Shift') { shiftHeld = true; return; }

  // , / . — step through the result list (wraps around)
  if (e.key === ',' || e.key === '.') {
    const list  = document.getElementById('resultsList');
    const items = list?._items;
    if (!items || items.length === 0) return;
    e.preventDefault();
    const curIdx = currentImage ? items.findIndex(it => it.name === currentImage.name) : -1;
    const delta  = e.key === '.' ? 1 : -1;
    const newIdx = ((curIdx + delta) % items.length + items.length) % items.length;
    const elems  = list.querySelectorAll('.result-item');
    if (elems[newIdx]) {
      selectImage(newIdx, elems[newIdx]);
      elems[newIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    return;
  }

  if (!ARROW_KEYS.includes(e.key) || !currentImage) return;
  e.preventDefault();
  keysHeld.add(e.key);
  if (!keyRafId) keyRafId = requestAnimationFrame(keyMoveLoop);
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; return; }
  keysHeld.delete(e.key);
  if (keysHeld.size === 0) lastKeyTs = null;
});

function keyMoveLoop(ts) {
  if (keysHeld.size === 0 || !currentImage) { keyRafId = null; lastKeyTs = null; return; }
  if (lastKeyTs === null) lastKeyTs = ts;
  const dt   = Math.min((ts - lastKeyTs) / 1000, 0.1); // seconds, capped at 100 ms
  lastKeyTs  = ts;
  const step = (shiftHeld ? 300 : 50) * dt; // metres this frame
  let dxM = 0, dyM = 0;
  if (keysHeld.has('ArrowUp'))    dyM += step;
  if (keysHeld.has('ArrowDown'))  dyM -= step;
  if (keysHeld.has('ArrowLeft'))  dxM -= step;
  if (keysHeld.has('ArrowRight')) dxM += step;
  moveMarker(dxM, dyM);
  keyRafId = requestAnimationFrame(keyMoveLoop);
}

// ── Mouse / touch drag: moves the marker by inverting the camera Jacobian ──
let   isDragging    = false;
let   dragStartCX   = 0, dragStartCY = 0;
let   dragStartMX   = 0, dragStartMY = 0;
let   dragInvJ      = null, dragScale = 1;

const viewerAreaEl = document.getElementById('viewerArea');

function beginDrag(clientX, clientY) {
  if (!currentImage) return false;
  const hVal = document.getElementById('heightNum').value;
  const Z    = hVal === '' ? 0 : Number(hVal);
  const invJ = computeInvJacobian(currentImage, searchLat, searchLon, Z);
  if (!invJ) return false;
  isDragging  = true;
  dragStartCX = clientX;
  dragStartCY = clientY;
  [dragStartMX, dragStartMY] = wgs84ToMgi.forward([searchLon, searchLat]);
  dragInvJ    = invJ;
  dragScale   = currentDispScale;
  return true;
}

function applyDrag(clientX, clientY) {
  if (!isDragging || !dragInvJ) return;
  const ddxImg = -(clientX - dragStartCX) / dragScale;
  const ddyImg = -(clientY - dragStartCY) / dragScale;
  const dX = dragInvJ.dXdPx * ddxImg + dragInvJ.dXdPy * ddyImg;
  const dY = dragInvJ.dYdPx * ddxImg + dragInvJ.dYdPy * ddyImg;
  const [newLon, newLat] = wgs84ToMgi.inverse([dragStartMX + dX, dragStartMY + dY]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  scheduleAutoSwitch();
}

function endDrag() {
  isDragging = false;
  dragInvJ   = null;
  viewerAreaEl.style.cursor = 'grab';
}

viewerAreaEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (beginDrag(e.clientX, e.clientY)) {
    viewerAreaEl.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
document.addEventListener('mousemove', e => { if (isDragging) applyDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup',   ()  => { if (isDragging) endDrag(); });

// ── Pinch-to-zoom state ──
let isPinching     = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let pinchLastRatio = 1;

function pinchDist(t) { return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

function setViewerZoomTo(z) {
  viewerZoom = Math.max(VZOOM_STEPS[0], Math.min(VZOOM_STEPS[VZOOM_STEPS.length-1], z));
  const v = viewerZoom;
  const lbl = v >= 1
    ? (Number.isInteger(v) ? v+'×' : v.toFixed(2).replace(/\.?0+$/,'')+'×')
    : v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
  document.getElementById('vzoomLabel').textContent = lbl;
  if (currentImage) renderTiles(currentImage, currentZoom);
}

viewerAreaEl.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isPinching = false;
    if (beginDrag(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault();
  } else if (e.touches.length === 2) {
    isPinching     = true;
    isDragging     = false;
    pinchStartDist = pinchDist(e.touches);
    pinchStartZoom = viewerZoom;
    pinchLastRatio = 1;
    // Anchor the scale to the viewport centre (where the marker lives).
    const el = viewerAreaEl.firstElementChild;
    if (el) {
      const ox = viewerAreaEl.scrollLeft + viewerAreaEl.clientWidth  / 2;
      const oy = viewerAreaEl.scrollTop  + viewerAreaEl.clientHeight / 2;
      el.style.transformOrigin = `${ox}px ${oy}px`;
    }
    e.preventDefault();
  }
}, { passive: false });

viewerAreaEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && !isPinching) {
    applyDrag(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2 && isPinching) {
    pinchLastRatio = pinchDist(e.touches) / pinchStartDist;
    // CSS scale gives smooth real-time feedback; no DOM rebuild until fingers lift.
    const el = viewerAreaEl.firstElementChild;
    if (el) el.style.transform = `scale(${pinchLastRatio})`;
  }
}, { passive: false });

viewerAreaEl.addEventListener('touchend', e => {
  if (isPinching && e.touches.length < 2) {
    // Commit: remove the preview transform and do one proper re-render.
    const el = viewerAreaEl.firstElementChild;
    if (el) { el.style.transform = ''; el.style.transformOrigin = ''; }
    setViewerZoomTo(pinchStartZoom * pinchLastRatio);
    isPinching = false;
  }
  if (e.touches.length === 0) endDrag();
});

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════

// Mouse-wheel zooms in/out, keeping the marker centred.
document.getElementById('viewerArea').addEventListener('wheel', e => {
  if (!currentImage) return;
  e.preventDefault();
  changeViewZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

loadIndex();
</script>
<!-- Hidden container that keeps tile <img> elements alive so their decoded bitmaps
     remain in the browser's image cache between image switches. -->
<div id="tileCache" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;visibility:hidden;"></div>
</body>
</html>
