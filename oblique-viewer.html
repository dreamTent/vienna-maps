let loadedCount = 0;

function getActiveImageSet() {
  const v = document.getElementById('imageSetSel')?.value;
  return IMAGE_SETS.find(s => s.id === v) || IMAGE_SETS[0];
}

function setBadgeLoading(msg) {
  document.getElementById('badgeText').textContent = msg || 'Loading index…';
  document.getElementById('spinner').style.display = '';
  document.querySelectorAll('#badge .dot.ok').forEach(n => n.remove());
}

function setBadgeReady(count) {
  document.getElementById('spinner').style.display = 'none';
  const badge = document.getElementById('badge');
  if (!badge.querySelector('.dot.ok')) {
    badge.insertBefore(Object.assign(document.createElement('div'), {className:'dot ok'}), badge.firstChild);
  }
  document.getElementById('badgeText').textContent = `${count.toLocaleString()} images`;
}

async function onImageSetChange() {
  if (positionSearchTimer) { clearTimeout(positionSearchTimer); positionSearchTimer = null; }
  setBadgeLoading('Switching set…');
  document.getElementById('progressFill').style.display = '';
  document.getElementById('progressFill').style.width = '0%';

  document.getElementById('resultsHeader').style.display = 'none';
  const rl = document.getElementById('resultsList');
  if (rl) { rl.innerHTML = ''; rl._items = []; }
  updatePreloadControls();
  document.getElementById('viewerHeader').style.display = 'none';
  document.getElementById('viewerArea').innerHTML = '<div class="empty-viewer">← Select an image from the list</div>';
  currentImage = null;
  searchResults = [];
  stopListPlay();

  const tc = document.getElementById('tileCache');
  if (tc) tc.innerHTML = '';
  tileCacheMap.clear();

  await loadIndex();
}

async function loadIndex() {
  const setSel = document.getElementById('imageSetSel');
  try {
    if (setSel) setSel.disabled = true;

    const set = getActiveImageSet();
    activeSetId = set.id;
    activeRemoteBaseUrl = set.remoteBaseUrl;

    setBadgeLoading('Loading manifest…');
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('progressFill').style.display = '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('indexStatus').textContent = '';

    let manifest;
    try {
      const manResp = await fetch(set.imageJsonPath);
      if (!manResp.ok) throw new Error(`${set.imageJsonPath}: ${manResp.status}`);
      manifest = await manResp.json();
    } catch (e) {
      console.error(e);
      setBadgeLoading('Manifest failed');
      document.getElementById('badgeText').textContent = `Error: ${set.imageJsonPath}`;
      document.getElementById('searchBtn').disabled = false;
      return;
    }

    const crs = normalizeCrs(manifest.generalImageInfo?.crs);
    proj4.defs('MGI', crs);
    wgs84ToMgi = proj4('EPSG:4326', 'MGI');
    tileSize = Number(manifest.generalImageInfo?.['tile-width']) || Number(manifest.generalImageInfo?.['tile-height']) || 1024;

    const tileFiles = manifest.availableTiles;
    if (!tileFiles || !tileFiles.length) {
      setBadgeLoading('No tiles in manifest');
      document.getElementById('searchBtn').disabled = false;
      return;
    }

    allImages.length = 0;
    loadedCount = 0;
    const total = tileFiles.length;

    await Promise.all(tileFiles.map(async tile => {
      try {
        const resp = await fetch(`${set.tilesDir}/${tile.replace(/\//g,'_')}.json`);
        if (resp.ok) parseImageTile(await resp.json());
      } catch(e) { console.warn('Skipped', tile, e.message); }
      finally {
        loadedCount++;
        document.getElementById('progressFill').style.width = (loadedCount/total*100)+'%';
        document.getElementById('indexStatus').textContent = `${loadedCount}/${total}`;
      }
    }));

    setBadgeReady(allImages.length);
    document.getElementById('indexStatus').textContent = '';
    document.getElementById('progressFill').style.display = 'none';
    document.getElementById('searchBtn').disabled = false;
    updateCacheSizeDropdownLabels();
  } finally {
    if (setSel) setSel.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════
let searchLat = 0, searchLon = 0, searchResults = [];
let positionSearchTimer = null;

/** Debounced re-search when Auto-search is on (typing, arrows, drag). */
function schedulePositionSearch() {
  const cb = document.getElementById('autoSearchOnMoveCb');
  if (!cb || !cb.checked) return;
  clearTimeout(positionSearchTimer);
  positionSearchTimer = setTimeout(() => {
    positionSearchTimer = null;
    if (!document.getElementById('autoSearchOnMoveCb')?.checked) return;
    doSearch({ silent: true });
  }, 200);
}

/**
 * @param {{ silent?: boolean }} [opts] — silent: no alert if lat/lon invalid (auto-search while typing)
 */
function doSearch(opts) {
  const silent = opts && opts.silent === true;
  const raw = document.getElementById('coordsInput').value.trim();
  const parts = raw.split(/[\s,]+/).map(Number);
  if (parts.length < 2 || parts.some(isNaN)) {
    if (!silent) alert('Enter: lat, lon');
    return;
  }
  [searchLat, searchLon] = parts;

  const radiusM = Math.max(1, Number(document.getElementById('radiusInput').value) || 200);
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);

  searchResults = [];
  for (const img of allImages) {
    // Primary metric: distance from query to centerPointOnGround (metres, MGI plane).
    // This ranks images by how central the query point is in the image.
    const [cx, cy] = img.lookAtMgi;
    const distCenter = Math.hypot(qx - cx, qy - cy);
    if (distCenter > radiusM) continue;

    // Keep footprint test only for the visual warning (reliable vs extrapolated dot).
    const coversPoint = img.footprintMgi
      ? pointInPolygon2D(qx, qy, img.footprintMgi)
      : (distCenter < radiusM * 0.5);

    searchResults.push({
      ...img,
      distM: Math.round(distCenter),
      distCenter,
      coversPoint,
    });
  }

  document.getElementById('resultsHeader').style.display = 'flex';
  applySort();   // applySort sets resultCount (supports "X / Y" when filtered)
  if (overlayEnabled && document.getElementById('overlayStretchToMainCb')?.checked && overlayNeighborCount > 0 && currentImage) {
    scheduleRebuildOverlayNeighborLayers();
  }
}

document.getElementById('coordsInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
document.getElementById('coordsInput').addEventListener('input', () => { schedulePositionSearch(); });
document.getElementById('radiusInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

/**
 * Signed horizontal angle of the marker from the image centre.
 *   negative = marker is left  of centre
 *   positive = marker is right of centre
 *   0        = perfectly centred horizontally
 *
 * Uses f_x ≈ ‖P[0, 0:3]‖ (camera matrix row norm ≈ focal length in pixels).
 */
function computeHorizAngle(img, lat, lon, Z) {
  if (!img.pToImage) return NaN;
  const res = projectToPixel(img, lat, lon, Z);
  if (!res) return NaN;
  const [px] = res;
  const P  = img.pToImage;
  const fx = Math.hypot(P[0][0], P[0][1], P[0][2]);
  if (fx < 1) return NaN;
  return Math.atan((px - img.width / 2) / fx) * (180 / Math.PI);
}

function applySort() {
  const key     = document.getElementById('sortSelect').value;
  const Z       = Number(document.getElementById('heightNum').value) || 0;
  const radiusM = Math.max(0, Number(document.getElementById('frameRadiusM')?.value) || 0);

  // Pre-compute the 4 cardinal MGI offsets once (same for every image).
  // These are used to test whether an area of `radiusM` metres around the
  // marker is also fully inside each image's frame.
  let cardinalsMgi = null;
  if (radiusM > 0) {
    const [qmx, qmy] = wgs84ToMgi.forward([searchLon, searchLat]);
    cardinalsMgi = [
      [qmx + radiusM, qmy],
      [qmx - radiusM, qmy],
      [qmx, qmy + radiusM],
      [qmx, qmy - radiusM],
    ].map(([ox, oy]) => { const [oLon, oLat] = wgs84ToMgi.inverse([ox, oy]); return [oLat, oLon]; });
  }

  // Pre-compute signed horizontal angle + in-frame flag for every result.
  // One projectToPixel call per image covers both needs.
  const items = searchResults.map(img => {
    const res = projectToPixel(img, searchLat, searchLon, Z);
    let inFrame = res != null
      && res[0] >= 0 && res[0] <= img.width
      && res[1] >= 0 && res[1] <= img.height;
    // Also require the radius ring to be inside the frame.
    if (inFrame && cardinalsMgi) {
      for (const [oLat, oLon] of cardinalsMgi) {
        const p = projectToPixel(img, oLat, oLon, Z);
        if (!p || p[0] < 0 || p[0] > img.width || p[1] < 0 || p[1] > img.height) {
          inFrame = false;
          break;
        }
      }
    }
    let horizAngle = NaN, vertAngle = NaN;
    if (res && img.pToImage) {
      const P  = img.pToImage;
      const fx = Math.hypot(P[0][0], P[0][1], P[0][2]);
      const fy = Math.hypot(P[1][0], P[1][1], P[1][2]);
      if (fx >= 1) horizAngle = Math.atan((res[0] - img.width  / 2) / fx) * (180 / Math.PI);
      if (fy >= 1) vertAngle  = Math.atan((res[1] - img.height / 2) / fy) * (180 / Math.PI);
      // vertAngle sign: positive = marker below image centre (near ground / closer to camera)
      //                 negative = marker above image centre (farther away / sky direction)
    }
    // Orbit angle: bearing from the marker to the camera (0-360°).
    const orbitAngle = isFinite(horizAngle)
      ? ((img.heading + horizAngle + 180) % 360 + 360) % 360
      : ((img.heading + 180) % 360);
    return { ...img, horizAngle, vertAngle, inFrame, orbitAngle };
  });

  // ── Apply filters ────────────────────────────────────────────────────────────
  const hideOOF  = document.getElementById('filterOutOfFrame')?.checked;
  const vMinRaw  = document.getElementById('vertAngleMin')?.value;
  const vMaxRaw  = document.getElementById('vertAngleMax')?.value;
  const vMin     = (vMinRaw !== '' && vMinRaw != null) ? Number(vMinRaw) : -Infinity;
  const vMax     = (vMaxRaw !== '' && vMaxRaw != null) ? Number(vMaxRaw) : +Infinity;
  const hasVert  = isFinite(vMin) || isFinite(vMax);

  let visible = items;
  if (hideOOF)  visible = visible.filter(it => it.inFrame);
  if (hasVert)  visible = visible.filter(it =>
    isFinite(it.vertAngle) && it.vertAngle >= vMin && it.vertAngle <= vMax
  );

  visible.sort((a, b) =>
    key === 'heading' ? a.heading - b.heading :
    key === 'dir'     ? (a.viewDirection - b.viewDirection) || (a.distCenter - b.distCenter) :
    key === 'margin'  ? Math.abs(a.horizAngle) - Math.abs(b.horizAngle) :  // most centred first
    key === 'rotate'  ? a.orbitAngle - b.orbitAngle :
    /* dist */          a.distCenter - b.distCenter
  );

  // Update the count badge: "X / Y" when any filter is active, plain "Y" otherwise.
  const anyFilter = hideOOF || hasVert;
  const countEl   = document.getElementById('resultCount');
  if (countEl) {
    countEl.textContent = (anyFilter && visible.length !== items.length)
      ? `${visible.length} / ${items.length}`
      : items.length;
  }

  renderList(visible);
}

// ═══════════════════════════════════════════════════════════════
//  LIST RENDER
// ═══════════════════════════════════════════════════════════════
function headingArrow(deg) {
  return ['↑','↗','→','↘','↓','↙','←','↖'][Math.round(deg/45)%8];
}

function compassSVG(heading) {
  const r = heading * Math.PI / 180;
  const s = Math.sin(r), c = Math.cos(r);
  const tx = 20+14*s, ty = 20-14*c, bx = 20-8*s, by = 20+8*c;
  const px = -c*3, py = -s*3;
  return `<svg class="compass" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <line x1="20" y1="3"  x2="20" y2="7"  stroke="#8b949e" stroke-width="1.2"/>
    <line x1="20" y1="33" x2="20" y2="37" stroke="#8b949e" stroke-width="1.2"/>
    <line x1="3"  y1="20" x2="7"  y2="20" stroke="#8b949e" stroke-width="1.2"/>
    <line x1="33" y1="20" x2="37" y2="20" stroke="#8b949e" stroke-width="1.2"/>
    <text x="20" y="10" text-anchor="middle" fill="#8b949e" font-size="5" font-family="sans-serif">N</text>
    <polygon points="${tx},${ty} ${20+px},${20+py} ${bx},${by} ${20-px},${20-py}" fill="#388bfd" opacity=".9"/>
    <circle cx="20" cy="20" r="2" fill="#c9d1d9"/>
  </svg>`;
}

function renderList(items) {
  stopListPlay();
  const list = document.getElementById('resultsList');
  list._items = items;
  if (!items.length) {
    list.innerHTML = '<div class="no-results">No images in this radius.</div>';
    updatePreloadControls();
    return;
  }

  list.innerHTML = items.map((img, idx) => {
    const distStr = (img.distM >= 1000 ? (img.distM/1000).toFixed(2)+' km' : img.distM+' m') +
      (img.coversPoint ? ' ✓' : '');
    const tag = `<span class="tag ${DIR_TAG[img.viewDirection]||'tag-x'}">${DIR_LABELS[img.viewDirection]||'Dir'+img.viewDirection}</span>`;
    const ha  = img.horizAngle;
    const angleStr = (ha != null && isFinite(ha))
      ? `<span title="Horizontal angle of marker from image centre (−=left, +=right)"
               style="color:${Math.abs(ha)<=10?'var(--success)':Math.abs(ha)<=25?'var(--warning)':'var(--error)'}">
           ${ha>=0?'+':''}${ha.toFixed(1)}°</span>`
      : '';
    const va  = img.vertAngle;
    const vertStr = (va != null && isFinite(va))
      ? `<span title="Vertical angle of marker from image centre (−=above centre / far, +=below centre / near camera)"
               style="color:${Math.abs(va)<=10?'var(--success)':Math.abs(va)<=25?'var(--warning)':'var(--error)'}">
           ↕ ${va>=0?'+':''}${va.toFixed(1)}°</span>`
      : '';
    const orbitStr = (img.orbitAngle != null && isFinite(img.orbitAngle))
      ? `<span title="Bearing from marker to camera (orbit position, 0°=N clockwise)"
               style="color:var(--text-dim)">⟳ ${img.orbitAngle.toFixed(1)}°</span>`
      : '';
    const outsideStr = img.inFrame === false
      ? `<span style="color:var(--error);font-weight:600;font-size:.72rem"
               title="The marker projects outside this image's frame">⚠ outside image</span>`
      : '';
    return `<div class="result-item${img.inFrame===false?' result-outside':''}" data-idx="${idx}" onclick="selectImage(${idx},this)">
      <div class="thumb-wrap">
        <img src="${img.remoteBaseUrl}/${img.name}/0/0/0.jpg" loading="lazy" onerror="this.style.opacity='.15'">
      </div>
      <div class="result-meta">
        <div class="result-name">${img.name}</div>
        <div class="result-sub">
          ${tag}
          <span>${headingArrow(img.heading)} ${img.heading.toFixed(1)}°</span>
          <span>${distStr}</span>
          ${angleStr}
          ${vertStr}
          ${orbitStr}
          ${outsideStr}
        </div>
      </div>
      <div class="compass-wrap">${compassSVG(img.heading)}</div>
    </div>`;
  }).join('');
  updatePreloadControls();
  if (document.getElementById('preloadListAutoCb')?.checked) {
    requestAnimationFrame(() => preloadResultList());
  }
}

/** Enable/disable Preload list / Auto-preload when cache or list changes. */
function updatePreloadControls() {
  const btn = document.getElementById('preloadListBtn');
  const autoCb = document.getElementById('preloadListAutoCb');
  if (!btn) return;
  const list = document.getElementById('resultsList');
  const hasItems = list?._items && list._items.length > 0;
  btn.disabled = !tileCacheEnabled || !hasItems;
  if (autoCb) autoCb.disabled = !tileCacheEnabled;
}

let preloadRunId = 0;

function setPreloadProgress(msg) {
  const el = document.getElementById('preloadProgress');
  if (el) el.textContent = msg || '';
}

/**
 * Fill the tile cache with as many current list images as the limit allows.
 * Preloads in reverse list order so LRU ends up keeping the best-ranked rows first.
 * Shows tile download progress in #preloadProgress.
 */
async function preloadResultList() {
  if (!tileCacheEnabled) {
    alert('Enable "Keep images in memory" first.');
    return;
  }
  const list = document.getElementById('resultsList');
  const items = list?._items;
  if (!items || !items.length) return;

  preloadRunId++;
  const run = preloadRunId;

  const zBase = currentImage
    ? getTileZoomIndex(currentImage)
    : (tileZoomAuto && items[0]
      ? computeAutoTileZoom(items[0])
      : Math.min(currentZoom, items[0].tileResolution.length - 1));

  const tasks = [];
  for (let i = items.length - 1; i >= 0; i--) {
    const img = items[i];
    const z = Math.min(zBase, img.tileResolution.length - 1);
    tasks.push({ img, z });
  }

  let totalTiles = 0;
  for (const { img, z } of tasks) {
    const key = `${img.setId}/${img.name}/${z}`;
    if (tileCacheMap.has(key)) continue;
    const { cols, rows } = tileDims(img.width, img.height, z, img.tileResolution);
    totalTiles += cols * rows;
  }

  const btn = document.getElementById('preloadListBtn');
  const preloadAllCached = totalTiles === 0;

  if (preloadAllCached) {
    setPreloadProgress('Preload: already in cache');
    setTimeout(() => { if (run === preloadRunId) setPreloadProgress(''); }, 2200);
    return;
  }

  let loadedTiles = 0;
  const bump = () => {
    if (run !== preloadRunId) return;
    loadedTiles++;
    setPreloadProgress(`Preloading… ${loadedTiles}/${totalTiles} tiles`);
  };

  setPreloadProgress(`Preloading… 0/${totalTiles} tiles`);
  if (btn) btn.disabled = true;

  try {
    for (const { img, z } of tasks) {
      if (run !== preloadRunId) break;
      const key = `${img.setId}/${img.name}/${z}`;
      if (tileCacheMap.has(key)) {
        tileCacheMap.get(key).seq = ++tileCacheSeq;
        updateCacheInfo();
        continue;
      }
      await preloadToCacheWithTileProgress(img, z, bump);
    }
    if (run === preloadRunId) {
      setPreloadProgress(`Done · ${loadedTiles}/${totalTiles} tiles`);
      setTimeout(() => { if (run === preloadRunId) setPreloadProgress(''); }, 2800);
    }
  } finally {
    if (run === preloadRunId) updatePreloadControls();
  }
}

function onPreloadListAutoChange() {
  if (document.getElementById('preloadListAutoCb')?.checked) preloadResultList();
}

// ═══════════════════════════════════════════════════════════════
//  VIEWER
// ═══════════════════════════════════════════════════════════════
let currentImage = null, currentZoom = 1;
/** When true, main image tile zoom follows viewport, visual zoom, image size, and DPR (see computeAutoTileZoom). */
let tileZoomAuto = true;
let currentDispScale = 1;  // display pixels per image pixel — SAME at all zoom levels
let currentContentW  = 0, currentContentH = 0; // content div size (after scale, before rotation)
let currentRotDeg    = 0;  // degrees currently applied as CSS rotate() on the clip div
let currentEdgeTrimDisp = 0; // displayed trim in px to hide source-edge black bleed
let autoRotate       = false; // when true, rotate so the marker is horizontally centred
let pinMarkerCenter  = false; // when true, translate the image so the marker is at the exact viewport centre
let overlayEnabled   = false; // when true, stack images as layers aligned at the marker
let overlayMaxLayers = 3;    // max layers kept in the overlay stack
let overlayBlurFixed = 0;   // px applied to every layer behind the main (top) layer
let overlayBlurStep  = 0;    // px of blur added per layer further back (0 = no blur)
let overlayNeighborCount = 0; // 0,4,8,… preloaded nearest images shown when reproject is on
let overlayNeighborGen   = 0; // invalidates async neighbor rebuild
let listPlayTimer    = null;
let listPlayActive   = false;

// Visual zoom (multiplier on top of the fit-to-viewer base scale).
// Kept between image switches; independent of tile quality zoom.
const VZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 6, 8, 12, 16, 20, 24, 30];
let viewerZoom = 1;          // current visual zoom multiplier
let viewPadX = 0, viewPadY = 0;  // centering padding so marker-scroll math is correct
let markerDX = -1, markerDY = -1; // last marker display position (px), -1 = no marker
const IMAGE_EDGE_TRIM_SOURCE_PX = 6;

let imageSwitchGen = 0;

function selectImage(idx, el) {
  imageSwitchGen++;
  const gen = imageSwitchGen;
  document.querySelectorAll('.result-item.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentImage = document.getElementById('resultsList')._items[idx];
  const maxZoom = currentImage.tileResolution.length - 1;
  currentZoom = Math.min(currentZoom, maxZoom);

  const img = currentImage;
  const z = getTileZoomIndex(img);
  if (document.getElementById('waitFullTilesSwitchCb')?.checked) {
    waitForAllTilesDecoded(img, z).then(() => {
      if (gen !== imageSwitchGen) return;
      openViewer(img, z);
    });
    return;
  }
  openViewer(img, z);
}

function openViewer(img, zoom) {
  document.getElementById('viewerHeader').style.display = 'flex';
  const distStr = `${img.distM} m to image center` + (img.coversPoint ? ' · inside footprint ✓' : '');
  document.getElementById('viewerTitle').textContent = img.name;
  document.getElementById('viewerSub').textContent =
    `${DIR_LABELS[img.viewDirection]||''} · ${img.heading.toFixed(1)}° · ${distStr} · ${img.width}×${img.height}px`;

  // Only initialise Z on the very first image load; preserve the user's value thereafter.

  // zoom pills (auto + z0…zn)
  const pills = document.getElementById('zoomPills');
  const autoTitle = 'Fit pyramid level to viewport, visual zoom (×), image size, and display density; tiles are ' + tileSize + '×' + tileSize + ' px';
  pills.innerHTML =
    `<span class="zoom-pill" data-z="auto" title="${autoTitle}">auto</span>` +
    img.tileResolution.map((res, zi) => {
      const { cols, rows } = tileDims(img.width, img.height, zi, img.tileResolution);
      return `<span class="zoom-pill" data-z="${zi}" title="${cols}×${rows} tiles">
      z${zi} <small style="opacity:.6">${cols * rows}t</small>
    </span>`;
    }).join('');
  pills.onclick = e => {
    const pill = e.target.closest('.zoom-pill');
    if (!pill) return;
    if (pill.dataset.z === 'auto') {
      tileZoomAuto = true;
      const zEff = getTileZoomIndex(img);
      renderTiles(img, zEff);
      preloadToCache(img, zEff);
      updateCacheSizeDropdownLabels();
      return;
    }
    const zVal = Number(pill.dataset.z);
    tileZoomAuto = false;
    currentZoom = zVal;
    renderTiles(img, zVal);
    preloadToCache(img, zVal);
    updateCacheSizeDropdownLabels();
  };

  renderTiles(img, zoom);
  preloadToCache(img, zoom);
}

function tileDims(width, height, zoom, tileResolution) {
  const res = tileResolution[zoom];
  return { cols: Math.ceil(width/(tileSize*res)), rows: Math.ceil(height/(tileSize*res)) };
}

function edgeTrimDisplayPx(scale) {
  // Conservative rounding avoids 1px border bleed at fractional zoom scales.
  return Math.max(0, Math.ceil(IMAGE_EDGE_TRIM_SOURCE_PX * scale));
}

/** Device pixels per source image pixel (full frame fit × visual zoom × devicePixelRatio). */
function screenPxPerImagePx(img) {
  const area = document.getElementById('viewerArea');
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  return baseScale * viewerZoom * (window.devicePixelRatio || 1);
}

/**
 * Auto tile zoom: coarsest pyramid level z where decoded tile pixels are not upsampled past
 * ~1 device pixel per source pixel. Tiles are tileSize×tileSize JPEGs; level z covers
 * tileSize × tileResolution[z] source pixels per tile (see tileDims).
 */
function computeAutoTileZoom(img) {
  const scale = screenPxPerImagePx(img);
  const tr = img.tileResolution;
  const maxZ = tr.length - 1;
  const eps = 1e-9;
  for (let zi = 0; zi <= maxZ; zi++) {
    if (tr[zi] * scale <= 1 + eps) return zi;
  }
  return maxZ;
}

function getTileZoomIndex(img) {
  if (!img) return 0;
  const maxZ = img.tileResolution.length - 1;
  if (tileZoomAuto) return computeAutoTileZoom(img);
  return Math.max(0, Math.min(maxZ, currentZoom));
}

/** Sync zoom pill classes: auto pill, manual active z, or auto-loaded border on effective z. */
function updateZoomPillClasses() {
  const pills = document.getElementById('zoomPills');
  if (!pills || !currentImage) return;
  const zEff = getTileZoomIndex(currentImage);
  pills.querySelectorAll('.zoom-pill').forEach(p => {
    const dz = p.dataset.z;
    if (dz === 'auto') {
      p.classList.toggle('active', tileZoomAuto);
      return;
    }
    const zi = Number(dz);
    p.classList.toggle('active', !tileZoomAuto && zi === currentZoom);
    p.classList.toggle('auto-loaded', tileZoomAuto && zi === zEff);
  });
}

/** Pre-decode all JPEG tiles for an image at zoom (same URLs as the viewer). Used before swapping views. */
function waitForAllTilesDecoded(img, zoom) {
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  if (cols * rows === 0) return Promise.resolve();
  const promises = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      promises.push(new Promise(resolve => {
        const el = new Image();
        const done = () => resolve();
        el.onload = done;
        el.onerror = done;
        el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
        if (el.complete && el.naturalWidth) done();
      }));
    }
  }
  return Promise.all(promises);
}

function computeAutoRotDegForImage(img) {
  let rotDeg = 0;
  if (autoRotate && img.pToImage) {
    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (proj) {
      const fx = Math.hypot(img.pToImage[0][0], img.pToImage[0][1], img.pToImage[0][2]);
      if (fx >= 1) rotDeg = -Math.atan((proj[0] - img.width / 2) / fx) * (180 / Math.PI);
    }
  }
  return rotDeg;
}

/** Neighbor preview layer (no dot overlay, no rotPadDiv id) — same tile layout as the main stack. */
function buildNeighborLayerDOM(img, zoom) {
  const area = document.getElementById('viewerArea');
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  const scale = baseScale * viewerZoom;
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];
  const dispTileW = Math.max(1, Math.round(tileSize * res * scale));
  const edgeTrimDisp = edgeTrimDisplayPx(scale);
  const topBlack = Math.ceil((rows * tileSize * res - img.height) * scale);
  const contentW = Math.floor(img.width * scale);
  const contentH = Math.floor(img.height * scale);
  const clipW = Math.max(1, contentW - edgeTrimDisp);
  const clipH = Math.max(1, contentH - edgeTrimDisp);
  const rotDeg = computeAutoRotDegForImage(img);
  let tilesHtml = '';
  for (let y = rows - 1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="lazy" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }
  const rotStyle = rotDeg !== 0
    ? `transform:rotate(${rotDeg}deg);transform-origin:50% 50%;`
    : '';
  const innerHtml = `
    <div style="position:relative;width:${clipW}px;height:${clipH}px;overflow:hidden;${rotStyle}">
      <div style="position:absolute;top:-${topBlack + edgeTrimDisp}px;left:0;">
        <div class="tile-canvas-wrap">${tilesHtml}</div>
      </div>
    </div>`;
  const layer = document.createElement('div');
  layer.style.cssText = 'position:absolute;left:0;top:0;will-change:transform;';
  layer.innerHTML = innerHtml;
  layer._overlayImage = img;
  layer._overlayRotDeg = rotDeg;
  layer._overlayNeighborPreview = true;
  layer._overlayHistory = false;
  return layer;
}

function removeNeighborPreviewLayers(area) {
  Array.from(area.children).forEach(el => {
    if (el._overlayNeighborPreview) el.remove();
  });
}

/** Max user-navigated layers; neighbor previews do not count toward this cap. */
function trimOverlayHistory() {
  const area = document.getElementById('viewerArea');
  if (!area || !overlayEnabled) return;
  while (true) {
    const userLayers = Array.from(area.children).filter(el => el._overlayHistory);
    if (userLayers.length <= overlayMaxLayers) break;
    userLayers[0].remove();
  }
}

/**
 * Candidates for “next” views: same view direction as main first, then nearest ground-centre (MGI) to marker.
 */
function pickNearestNeighborImages(mainImg, count) {
  if (!count || !mainImg || !allImages.length) return [];
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
  const dir = mainImg.viewDirection;
  return allImages
    .filter(img => img.name !== mainImg.name)
    .map(img => {
      const [cx, cy] = img.lookAtMgi;
      const dist = Math.hypot(qx - cx, qy - cy);
      const sameDir = img.viewDirection === dir ? 0 : 1;
      return { img, dist, sameDir };
    })
    .sort((a, b) => a.sameDir - b.sameDir || a.dist - b.dist)
    .slice(0, count)
    .map(x => x.img);
}

function scheduleRebuildOverlayNeighborLayers() {
  overlayNeighborGen++;
  const gen = overlayNeighborGen;
  const area = document.getElementById('viewerArea');
  if (!area || !overlayEnabled) return;

  const n = overlayNeighborCount;
  const reproject = document.getElementById('overlayStretchToMainCb')?.checked;
  if (!n || !reproject || !currentImage) {
    removeNeighborPreviewLayers(area);
    syncOverlayLayersToMarker();
    updateOverlayBlur();
    return;
  }

  const neighbors = pickNearestNeighborImages(currentImage, n);
  if (!neighbors.length) {
    removeNeighborPreviewLayers(area);
    syncOverlayLayersToMarker();
    updateOverlayBlur();
    return;
  }

  // Nearest-neighbor previews (behind the stack when Reproject to main is on) always load z0
  // tiles so resolution does not follow the main image’s zoom pills.
  const z = 0;
  const mainName = currentImage.name;

  // Keep previous neighbor layers visible until the new set has finished decoding.

  Promise.all(neighbors.map(img => waitForAllTilesDecoded(img, z))).then(() => {
    if (gen !== overlayNeighborGen) return;
    if (!overlayEnabled || !currentImage || currentImage.name !== mainName) return;
    const area2 = document.getElementById('viewerArea');
    if (!area2) return;

    removeNeighborPreviewLayers(area2);

    const mainEl = area2.lastElementChild;
    if (!mainEl || !mainEl._overlayHistory) return;

    const sorted = [...neighbors].sort((a, b) => {
      const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
      const da = Math.hypot(qx - a.lookAtMgi[0], qy - a.lookAtMgi[1]);
      const db = Math.hypot(qx - b.lookAtMgi[0], qy - b.lookAtMgi[1]);
      return db - da;
    });

    for (const img of sorted) {
      const layer = buildNeighborLayerDOM(img, z);
      area2.insertBefore(layer, mainEl);
    }
    neighbors.forEach(img => preloadToCache(img, z));
    syncOverlayLayersToMarker();
    updateOverlayBlur();
  });
}

function onOverlayNeighborPreloadChange() {
  const sel = document.getElementById('overlayNeighborPreloadSel');
  overlayNeighborCount = sel ? Math.max(0, Number(sel.value) || 0) : 0;
  if (overlayEnabled) scheduleRebuildOverlayNeighborLayers();
}

function onOverlayReprojectChange() {
  if (!overlayEnabled) return;
  syncOverlayLayersToMarker();
  scheduleRebuildOverlayNeighborLayers();
}

function renderTiles(img, zoom) {
  const area = document.getElementById('viewerArea');
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const res = img.tileResolution[zoom];

  // Base scale fits image to viewer; viewerZoom multiplies on top of that.
  const viewW = area.clientWidth  || 800;
  const viewH = area.clientHeight || 600;
  const baseScale = Math.min(viewW / img.width, viewH / img.height);
  const scale     = baseScale * viewerZoom;
  const dispTileW = Math.max(1, Math.round(tileSize * res * scale));
  const edgeTrimDisp = edgeTrimDisplayPx(scale);
  currentDispScale = scale;
  currentEdgeTrimDisp = edgeTrimDisp;

  const topBlack = Math.ceil((rows * tileSize * res - img.height) * scale);
  const contentW = Math.floor(img.width  * scale);
  const contentH = Math.floor(img.height * scale);
  const clipW = Math.max(1, contentW - edgeTrimDisp);
  const clipH = Math.max(1, contentH - edgeTrimDisp);

  // Compute auto-rotation: rotate so the marker is horizontally centred.
  // rotDeg = -horizAngle  (positive horizAngle → marker right of centre → rotate left).
  let rotDeg = 0;
  if (autoRotate && img.pToImage) {
    const hVal = document.getElementById('heightNum').value;
    const Z = hVal === '' ? 0 : Number(hVal);
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (proj) {
      const fx = Math.hypot(img.pToImage[0][0], img.pToImage[0][1], img.pToImage[0][2]);
      if (fx >= 1) rotDeg = -Math.atan((proj[0] - img.width / 2) / fx) * (180 / Math.PI);
    }
  }
  currentRotDeg   = rotDeg;
  currentContentW = contentW;
  currentContentH = contentH;
  updateAutoRotateLabel(rotDeg);

  // In pin-centre or overlay mode padding is irrelevant (translate handles positioning).
  // In normal mode centre the image, with extra room for rotated corners.
  if (pinMarkerCenter || overlayEnabled) {
    viewPadX = 0;
    viewPadY = 0;
  } else {
    const rotRad    = Math.abs(rotDeg) * Math.PI / 180;
    const rotExtraW = Math.round((contentW * (1 - Math.cos(rotRad)) + contentH * Math.sin(rotRad)) / 2);
    const rotExtraH = Math.round((contentH * (1 - Math.cos(rotRad)) + contentW * Math.sin(rotRad)) / 2);
    viewPadX = Math.max(0, Math.floor((viewW - contentW) / 2)) + rotExtraW;
    viewPadY = Math.max(0, Math.floor((viewH - contentH) / 2)) + rotExtraH;
  }

  let tilesHtml = '';
  for (let y = rows - 1; y >= 0; y--) {
    tilesHtml += '<div class="tile-row">';
    for (let x = 0; x < cols; x++) {
      tilesHtml += `<img src="${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg"
                        width="${dispTileW}" height="${dispTileW}"
                        loading="lazy" onerror="this.style.opacity='.1'"
                        title="z${zoom}/${x}/${y}">`;
    }
    tilesHtml += '</div>';
  }

  const rotStyle = rotDeg !== 0
    ? `transform:rotate(${rotDeg}deg);transform-origin:50% 50%;`
    : '';

  // IDs rotPadDiv / rotClipDiv / dotOverlay always belong to the CURRENT (topmost) layer.
  // refreshDot() and scrollToMarker() use these IDs so they always affect the live layer.
  const innerHtml = `
    <div id="rotClipDiv" style="position:relative;width:${clipW}px;height:${clipH}px;overflow:hidden;${rotStyle}">
      <div style="position:absolute;top:-${topBlack + edgeTrimDisp}px;left:0;">
        <div class="tile-canvas-wrap">${tilesHtml}</div>
      </div>
      <svg id="dotOverlay" style="position:absolute;top:0;left:0;width:${clipW}px;height:${clipH}px;overflow:visible;pointer-events:none;"></svg>
    </div>`;

  if (overlayEnabled) {
    // ── OVERLAY MODE ─────────────────────────────────────────────
    // Strip IDs from the previous current layer so only the new layer owns them.
    const oldPad  = area.querySelector('#rotPadDiv');
    const oldClip = area.querySelector('#rotClipDiv');
    const oldSvg  = area.querySelector('#dotOverlay');
    if (oldPad)  oldPad.removeAttribute('id');
    if (oldClip) oldClip.removeAttribute('id');
    if (oldSvg)  oldSvg.remove();   // old layers get no dot overlay

    // Append the new layer; it is position:absolute so all layers stack on top of each other.
    const layer = document.createElement('div');
    layer.id    = 'rotPadDiv';
    layer.style.cssText = 'position:absolute;left:0;top:0;will-change:transform;';
    layer.innerHTML = innerHtml;
    layer._overlayImage = img;
    layer._overlayRotDeg = rotDeg;
    layer._overlayHistory = true;
    layer._overlayNeighborPreview = false;
    area.appendChild(layer);

    trimOverlayHistory();
    scheduleRebuildOverlayNeighborLayers();
  } else {
    // ── SINGLE MODE ──────────────────────────────────────────────
    area.innerHTML = `
      <div id="rotPadDiv" style="padding:${viewPadY}px ${viewPadX}px;min-width:max-content;background:#080a0e;">
        ${innerHtml}
      </div>`;
  }

  refreshDot();
  updateCacheSizeDropdownLabels();
  updateZoomPillClasses();
}

// ═══════════════════════════════════════════════════════════════
//  DOT OVERLAY  – called whenever height changes or image changes
// ═══════════════════════════════════════════════════════════════
/** Called when the ground-elevation (Z) slider/input changes.
 *  Refreshes the dot projection AND re-evaluates the inFrame filter so the
 *  "Hide ⚠ outside" checkbox reflects the new elevation immediately. */
function onHeightChange() {
  refreshDot();
  if (searchResults.length) applySort();
}

function refreshDot() {
  const svgEl = document.getElementById('dotOverlay');
  if (!svgEl || !currentImage) return;

  // Z=0 is the valid ground datum for this dataset — do not fall back to 170.
  const hVal = document.getElementById('heightNum').value;
  const groundHeight = hVal === '' ? 0 : Number(hVal);
  const result = projectToPixel(currentImage, searchLat, searchLon, groundHeight);

  svgEl.style.display = markerVisible ? '' : 'none';
  svgEl.innerHTML = '';

  // Always compute display position — needed by scrollToMarker even when hidden.
  if (!result) { markerDX = markerDY = -1; return; }
  const [px, py] = result;

  const scale = currentDispScale;
  const dx = px * scale;
  const dy = py * scale - currentEdgeTrimDisp;
  markerDX = dx;
  markerDY = dy;

  // Draw the marker only when visible.
  if (markerVisible) {
    const W = Math.max(1, Math.floor(currentImage.width  * scale) - currentEdgeTrimDisp);
    const H = Math.max(1, Math.floor(currentImage.height * scale) - currentEdgeTrimDisp);

    const stroke = currentImage.coversPoint ? '#ff3333' : '#ffaa00';
    const warn = currentImage.coversPoint ? '' : `
      <rect x="0" y="0" width="${W}" height="22" fill="#000" fill-opacity=".55"/>
      <text x="6" y="15" fill="#ffaa00" font-size="11" font-family="sans-serif">
        Point outside ground footprint — marker is extrapolated, not reliable
      </text>`;

    const inFrame = dx >= 0 && dx <= W && dy >= 0 && dy <= H;
    if (inFrame) {
      svgEl.innerHTML = warn + `
        <line x1="${dx-24}" y1="${dy}" x2="${dx+24}" y2="${dy}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <line x1="${dx}" y1="${dy-24}" x2="${dx}" y2="${dy+24}" stroke="${stroke}" stroke-width="1.5" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="14" fill="none" stroke="${stroke}" stroke-width="2" opacity=".85"/>
        <circle cx="${dx}" cy="${dy}" r="3" fill="${stroke}" opacity=".95"/>
        <rect x="${dx+18}" y="${dy-11}" width="60" height="14" rx="3" fill="#0d1117" fill-opacity=".75"/>
        <text x="${dx+21}" y="${dy}" fill="${stroke}" font-size="10" font-family="monospace"
              dominant-baseline="middle">${px.toFixed(0)}, ${py.toFixed(0)}</text>`;
    } else {
      const cx = W/2, cy = H/2;
      const angle = Math.atan2(dy - cy, dx - cx);
      const ex = cx + Math.cos(angle) * Math.min(cx, cy) * 0.85;
      const ey = cy + Math.sin(angle) * Math.min(cx, cy) * 0.85;
      svgEl.innerHTML = warn + `
        <circle cx="${ex}" cy="${ey}" r="8" fill="none" stroke="${stroke}" stroke-width="2" opacity=".7"/>
        <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
        <text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="middle" fill="${stroke}" font-size="11">→</text>`;
    }
  }

  // When autoRotate is on, update the CSS rotation live as the marker moves
  // (no tile rebuild — just change the clip div's transform and padding).
  if (autoRotate && currentImage.pToImage && result) {
    const fx = Math.hypot(
      currentImage.pToImage[0][0],
      currentImage.pToImage[0][1],
      currentImage.pToImage[0][2]
    );
    const newRot = (fx >= 1)
      ? -Math.atan((px - currentImage.width / 2) / fx) * (180 / Math.PI)
      : 0;
    if (Math.abs(newRot - currentRotDeg) > 0.15) {
      currentRotDeg = newRot;
      updateAutoRotateLabel(newRot);
      const clipDiv = document.getElementById('rotClipDiv');
      if (clipDiv) clipDiv.style.transform = `rotate(${newRot}deg)`;
      // Re-derive padding so scrollToMarker stays accurate.
      // In pin-centre mode padding is always 0 — the translate handles positioning.
      if (!pinMarkerCenter) {
        const area2  = document.getElementById('viewerArea');
        const vW2    = area2.clientWidth  || 800;
        const vH2    = area2.clientHeight || 600;
        const rRad   = Math.abs(newRot) * Math.PI / 180;
        const exW    = Math.round((currentContentW * (1 - Math.cos(rRad)) + currentContentH * Math.sin(rRad)) / 2);
        const exH    = Math.round((currentContentH * (1 - Math.cos(rRad)) + currentContentW * Math.sin(rRad)) / 2);
        viewPadX = Math.max(0, Math.floor((vW2 - currentContentW) / 2)) + exW;
        viewPadY = Math.max(0, Math.floor((vH2 - currentContentH) / 2)) + exH;
        const padDiv = document.getElementById('rotPadDiv');
        if (padDiv) padDiv.style.padding = `${viewPadY}px ${viewPadX}px`;
      }
    }
  }

  // Scroll to marker if that option is on (independent of marker visibility).
  scrollToMarker();
}

// ═══════════════════════════════════════════════════════════════
//  VISUAL ZOOM  (viewerZoom multiplier, persists across images)
// ═══════════════════════════════════════════════════════════════
function changeViewZoom(dir) {
  // Find the closest step index, then step in the requested direction.
  let idx = 0, best = Infinity;
  VZOOM_STEPS.forEach((v, i) => { const d = Math.abs(v - viewerZoom); if (d < best) { best = d; idx = i; } });
  idx = Math.max(0, Math.min(VZOOM_STEPS.length - 1, idx + dir));
  viewerZoom = VZOOM_STEPS[idx];

  const lbl = viewerZoom >= 1
    ? (Number.isInteger(viewerZoom) ? viewerZoom + '×' : viewerZoom.toFixed(2).replace(/\.?0+$/,'') + '×')
    : viewerZoom.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + '×';
  document.getElementById('vzoomLabel').textContent = lbl;

  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
}

let markerVisible  = true;
let zoomToMarker   = true;

function toggleMarker() {
  markerVisible = !markerVisible;
  const btn = document.getElementById('markerToggleBtn');
  btn.textContent  = markerVisible ? '● Marker' : '○ Marker';
  btn.style.opacity = markerVisible ? '' : '.5';
  refreshDot();   // redraw (will show/hide SVG and respect zoomToMarker)
}

function toggleZoomToMarker() {
  zoomToMarker = !zoomToMarker;
  const btn = document.getElementById('zoomMarkerBtn');
  btn.textContent  = zoomToMarker ? '⊕ Zoom to' : '⊖ Zoom to';
  btn.style.opacity = zoomToMarker ? '' : '.5';
  if (zoomToMarker) scrollToMarker();  // snap immediately if just enabled
}

function togglePinCenter() {
  pinMarkerCenter = !pinMarkerCenter;
  const btn = document.getElementById('pinCenterBtn');
  btn.style.opacity = pinMarkerCenter ? '' : '.5';
  const area = document.getElementById('viewerArea');
  if (area) area.style.overflow = (pinMarkerCenter || overlayEnabled) ? 'hidden' : '';
  if (!pinMarkerCenter) {
    // Clear the translate so the image returns to normal centred padding.
    const padDiv = document.getElementById('rotPadDiv');
    if (padDiv) padDiv.style.transform = '';
  }
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
}

// ═══════════════════════════════════════════════════════════════
//  TILE MEMORY CACHE
//  Keeps decoded tile bitmaps alive by holding HTMLImageElement
//  references in a hidden container.  LRU evicts oldest entries
//  when the limit is reached.  Each entry = one (image × zoom).
// ═══════════════════════════════════════════════════════════════
let tileCacheEnabled = false;
let tileCacheMax     = 5;
const tileCacheMap   = new Map();   // "${name}/${zoom}" → { els: HTMLImageElement[], seq: number }
let   tileCacheSeq   = 0;

function tileCacheEvict() {
  while (tileCacheMap.size >= tileCacheMax) {
    let lruKey = null, lruSeq = Infinity;
    for (const [k, v] of tileCacheMap) {
      if (v.seq < lruSeq) { lruSeq = v.seq; lruKey = k; }
    }
    if (!lruKey) break;
    tileCacheMap.get(lruKey).els.forEach(el => el.remove());
    tileCacheMap.delete(lruKey);
  }
}

function preloadToCache(img, zoom) {
  if (!tileCacheEnabled) return;
  const key = `${img.setId}/${img.name}/${zoom}`;
  if (tileCacheMap.has(key)) {
    tileCacheMap.get(key).seq = ++tileCacheSeq;   // bump LRU timestamp
    updateCacheInfo();
    return;
  }
  tileCacheEvict();
  const {cols, rows} = tileDims(img.width, img.height, zoom, img.tileResolution);
  const container = document.getElementById('tileCache');
  const els = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      const el = new Image();
      el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
      container.appendChild(el);
      els.push(el);
    }
  }
  tileCacheMap.set(key, { els, seq: ++tileCacheSeq });
  updateCacheInfo();
}

/**
 * Same as preloadToCache, but waits for each tile to load (or fail) and calls onTile once per tile.
 */
async function preloadToCacheWithTileProgress(img, zoom, onTile) {
  if (!tileCacheEnabled) return;
  const key = `${img.setId}/${img.name}/${zoom}`;
  if (tileCacheMap.has(key)) {
    tileCacheMap.get(key).seq = ++tileCacheSeq;
    updateCacheInfo();
    return;
  }
  tileCacheEvict();
  const { cols, rows } = tileDims(img.width, img.height, zoom, img.tileResolution);
  const container = document.getElementById('tileCache');
  const els = [];
  const promises = [];
  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      promises.push(
        new Promise(resolve => {
          const el = new Image();
          const done = () => {
            onTile?.();
            resolve();
          };
          el.onload = done;
          el.onerror = done;
          el.src = `${img.remoteBaseUrl}/${img.name}/${zoom}/${x}/${y}.jpg`;
          container.appendChild(el);
          els.push(el);
        })
      );
    }
  }
  tileCacheMap.set(key, { els, seq: ++tileCacheSeq });
  updateCacheInfo();
  await Promise.all(promises);
}

/** Approx. decoded memory per image at tile zoom z (viewer z pills). Values beyond z4 use z4. */
const CACHE_MB_PER_IMAGE_AT_Z = [0.3, 1, 3, 11, 42];

function mbPerCachedImageAtZoom(z) {
  const zi = Math.min(Math.max(0, z), CACHE_MB_PER_IMAGE_AT_Z.length - 1);
  return CACHE_MB_PER_IMAGE_AT_Z[zi];
}

function effectiveCacheEstimateZoom() {
  if (!currentImage) return 4;
  return getTileZoomIndex(currentImage);
}

function formatApproximateMemory(totalMb) {
  if (totalMb >= 1024) {
    const gb = totalMb / 1024;
    return `~${gb >= 10 ? gb.toFixed(1) : gb.toFixed(2)} GB`;
  }
  if (totalMb >= 100) return `~${Math.round(totalMb)} MB`;
  if (totalMb >= 10) return `~${totalMb.toFixed(1)} MB`;
  return `~${totalMb.toFixed(2)} MB`;
}

/** Refresh cache limit dropdown labels from current tile zoom (z pill). */
function updateCacheSizeDropdownLabels() {
  const sel = document.getElementById('cacheSizeSel');
  if (!sel) return;
  const z = effectiveCacheEstimateZoom();
  const mbEach = mbPerCachedImageAtZoom(z);
  for (let i = 0; i < sel.options.length; i++) {
    const opt = sel.options[i];
    const n = Number(opt.value);
    if (!isFinite(n)) continue;
    opt.textContent = `${n} images (${formatApproximateMemory(mbEach * n)})`;
  }
  const zNote = currentImage
    ? (tileZoomAuto
      ? `auto (currently z${z} ≈ ${mbEach} MB per image)`
      : `current tile zoom z${z} (≈ ${mbEach} MB per image)`)
    : 'z4 (≈ 42 MB per image) until an image is open';
  sel.title = `Max number of (image × zoom) pairs kept in memory. Totals use ${zNote}; change the quality pill to update.`;

  const lab = document.getElementById('cacheEnabledLabel');
  if (lab) {
    lab.title = 'Hold decoded tile bitmaps in memory so previously viewed images re-display instantly. '
      + 'Approx. size per image: z0≈0.3 MB, z1≈1 MB, z2≈3 MB, z3≈11 MB, z4≈42 MB. '
      + 'The limit dropdown updates when you change quality (auto or z0–zn).';
  }

  const pb = document.getElementById('preloadListBtn');
  if (pb) {
    if (currentImage) {
      const zz = getTileZoomIndex(currentImage);
      const zzLabel = tileZoomAuto ? `auto (z${zz})` : `z${zz}`;
      pb.title = `Decode tiles for every image in the current list into memory, up to the max above. Order keeps best-ranked matches (LRU). Uses current quality (${zzLabel}).`;
    } else {
      pb.title = 'Decode tiles for every image in the current list into memory, up to the max above. Order keeps best-ranked matches (LRU). When no image is open, zoom follows the first list row per image.';
    }
  }
}

function updateCacheInfo() {
  const el = document.getElementById('cacheInfo');
  if (!el) return;
  el.textContent = tileCacheMap.size
    ? `${tileCacheMap.size} / ${tileCacheMax} in memory`
    : '';
}

function onCacheToggle() {
  tileCacheEnabled = document.getElementById('cacheEnabledCb').checked;
  document.getElementById('cacheSizeSel').disabled = !tileCacheEnabled;
  updateCacheSizeDropdownLabels();
  if (!tileCacheEnabled) {
    // Release all cached elements.
    tileCacheMap.forEach(v => v.els.forEach(el => el.remove()));
    tileCacheMap.clear();
    updateCacheInfo();
  } else if (currentImage) {
    preloadToCache(currentImage, getTileZoomIndex(currentImage));
  }
  updatePreloadControls();
}

function onCacheSizeChange() {
  tileCacheMax = Number(document.getElementById('cacheSizeSel').value);
  tileCacheEvict();
  updateCacheInfo();
}

/**
 * Marker position (px) in rotPadDiv / scroll space, including clip rotation — same math as scroll/pinch.
 */
function markerVisualInPadPx() {
  if (markerDX < 0 || markerDY < 0) return null;
  let vx = markerDX, vy = markerDY;
  if (currentRotDeg !== 0 && currentContentW > 0) {
    const cx = currentContentW / 2, cy = currentContentH / 2;
    const θ  = currentRotDeg * Math.PI / 180;
    const dx = markerDX - cx, dy = markerDY - cy;
    vx = cx + dx * Math.cos(θ) - dy * Math.sin(θ);
    vy = cy + dx * Math.sin(θ) + dy * Math.cos(θ);
  }
  return { vx, vy };
}

/** ⊙ Pin centre: translate that keeps the marker in the viewport middle (for pinch we must keep this with scale). */
function getPinCenterTranslateParts() {
  if (!pinMarkerCenter || !zoomToMarker) return null;
  const o = markerVisualInPadPx();
  if (!o) return null;
  const area = document.getElementById('viewerArea');
  if (!area) return null;
  return {
    vx: o.vx,
    vy: o.vy,
    tx: area.clientWidth / 2 - o.vx,
    ty: area.clientHeight / 2 - o.vy,
  };
}

/**
 * ⧉ Overlay uses translate(tx,ty) on each layer. Pinch preview must combine that with scale — scale-only
 * drops the translate and misaligns the image.
 */
function getMarkerCentreTranslateParts() {
  if (!zoomToMarker) return null;
  const o = markerVisualInPadPx();
  if (!o) return null;
  const area = document.getElementById('viewerArea');
  if (!area) return null;
  return {
    vx: o.vx,
    vy: o.vy,
    tx: area.clientWidth / 2 - o.vx,
    ty: area.clientHeight / 2 - o.vy,
  };
}

function getPinchPanParts() {
  if (overlayEnabled && zoomToMarker) return getMarkerCentreTranslateParts();
  return getPinCenterTranslateParts();
}

/**
 * ⧉ Overlay: each layer uses its own camera so the ground marker is centred in that view
 * (layers are offset behind each other). Optional “Reproject to main” applies a plane
 * homography (ground Z) + CSS matrix3d so back layers match the main image’s perspective.
 */
function syncOverlayLayersToMarker() {
  if (!overlayEnabled || !zoomToMarker) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const viewW = area.clientWidth || 800;
  const viewH = area.clientHeight || 600;
  const layers = Array.from(area.children);
  const hVal = document.getElementById('heightNum').value;
  const Z = hVal === '' ? 0 : Number(hVal);

  const main = currentImage;
  const reprojectToMain = document.getElementById('overlayStretchToMainCb')?.checked;

  layers.forEach((layer, idx) => {
    const img = layer._overlayImage;
    if (!img) return;
    const isTop = idx === layers.length - 1;
    const rotDeg = isTop ? currentRotDeg : (layer._overlayRotDeg || 0);
    const baseFit = Math.min(viewW / img.width, viewH / img.height);
    const scale = baseFit * viewerZoom;
    const proj = projectToPixel(img, searchLat, searchLon, Z);
    if (!proj) return;
    let vx = proj[0] * scale;
    let vy = proj[1] * scale;
    const cw = Math.round(img.width * scale);
    const ch = Math.round(img.height * scale);
    if (rotDeg !== 0 && cw > 0 && ch > 0) {
      const cx = cw / 2, cy = ch / 2;
      const θ = rotDeg * Math.PI / 180;
      const dx0 = vx - cx, dy0 = vy - cy;
      vx = cx + dx0 * Math.cos(θ) - dy0 * Math.sin(θ);
      vy = cy + dx0 * Math.sin(θ) + dy0 * Math.cos(θ);
    }

    const tx = viewW / 2 - vx;
    const ty = viewH / 2 - vy;

    if (isTop || !reprojectToMain || !main || !main.pToImage || !img.pToImage || img === main) {
      layer.style.transformOrigin = '';
      layer.style.transform = `translate(${tx}px, ${ty}px)`;
      return;
    }

    const Hnm = homographyLayerNativeToMainNative(img, main, Z);
    if (!Hnm) {
      layer.style.transformOrigin = '';
      layer.style.transform = `translate(${tx}px, ${ty}px)`;
      return;
    }

    const Wn = img.width, Hn = img.height;
    const nc = [[0, 0], [Wn, 0], [Wn, Hn], [0, Hn]];
    const srcPad = [];
    const dstVp = [];
    for (let k = 0; k < 4; k++) {
      const pm = applyHomography2D(Hnm, nc[k][0], nc[k][1]);
      if (!pm) {
        layer.style.transformOrigin = '';
        layer.style.transform = `translate(${tx}px, ${ty}px)`;
        return;
      }
      const vp = mainNativeToViewportPx(pm[0], pm[1], viewW, viewH);
      if (!vp) {
        layer.style.transformOrigin = '';
        layer.style.transform = `translate(${tx}px, ${ty}px)`;
        return;
      }
      srcPad.push(overlayNativeToPadXY(nc[k][0], nc[k][1], scale, rotDeg, cw, ch));
      dstVp.push([vp.x, vp.y]);
    }

    const Hvp = homographyFrom4Points2D(srcPad, dstVp);
    if (!Hvp) {
      layer.style.transformOrigin = '';
      layer.style.transform = `translate(${tx}px, ${ty}px)`;
      return;
    }

    layer.style.transformOrigin = '0 0';
    layer.style.transform = homography3x3ToMatrix3dString(Hvp);
  });
  updateOverlayBlur();
}

/** Position the viewer so the marker is centred (respects zoomToMarker and pinMarkerCenter). */
function scrollToMarker() {
  if (!zoomToMarker || markerDX < 0 || markerDY < 0) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;

  if (overlayEnabled) {
    syncOverlayLayersToMarker();
    area.scrollLeft = 0;
    area.scrollTop = 0;
    return;
  }

  const o = markerVisualInPadPx();
  if (!o) return;

  if (pinMarkerCenter) {
    const tx = area.clientWidth / 2 - o.vx;
    const ty = area.clientHeight / 2 - o.vy;
    const padDiv = document.getElementById('rotPadDiv');
    if (padDiv) padDiv.style.transform = `translate(${tx}px, ${ty}px)`;
    area.scrollLeft = 0;
    area.scrollTop = 0;
  } else {
    area.scrollLeft = viewPadX + o.vx - area.clientWidth / 2;
    area.scrollTop = viewPadY + o.vy - area.clientHeight / 2;
  }
}

// ═══════════════════════════════════════════════════════════════
//  DOWNLOAD
// ═══════════════════════════════════════════════════════════════
async function downloadCurrent() {
  if (!currentImage) return;
  const img = currentImage;
  const maxZoom = img.tileResolution.length - 1;
  const {cols, rows} = tileDims(img.width, img.height, maxZoom, img.tileResolution);
  if (!confirm(`Download ${img.name} z${maxZoom} (${cols*rows} tiles → ${img.width}×${img.height}px)?`)) return;

  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  const tasks = [];
  for (let y=0; y<rows; y++) for (let x=0; x<cols; x++) tasks.push([x,y]);

  let failed = 0;
  const BATCH = 20;
  const loadTile = (x,y) => new Promise(res => {
    const el = new Image(); //el.crossOrigin='anonymous';
    el.onload = () => { ctx.drawImage(el, x*tileSize, (rows-1-y)*tileSize, tileSize, tileSize); res(); };
    el.onerror = () => { failed++; res(); };
    el.src = `${img.remoteBaseUrl}/${img.name}/${maxZoom}/${x}/${y}.jpg`;
  });

  for (let i=0; i<tasks.length; i+=BATCH) {
    await Promise.all(tasks.slice(i,i+BATCH).map(([x,y])=>loadTile(x,y)));
    document.getElementById('viewerSub').textContent = `Downloading… ${Math.min(i+BATCH,tasks.length)}/${tasks.length}`;
  }

  try {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.92);
    a.download = `${img.name}_z${maxZoom}.jpg`;
    a.click();
  } catch(e) {
    alert(e);
    console.log(e);
    const w = window.open('','_blank');
    const urls = tasks.map(([x,y]) => `${img.remoteBaseUrl}/${img.name}/${maxZoom}/${x}/${y}.jpg`).join('\n');
    w.document.write(`<pre style="font:12px monospace;background:#0d1117;color:#c9d1d9;padding:16px">${urls}</pre>`);
  }
}

// ═══════════════════════════════════════════════════════════════
//  ARROW KEY NAVIGATION  (moves the search point in MGI space)
// ═══════════════════════════════════════════════════════════════
let autoSwitchTimer = null;
/** Last time performAutoSwitch ran when “Switch while moving” is on (throttle, not debounce). */
let lastThrottledAutoSwitch = 0;

/** Move search point by (dxM, dyM) metres (East=+x, North=+y) in MGI ground plane. */
function moveMarker(dxM, dyM) {
  const [mx, my] = wgs84ToMgi.forward([searchLon, searchLat]);
  const [newLon, newLat] = wgs84ToMgi.inverse([mx + dxM, my + dyM]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
  schedulePositionSearch();
}

let lockedImages = false;
function toggleLockImages() {
  lockedImages = !lockedImages;
  const btn = document.getElementById('lockImagesBtn');
  btn.textContent = lockedImages ? '🔒 Locked' : '🔓 Lock image';
  btn.classList.toggle('active', lockedImages);
}

function toggleOverlay() {
  overlayEnabled = !overlayEnabled;
  const btn = document.getElementById('overlayBtn');
  btn.style.opacity = overlayEnabled ? '' : '.5';
  document.getElementById('overlayLayersSel').disabled  = !overlayEnabled;
  document.getElementById('overlayBlurInput').disabled  = !overlayEnabled;
  document.getElementById('overlayBlurFixedInput').disabled = !overlayEnabled;
  document.getElementById('overlayBlurUnit').style.opacity = overlayEnabled ? '' : '.4';
  const obw = document.getElementById('overlayBlurBaseWrap');
  if (obw) obw.style.opacity = overlayEnabled ? '' : '.4';
  const st = document.getElementById('overlayStretchToMainCb');
  if (st) st.disabled = !overlayEnabled;
  const nsel = document.getElementById('overlayNeighborPreloadSel');
  if (nsel) {
    nsel.disabled = !overlayEnabled;
    nsel.style.opacity = overlayEnabled ? '' : '.4';
    if (overlayEnabled) overlayNeighborCount = Number(nsel.value) || 0;
  }
  const area = document.getElementById('viewerArea');
  if (area) area.style.overflow = (pinMarkerCenter || overlayEnabled) ? 'hidden' : '';
  if (overlayEnabled) {
    // Start with a clean slate so old single-image content doesn't linger.
    if (area) area.innerHTML = '';
    if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
  } else {
    // Back to single-image mode — re-render clears all layers via area.innerHTML.
    if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
  }
}

function onOverlayLayersChange() {
  overlayMaxLayers = Number(document.getElementById('overlayLayersSel').value);
  const area = document.getElementById('viewerArea');
  if (area && overlayEnabled) {
    trimOverlayHistory();
    scheduleRebuildOverlayNeighborLayers();
  }
}

function onOverlayBlurChange() {
  overlayBlurFixed = Math.max(0, Number(document.getElementById('overlayBlurFixedInput')?.value) || 0);
  overlayBlurStep = Math.max(0, Number(document.getElementById('overlayBlurInput').value) || 0);
  updateOverlayBlur();
}

/** Apply blur to all overlay layers: top layer is sharp; each layer behind gets
 *  overlayBlurFixed + stepsBack * overlayBlurStep (px).
 *  Explicit z-index keeps paint order correct when transform + filter both create stacking contexts
 *  (otherwise blurred layers can paint above the sharp top layer, especially with stacked transforms). */
function updateOverlayBlur() {
  if (!overlayEnabled) return;
  const area = document.getElementById('viewerArea');
  if (!area) return;
  const layers = Array.from(area.children);
  const n = layers.length;
  layers.forEach((layer, i) => {
    if (layer._overlayImage) layer.style.zIndex = String(i + 1);
    const stepsBack = n - 1 - i;   // 0 for current top layer
    const blurPx = (stepsBack > 0 ? overlayBlurFixed : 0) + stepsBack * overlayBlurStep;
    layer.style.filter = blurPx > 0 ? `blur(${blurPx}px)` : '';
  });
}

function toggleAutoRotate() {
  autoRotate = !autoRotate;
  const btn = document.getElementById('autoRotateBtn');
  btn.style.opacity = autoRotate ? '' : '.5';
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
}

/** Update the rotate button label to show the applied angle. */
function updateAutoRotateLabel(deg) {
  const btn = document.getElementById('autoRotateBtn');
  if (!btn) return;
  if (!autoRotate || deg === 0) {
    btn.textContent = '↻ Rotate to marker';
  } else {
    btn.textContent = `↻ ${deg >= 0 ? '+' : ''}${deg.toFixed(1)}°`;
  }
}

const AUTO_SWITCH_MS = 120;

/** Find best same-direction image and switch if closer than current. */
function performAutoSwitch() {
  if (!currentImage) return;
  const [qx, qy] = wgs84ToMgi.forward([searchLon, searchLat]);
  const dir = currentImage.viewDirection;
  let best = null, bestDist = Infinity;
  for (const img of allImages) {
    if (img.viewDirection !== dir) continue;
    const [cx, cy] = img.lookAtMgi;
    const dist = Math.hypot(qx - cx, qy - cy);
    if (dist < bestDist) { bestDist = dist; best = img; }
  }
  if (best && best.name !== currentImage.name) {
    switchToImageBg(best, qx, qy);
  }
}

/**
 * When “Switch while moving” is on: throttle (runs during drag/held keys, at most every 120 ms).
 * When off: debounce (waits 120 ms after last event — only when you pause / release).
 */
function scheduleAutoSwitch() {
  if (lockedImages) return;
  const whileMoving = document.getElementById('autoSwitchWhileMovingCb')?.checked !== false;

  if (!whileMoving) {
    if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
    autoSwitchTimer = setTimeout(() => {
      autoSwitchTimer = null;
      performAutoSwitch();
    }, AUTO_SWITCH_MS);
    return;
  }

  const now = Date.now();
  if (now - lastThrottledAutoSwitch >= AUTO_SWITCH_MS) {
    lastThrottledAutoSwitch = now;
    performAutoSwitch();
    return;
  }
  if (autoSwitchTimer) return;
  autoSwitchTimer = setTimeout(() => {
    autoSwitchTimer = null;
    lastThrottledAutoSwitch = Date.now();
    performAutoSwitch();
  }, AUTO_SWITCH_MS - (now - lastThrottledAutoSwitch));
}

/** Auto-switch to a better image for the same view direction; honours Wait full tiles / fast probe. */
function switchToImageBg(img, qx, qy) {
  imageSwitchGen++;
  const gen = imageSwitchGen;
  img = {
    ...img,
    distM:       Math.round(Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1])),
    distCenter:  Math.hypot(qx - img.lookAtMgi[0], qy - img.lookAtMgi[1]),
    coversPoint: img.footprintMgi ? pointInPolygon2D(qx, qy, img.footprintMgi) : true,
  };
  const z = getTileZoomIndex(img);

  if (document.getElementById('waitFullTilesSwitchCb')?.checked) {
    waitForAllTilesDecoded(img, z).then(() => {
      if (gen !== imageSwitchGen) return;
      currentImage = img;
      currentZoom = z;
      openViewer(img, z);
      highlightInList(img.name);
    });
    return;
  }

  let done = false;
  const commit = () => {
    if (done) return; done = true;
    if (gen !== imageSwitchGen) return;
    currentImage = img;
    currentZoom = z;
    openViewer(img, z);
    highlightInList(img.name);
  };
  const probe = new Image();
  probe.onload  = commit;
  probe.onerror = commit;
  setTimeout(commit, 800);
  probe.src = `${img.remoteBaseUrl}/${img.name}/0/0/0.jpg`;
}

function highlightInList(name) {
  const list = document.getElementById('resultsList');
  if (!list._items) return;
  list.querySelectorAll('.result-item').forEach((el, i) => {
    el.classList.toggle('active', list._items[i]?.name === name);
  });
}

/** delta: -1 = previous (, key), +1 = next (. key) — wraps */
function stepResultList(delta) {
  const list  = document.getElementById('resultsList');
  const items = list?._items;
  if (!items || items.length === 0) return;
  const curIdx = currentImage ? items.findIndex(it => it.name === currentImage.name) : -1;
  const newIdx = ((curIdx + delta) % items.length + items.length) % items.length;
  const elems  = list.querySelectorAll('.result-item');
  if (elems[newIdx]) {
    selectImage(newIdx, elems[newIdx]);
    elems[newIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function stopListPlay() {
  if (listPlayTimer != null) {
    clearInterval(listPlayTimer);
    listPlayTimer = null;
  }
  listPlayActive = false;
  const btn = document.getElementById('listPlayBtn');
  if (btn) btn.textContent = '▶';
}

function startListPlay() {
  stopListPlay();
  const sec = Number(document.getElementById('listPlayIntervalSec')?.value);
  const ms  = Math.max(50, Math.round((Number.isFinite(sec) && sec > 0 ? sec : 1) * 1000));
  listPlayTimer = setInterval(() => stepResultList(1), ms);
  listPlayActive = true;
  const btn = document.getElementById('listPlayBtn');
  if (btn) btn.textContent = '⏸';
}

function toggleListPlay() {
  if (listPlayActive) stopListPlay();
  else startListPlay();
}

function restartListPlayIfActive() {
  if (listPlayActive) startListPlay();
}

// ── Continuous keyboard movement: fires every animation frame while keys held ──
const ARROW_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const keysHeld   = new Set();
let   shiftHeld  = false;
let   keyRafId   = null, lastKeyTs = null;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Shift') { shiftHeld = true; return; }

  // Visual zoom: + and # (German QWERTZ), also = − numpad (when an image is open)
  if (currentImage) {
    const k = e.key;
    const zoomIn =
      k === '+' || k === '=' || e.code === 'NumpadAdd';
    const zoomOut =
      k === '#' || k === '-' || e.code === 'NumpadSubtract';
    if (zoomIn || zoomOut) {
      e.preventDefault();
      changeViewZoom(zoomIn ? 1 : -1);
      return;
    }
  }

  // , / . — step through the result list (wraps around)
  if (e.key === ',' || e.key === '.') {
    e.preventDefault();
    stepResultList(e.key === '.' ? 1 : -1);
    return;
  }

  if (!ARROW_KEYS.includes(e.key) || !currentImage) return;
  e.preventDefault();
  keysHeld.add(e.key);
  if (!keyRafId) keyRafId = requestAnimationFrame(keyMoveLoop);
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; return; }
  keysHeld.delete(e.key);
  if (keysHeld.size === 0) lastKeyTs = null;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (ARROW_KEYS.includes(e.key) && document.getElementById('autoSwitchWhileMovingCb')?.checked === false) {
    scheduleAutoSwitch();
  }
});

function keyMoveLoop(ts) {
  if (keysHeld.size === 0 || !currentImage) { keyRafId = null; lastKeyTs = null; return; }
  if (lastKeyTs === null) lastKeyTs = ts;
  const dt   = Math.min((ts - lastKeyTs) / 1000, 0.1); // seconds, capped at 100 ms
  lastKeyTs  = ts;
  const step = (shiftHeld ? 300 : 50) * dt; // metres this frame
  // View-relative: current image heading is camera view direction on the ground (° from north).
  const h = currentImage.heading * Math.PI / 180;
  const sin = Math.sin, cos = Math.cos;
  let dxM = 0, dyM = 0;
  if (keysHeld.has('ArrowUp')) {
    dxM += step * sin(h);
    dyM += step * cos(h);
  }
  if (keysHeld.has('ArrowDown')) {
    dxM -= step * sin(h);
    dyM -= step * cos(h);
  }
  if (keysHeld.has('ArrowLeft')) {
    const hl = h - Math.PI / 2;
    dxM += step * sin(hl);
    dyM += step * cos(hl);
  }
  if (keysHeld.has('ArrowRight')) {
    const hr = h + Math.PI / 2;
    dxM += step * sin(hr);
    dyM += step * cos(hr);
  }
  moveMarker(dxM, dyM);
  keyRafId = requestAnimationFrame(keyMoveLoop);
}

// ── Mouse / touch drag: moves the marker by inverting the camera Jacobian ──
let   isDragging    = false;
let   dragStartCX   = 0, dragStartCY = 0;
let   dragStartMX   = 0, dragStartMY = 0;
let   dragInvJ      = null, dragScale = 1;

const viewerAreaEl = document.getElementById('viewerArea');

if (typeof ResizeObserver !== 'undefined' && viewerAreaEl) {
  let viewerResizeRaf = 0;
  new ResizeObserver(() => {
    if (!currentImage || !tileZoomAuto) return;
    cancelAnimationFrame(viewerResizeRaf);
    viewerResizeRaf = requestAnimationFrame(() => {
      const z = getTileZoomIndex(currentImage);
      renderTiles(currentImage, z);
      if (tileCacheEnabled) preloadToCache(currentImage, z);
    });
  }).observe(viewerAreaEl);
}

function beginDrag(clientX, clientY) {
  if (!currentImage) return false;
  const hVal = document.getElementById('heightNum').value;
  const Z    = hVal === '' ? 0 : Number(hVal);
  const invJ = computeInvJacobian(currentImage, searchLat, searchLon, Z);
  if (!invJ) return false;
  isDragging  = true;
  dragStartCX = clientX;
  dragStartCY = clientY;
  [dragStartMX, dragStartMY] = wgs84ToMgi.forward([searchLon, searchLat]);
  dragInvJ    = invJ;
  dragScale   = currentDispScale;
  return true;
}

function applyDrag(clientX, clientY) {
  if (!isDragging || !dragInvJ) return;
  const ddxImg = -(clientX - dragStartCX) / dragScale;
  const ddyImg = -(clientY - dragStartCY) / dragScale;
  const dX = dragInvJ.dXdPx * ddxImg + dragInvJ.dXdPy * ddyImg;
  const dY = dragInvJ.dYdPx * ddxImg + dragInvJ.dYdPy * ddyImg;
  const [newLon, newLat] = wgs84ToMgi.inverse([dragStartMX + dX, dragStartMY + dY]);
  searchLat = newLat;
  searchLon = newLon;
  document.getElementById('coordsInput').value = `${newLat.toFixed(7)}, ${newLon.toFixed(7)}`;
  refreshDot();
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked !== false) scheduleAutoSwitch();
  schedulePositionSearch();
}

function endDrag() {
  isDragging = false;
  dragInvJ   = null;
  viewerAreaEl.style.cursor = 'grab';
  if (document.getElementById('autoSwitchWhileMovingCb')?.checked === false) scheduleAutoSwitch();
}

viewerAreaEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (beginDrag(e.clientX, e.clientY)) {
    viewerAreaEl.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
document.addEventListener('mousemove', e => { if (isDragging) applyDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup',   ()  => { if (isDragging) endDrag(); });

// ── Pinch-to-zoom state ──
let isPinching     = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let pinchLastRatio = 1;

function pinchDist(t) { return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

function getPinchLayerEl() {
  return document.getElementById('rotPadDiv');
}

function setViewerZoomTo(z) {
  viewerZoom = Math.max(VZOOM_STEPS[0], Math.min(VZOOM_STEPS[VZOOM_STEPS.length-1], z));
  const v = viewerZoom;
  const lbl = v >= 1
    ? (Number.isInteger(v) ? v+'×' : v.toFixed(2).replace(/\.?0+$/,'')+'×')
    : v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
  document.getElementById('vzoomLabel').textContent = lbl;
  if (currentImage) renderTiles(currentImage, getTileZoomIndex(currentImage));
}

viewerAreaEl.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isPinching = false;
    if (beginDrag(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault();
  } else if (e.touches.length === 2) {
    isPinching     = true;
    isDragging     = false;
    pinchStartDist = Math.max(pinchDist(e.touches), 1e-6);
    pinchStartZoom = viewerZoom;
    pinchLastRatio = 1;
    const el = getPinchLayerEl();
    if (el) {
      const pan = getPinchPanParts();
      if (pan) {
        el.style.transformOrigin = `${pan.vx}px ${pan.vy}px`;
      } else {
        const m = markerVisualInPadPx();
        if (m) {
          el.style.transformOrigin = `${m.vx}px ${m.vy}px`;
        } else {
          el.style.transformOrigin = `${viewerAreaEl.scrollLeft + viewerAreaEl.clientWidth / 2}px ${viewerAreaEl.scrollTop + viewerAreaEl.clientHeight / 2}px`;
        }
      }
    }
    e.preventDefault();
  }
}, { passive: false });

viewerAreaEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && !isPinching) {
    applyDrag(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2 && isPinching) {
    pinchLastRatio = pinchDist(e.touches) / pinchStartDist;
    const el = getPinchLayerEl();
    if (!el) return;
    const pan = getPinchPanParts();
    if (pan) {
      el.style.transform = `translate(${pan.tx}px, ${pan.ty}px) scale(${pinchLastRatio})`;
    } else {
      el.style.transform = `scale(${pinchLastRatio})`;
    }
  }
}, { passive: false });

function commitPinchPreview() {
  if (!isPinching) return;
  const el = getPinchLayerEl();
  if (el) {
    el.style.transform = '';
    el.style.transformOrigin = '';
  }
  setViewerZoomTo(pinchStartZoom * pinchLastRatio);
  isPinching = false;
}

viewerAreaEl.addEventListener('touchend', e => {
  if (isPinching && e.touches.length < 2) {
    commitPinchPreview();
  }
  if (e.touches.length === 0) endDrag();
});

viewerAreaEl.addEventListener('touchcancel', e => {
  if (isPinching) commitPinchPreview();
  if (e.touches.length === 0) endDrag();
});

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════

// Mouse-wheel zooms in/out, keeping the marker centred.
document.getElementById('viewerArea').addEventListener('wheel', e => {
  if (!currentImage) return;
  e.preventDefault();
  changeViewZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

loadIndex();
</script>
