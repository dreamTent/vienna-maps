<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vienna Oblique — Home</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #388bfd;
      --accent2: #58a6ff;
      --text: #c9d1d9;
      --text-dim: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p.sub {
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-bottom: 22px;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a {
      display: block;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent2);
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }
    a:hover {
      border-color: var(--accent);
      background: rgba(56, 139, 253, 0.08);
    }
    a span {
      display: block;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vienna Oblique</h1>
    <p class="sub">Choose a viewer:</p>
    <ul>
      <li>
        <a href="oblique-viewer.html">
          Map and Finder
          <span>Vienna Oblique Aerial Photography Map and Finder</span>
        </a>
      </li>
      <li>
        <a href="oblique-viewer-closest.html">
          4 directions
          <span>Vienna Oblique – 4 Directions</span>
        </a>
      </li>
      <li>
        <a href="infinite-scroll.html">
          infinite-scroll
          <span>infinite-scroll</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
